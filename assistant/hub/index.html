<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* the look (2026-10-26): the field app's own setting (localStorage "sixfold.theme": light, dark, or auto when absent), shared by every Traverse page on this site and updated live when another page changes it */(function(){function a(){try{var t=localStorage.getItem("sixfold.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);else document.documentElement.removeAttribute("data-theme")}catch(e){}}a();window.__lookApply=a;window.addEventListener("storage",function(e){if(!e.key||e.key==="sixfold.theme"){a();if(window.__lookChanged)window.__lookChanged()}})})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#13294b">
<title>Traverse Hub</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Hub"><meta name="mobile-web-app-capable" content="yes">
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});   /* only so it installs as an app; it keeps nothing */</script>
<!-- Matthew's one window (2026-10-22, Matthew: "i have 3 apps ... id like to be able to have them all open ... but i dont wanna have 3 apps open
     at the same time ... Is there a way to add them to the same tabs"). The field app, the assistant and the Peak desk as tabs in one window.
     All three live on traverseplatforms.com, so each is shown in a frame on this same site and keeps its own sign-in. A tab's app loads the
     first time it is opened and then stays loaded: switching back keeps its place. Alt+1, Alt+2, Alt+3 switch tabs. -->
<style>
  :root{--bar:#13294b;--bar-ink:#fff;--soft:#c9d5e6;--flag:#d6400c;--bg:#f4f6f9;color-scheme:light}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bar:#0f1f39;--soft:#a9bbd1;--flag:#ff7a45;--bg:#0b1220;color-scheme:dark}}:root[data-theme="dark"]{--bar:#0f1f39;--soft:#a9bbd1;--flag:#ff7a45;--bg:#0b1220;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
  .wrap{display:flex;flex-direction:column;height:100%;height:100dvh}
  .bar{flex:none;display:flex;align-items:stretch;gap:2px;background:var(--bar);color:var(--bar-ink);border-bottom:3px solid var(--flag);padding:0 6px;padding-top:env(safe-area-inset-top)}
  .tab{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--soft);font:inherit;font-weight:650;padding:8px 14px 7px;cursor:pointer;border-radius:9px 9px 0 0;margin-top:5px;white-space:nowrap}
  .tab img{width:20px;height:20px;border-radius:5px;flex:none}
  .tab:hover{color:#fff;background:rgba(255,255,255,.06)}
  .tab[aria-selected="true"]{color:#fff;background:rgba(255,255,255,.14);box-shadow:inset 0 -3px 0 var(--flag)}
  .tab:focus-visible{outline:2px solid var(--flag);outline-offset:-2px}
  .tab kbd{font:600 11px system-ui,sans-serif;color:var(--soft);opacity:.7}
  .sp{flex:1}
  .tool{border:0;background:transparent;color:var(--soft);padding:0 10px;cursor:pointer;display:flex;align-items:center;border-radius:8px;margin:5px 0}
  .tool:hover{color:#fff;background:rgba(255,255,255,.08)}
  .tool svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .frames{flex:1;position:relative;min-height:0}
  .frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
  .frames iframe[hidden]{display:none}
  @media (max-width:560px){.tab span,.tab kbd{display:none}.tab{padding:8px 12px 7px}}
  @media (max-width:760px){.tab kbd{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar" role="tablist" aria-label="Apps" id="bar"></div>
  <div class="frames" id="frames"></div>
</div>
<script>
(function () {
  'use strict';
  var APPS = [
    { id: 'field', name: 'Field app', url: '/summit-de59ae83/', icon: '/summit-de59ae83/icon-192.png' },
    { id: 'assistant', name: 'Assistant', url: '/a-e018bb82/', icon: '/a-e018bb82/icon-192.png' },
    { id: 'peak', name: 'Peak desk', url: '/peak-desk-28d38d/', icon: '/peak-desk-28d38d/icon-192.png' },
    { id: 'prospects', name: 'Prospects', url: '/prospects-47bfe6/', icon: '/prospects-47bfe6/icon-192.png' }   /* the Traverse prospect desk (2026-10-26, TR-21) */
  ];
  var bar = document.getElementById('bar'), frames = document.getElementById('frames'), tabs = {}, iframes = {}, cur = null;
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function svg(d) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + d + '</svg>'; }
  function frameFor(a) {
    if (iframes[a.id]) return iframes[a.id];
    var f = document.createElement('iframe'); f.title = a.name; f.src = a.url;
    f.setAttribute('allow', 'geolocation; camera; microphone; clipboard-read; clipboard-write; fullscreen; web-share; payment');
    f.addEventListener('load', function () { keys(f); if (typeof lookFrames === 'function') lookFrames(); });
    frames.appendChild(f); iframes[a.id] = f; return f;
  }
  function show(id) {
    var a = APPS.filter(function (x) { return x.id === id; })[0] || APPS[0]; cur = a.id;
    APPS.forEach(function (x) { tabs[x.id].setAttribute('aria-selected', String(x.id === a.id)); tabs[x.id].tabIndex = x.id === a.id ? 0 : -1; if (iframes[x.id]) iframes[x.id].hidden = x.id !== a.id; });
    var f = frameFor(a); f.hidden = false; try { f.contentWindow.focus(); } catch (e) {}
    document.title = a.name + ' · Traverse Hub'; store('hub.tab', a.id);
  }
  /* Alt+1/2/3 switch tabs, also while typing inside an app (each app is on this same site, so its keys can be heard here) */
  function onKey(e) {
    if (!e.altKey || e.ctrlKey || e.metaKey) return;
    var n = +e.key; if (n >= 1 && n <= APPS.length) { e.preventDefault(); show(APPS[n - 1].id); }
  }
  function keys(f) { try { f.contentWindow.document.addEventListener('keydown', onKey); } catch (e) {} }
  document.addEventListener('keydown', onKey);
  APPS.forEach(function (a, i) {
    var t = document.createElement('button'); t.className = 'tab'; t.type = 'button'; t.setAttribute('role', 'tab'); t.title = a.name + ' (Alt+' + (i + 1) + ')';
    var im = document.createElement('img'); im.src = a.icon; im.alt = ''; t.appendChild(im);
    var s = document.createElement('span'); s.textContent = a.name; t.appendChild(s);
    var k = document.createElement('kbd'); k.textContent = 'Alt+' + (i + 1); t.appendChild(k);
    t.addEventListener('click', function () { show(a.id); });
    t.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { var j = (i + (e.key === 'ArrowRight' ? 1 : APPS.length - 1)) % APPS.length; show(APPS[j].id); tabs[APPS[j].id].focus(); } });
    tabs[a.id] = t; bar.appendChild(t);
  });
  bar.appendChild(Object.assign(document.createElement('div'), { className: 'sp' }));
  var rl = document.createElement('button'); rl.className = 'tool'; rl.type = 'button'; rl.title = 'Reload this tab'; rl.setAttribute('aria-label', 'Reload this tab');
  rl.innerHTML = svg('<path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/>');
  rl.addEventListener('click', function () { var f = iframes[cur]; if (!f) return; try { f.contentWindow.location.reload(); } catch (e) { f.src = f.src; } });
  var op = document.createElement('button'); op.className = 'tool'; op.type = 'button'; op.title = 'Open this tab in its own window'; op.setAttribute('aria-label', 'Open this tab in its own window');
  op.innerHTML = svg('<path d="M14 4h6v6M20 4l-9 9"/><path d="M19 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/>');
  op.addEventListener('click', function () { var f = iframes[cur], u = APPS.filter(function (x) { return x.id === cur; })[0].url; try { u = f.contentWindow.location.href; } catch (e) {} window.open(u, '_blank', 'noopener'); });
  /* the look (2026-10-26, Matthew: "assistant peak desk and prospects need to have a dark mode also"): one button cycles Auto, Light and
     Dark. It is the field app's own setting ('sixfold.theme'); every tab follows at once, the field app included (it does not listen for
     the change itself, so the hub sets its page's look too). */
  var LOOKS = { auto: ['Auto (follows this device)', '<path d="M12 3a9 9 0 1 0 0 18z" fill="currentColor"/><circle cx="12" cy="12" r="9"/>'],
    light: ['Light', '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'],
    dark: ['Dark', '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'] };
  function lookNow() { var t = store('sixfold.theme'); return t === 'light' || t === 'dark' ? t : 'auto'; }
  function lookFrames() {
    var t = lookNow();
    Object.keys(iframes).forEach(function (id) { try { var d = iframes[id].contentDocument.documentElement; if (t === 'auto') d.removeAttribute('data-theme'); else d.setAttribute('data-theme', t); } catch (e) {} });
  }
  var lk = document.createElement('button'); lk.className = 'tool'; lk.type = 'button'; lk.id = 'look';
  function lookPaint() { var t = lookNow(); lk.title = 'Look: ' + LOOKS[t][0] + '. Click to change'; lk.setAttribute('aria-label', lk.title); lk.innerHTML = svg(LOOKS[t][1]); }
  lk.addEventListener('click', function () {
    var next = { auto: 'light', light: 'dark', dark: 'auto' }[lookNow()];
    try { if (next === 'auto') localStorage.removeItem('sixfold.theme'); else localStorage.setItem('sixfold.theme', next); } catch (e) {}
    if (window.__lookApply) window.__lookApply(); lookFrames(); lookPaint();
  });
  window.__lookChanged = function () { lookFrames(); lookPaint(); };   /* changed in a tab or another window */
  lookPaint();
  bar.appendChild(lk); bar.appendChild(rl); bar.appendChild(op);
  show(store('hub.tab') || APPS[0].id);
})();
</script>
</body>
</html>
