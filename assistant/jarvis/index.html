<!-- J.A.R.V.I.S., the merged page (2026-11-18). Matthew: "Yeah I want it them merged together. It will give jarvis application more
     function other then just the chat feature"; design: "Definitely the halo version of jarvis" (design/mockups-2026-11-18/jarvis-hub.html,
     direction A); crowding: "focus on changing the inboxes structure vs changing halo ... making them collaspable".
     Matthew's alone, behind the Assistant's sign-in (it lives in the Assistant's folder and talks to ../api.php). Two brains, always named
     on the command bar: the Assistant (instant, the API, ../api.php?action=chat, only when he asks) and the J.A.R.V.I.S. desk (since 19 Nov
     his desk chats live here, in the Assistant's own data: ../api.php?action=jvdesk*, answered by the session on his laptop in a few
     minutes; nothing of his goes through the Sixfold app any more). Team requests, Outbox and the Peak desk are read
     from those apps' own endpoints with their own sign-ins. Nothing on this page sends an email except Send in the reply sheet, after a
     yes in the confirm. The staff J.A.R.V.I.S. inside the Sixfold and Houston apps is untouched and cannot reach this page. -->
<style>
@font-face{font-family:"Inter";font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/inter.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:400 600;font-display:swap;src:url(fonts/jetbrains-mono.woff2) format("woff2")}
@font-face{font-family:"Rajdhani";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/rajdhani-600.woff2) format("woff2")}
@font-face{font-family:"Rajdhani";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/rajdhani-700.woff2) format("woff2")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#03060c;color:#d8f6ff;font:14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid #3ee8ff;outline-offset:2px}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:"JetBrains Mono",monospace}

/* ---- the Halo screen (direction A) ---- */
.jv{--bg:#03060c;--c:#3ee8ff;--c2:#1fb6d6;--ink:#d8f6ff;--mut:#7fa3b4;--warn:#ffb648;--bad:#ff6b6b;--okc:#4ade80;
 position:fixed;inset:0;overflow:hidden;color:var(--ink);background:
 radial-gradient(ellipse 60% 55% at 50% 38%,#0b2a3e 0%,#06121e 45%,transparent 75%),
 radial-gradient(circle at 50% 120%,#06283a 0,transparent 60%),var(--bg)}
.jv::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#3ee8ff0b 1px,transparent 1px),linear-gradient(90deg,#3ee8ff0b 1px,transparent 1px);background-size:40px 40px;-webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 45%,#000 30%,transparent 85%);mask-image:radial-gradient(ellipse 70% 70% at 50% 45%,#000 30%,transparent 85%)}
.jv::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#ffffff03 0 1px,transparent 1px 3px)}
.pnl{position:relative;border:1px solid #3ee8ff1c;padding:14px 16px;
 background-image:linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c)),linear-gradient(180deg,#071826d9,#040c15d9);
 background-size:12px 1px,1px 12px,12px 1px,1px 12px,12px 1px,1px 12px,12px 1px,1px 12px,auto;
 background-position:0 0,0 0,100% 0,100% 0,0 100%,0 100%,100% 100%,100% 100%,0 0;background-repeat:no-repeat}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:10px;font:500 11px "JetBrains Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--c)}
.ph .n{color:#3ee8ffb8}
.ph .pc{margin-left:auto;color:var(--mut);letter-spacing:.08em;white-space:nowrap}
.ph .fold{width:22px;height:22px;display:grid;place-items:center;color:var(--mut);border-radius:4px;margin-right:-6px}
.ph .fold:hover{color:var(--c);background:#3ee8ff10}
.li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid #3ee8ff12;width:100%;text-align:left}
.li:first-child{border-top:0}
button.li:hover .lt{color:#fff}
.lx{flex:1;min-width:0}
.lt{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ls{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lm{font:11px "JetBrains Mono",monospace;color:var(--mut);white-space:nowrap}
.lr{text-align:right;display:grid;gap:4px;justify-items:end;flex:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}
.bdg{font:600 10px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:1px solid currentColor;border-radius:3px;white-space:nowrap;flex:none}
.bdg.dr{color:var(--c);background:#3ee8ff14;box-shadow:0 0 10px #3ee8ff33}
.bdg.wk{color:var(--c)}.bdg.nw{color:#a5b4fc}.bdg.nm{color:var(--warn)}.bdg.mu{color:var(--mut)}.bdg.bd{color:var(--bad)}
.sub{font:500 10px "JetBrains Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:12px 0 4px;display:flex;align-items:center;gap:8px}
.sub:first-child{margin-top:0}
.sub b{color:var(--warn);font-weight:600}
.more{display:block;font:11px "JetBrains Mono",monospace;color:var(--c);padding:6px 0 0;letter-spacing:.04em;text-align:left}
.empty{font-size:12.5px;color:var(--mut);padding:4px 0}
.hint{font-size:12px;color:var(--mut);line-height:1.5}
.titem{display:flex;align-items:center;gap:6px}.titem>.li{flex:1;min-width:0}.tcheck{flex:none;width:26px;height:26px;border:1px solid #3ee8ff44;border-radius:4px;color:var(--c,#3ee8ff);background:transparent;cursor:pointer;font-size:13px}.tcheck:hover{background:#3ee8ff14}
.bcheck{margin-top:6px;font:11px "JetBrains Mono",monospace;letter-spacing:.06em;color:var(--c,#3ee8ff);border:1px solid #3ee8ff44;border-radius:4px;padding:3px 8px;background:transparent;cursor:pointer}.bcheck:hover{background:#3ee8ff14}
.hint a,.hint button{color:var(--c);text-decoration:underline;text-underline-offset:2px}
/* the collapsible inbox rows (Matthew: "making them collaspable or some structure like that to condense space") */
.ibr{border:1px solid #3ee8ff1a;background:#3ee8ff06;margin-top:6px}
.ibr>.ibh{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;text-align:left}
.ibr>.ibh .nm{font-size:13px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibr>.ibh .ct{font:600 18px/1 Rajdhani,sans-serif;min-width:18px;text-align:right}
.ibr>.ibh .ct.z{color:var(--mut)}
.ibr>.ibh .chev{color:var(--mut);transition:transform .15s}
.ibr.open>.ibh .chev{transform:rotate(90deg);color:var(--c)}
.ibr>.ibb{display:none;padding:0 10px 6px}
.ibr.open>.ibb{display:block}
.ibr .dot{margin-top:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 10px}
.kpi{border:1px solid #3ee8ff1a;padding:8px 10px;background:#3ee8ff06;text-align:left}
.kv{font:600 26px/1 Rajdhani,sans-serif}
.kl{font:10px "JetBrains Mono",monospace;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;margin-top:3px}
.prog{height:4px;border-radius:4px;overflow:hidden;background:#3ee8ff14;margin:7px 0 4px}
.prog i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--c2),var(--c));box-shadow:0 0 8px var(--c)}
.okt{color:var(--okc)}
.top{display:flex;align-items:center;gap:22px;font:11px "JetBrains Mono",monospace;letter-spacing:.12em;color:var(--mut);text-transform:uppercase;white-space:nowrap;min-width:0}
.wm{font:700 22px Rajdhani,sans-serif;letter-spacing:.42em;color:#eafcff;text-shadow:0 0 18px #3ee8ff88}
.st{display:flex;align-items:center;gap:6px}
.st i{width:6px;height:6px;border-radius:50%;background:var(--okc);box-shadow:0 0 8px var(--okc)}
.st.off i{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.top .vw{display:flex;gap:4px;margin-left:auto}
.top .vw button{width:30px;height:30px;display:grid;place-items:center;border-radius:6px;color:var(--mut);border:1px solid transparent}
.top .vw button:hover{color:var(--c);border-color:#3ee8ff33;background:#3ee8ff0a}
.top .clock{color:var(--mut)}
/* the conversation */
.chat{display:flex;flex-direction:column;gap:12px;overflow-y:auto;min-height:0;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent 0,#000 40px);mask-image:linear-gradient(transparent 0,#000 40px)}
.chat::-webkit-scrollbar{display:none}
.chat>*{flex:none}
.chat>.sp{flex:1 1 auto}
.msg{max-width:88%;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai{align-self:flex-start}
.msg .who{font:500 10px "JetBrains Mono",monospace;letter-spacing:.2em;color:var(--c);margin-bottom:4px;text-transform:uppercase;white-space:nowrap}
.msg.me{align-self:flex-end;background:#3ee8ff12;border:1px solid #3ee8ff2e;padding:9px 13px;border-radius:14px 14px 2px 14px}
.msg.bad{color:#ffc9c9}
.acard{border:1px solid #3ee8ff38;background:linear-gradient(180deg,#0a2232f0,#061522f0);border-radius:10px;padding:14px 16px;box-shadow:0 0 30px #3ee8ff14,inset 0 1px #3ee8ff22;max-width:100%}
.acard .ah{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;min-width:0}
.acard .ah>span.t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard .ah .bdg{margin-left:auto}
.acard .ah>span.t{flex:1 1 auto}
.acard .ah .cx{flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:6px;color:var(--mut);border:1px solid transparent;margin-left:4px}
.acard .ah .cx:hover{color:var(--c);border-color:#3ee8ff33}
.sheet .shd .shclose,.view .vh .vclose{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--c);border:1px solid #3ee8ff33;border-radius:6px;padding:6px 10px;flex:none}
.view .vh .ot+.vclose{margin-left:12px}
.acard .q{margin:10px 0;padding:10px 12px;border-left:2px solid var(--c);background:#3ee8ff0a;color:#bfe9f5;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.acard .q.w{border-left-color:var(--warn)}
.acard .meta{font:11px "JetBrains Mono",monospace;color:var(--mut)}
.acard .rows{margin-top:6px}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{padding:8px 14px;border-radius:6px;font:600 12px Inter,sans-serif;letter-spacing:.02em;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.pri{background:var(--c);color:#022231;box-shadow:0 0 18px #3ee8ff66}
.btn.sec{border:1px solid #3ee8ff55;color:var(--c)}
.btn.gh{color:var(--mut)}
.btn.warn{border:1px solid #ffb64866;color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;margin-bottom:8px;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid #3ee8ff33;color:#a9e9f7;padding:6px 12px;border-radius:999px;font-size:12px;background:#3ee8ff08;flex:none}
.chip:hover{background:#3ee8ff14}
.chip.on{background:#3ee8ff26;border-color:#3ee8ff88;color:#fff}
/* which brain answers: always named, plainly */
.brain{display:flex;align-items:center;gap:10px;margin-bottom:8px;font:11px "JetBrains Mono",monospace;letter-spacing:.04em;color:var(--mut);min-width:0}
.brain .bl{display:flex;align-items:center;gap:7px;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brain .bl i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.brain.bdesk .bl i{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.brain .sw{margin-left:auto;color:var(--c);white-space:nowrap;flex:none;border:1px solid #3ee8ff33;border-radius:999px;padding:3px 10px}
.brain .sw:hover{background:#3ee8ff10}
.brain .vo{margin-left:auto}.brain .vo+.sw{margin-left:0}.brain .hf+.sw{margin-left:0}.phone .brain .hf{display:none}.brain .vo.off,.brain .hf.off{color:var(--mut);border-color:#ffffff22}
.cmdbar{display:flex;align-items:center;gap:10px;border:1px solid #3ee8ff40;background:#04111bcc;border-radius:14px;padding:8px 8px 8px 16px;box-shadow:0 0 0 4px #3ee8ff08,0 0 40px #3ee8ff12}
.brain.bdesk+.cmdbar{border-color:#ffb64855}
.cmdbar input{flex:1;min-width:0;font-size:14px;color:var(--ink);outline:none;padding:6px 0}
.cmdbar input::placeholder{color:var(--mut)}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mut);flex:none}
.ib.mic{background:#3ee8ff18;color:var(--c);border:1px solid #3ee8ff55}
.ib.mic.on{background:var(--c);color:#022231;box-shadow:0 0 20px var(--c)}
.ib.snd{background:var(--c);color:#022231}
.ib.snd:disabled{opacity:.45}
.glink{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);padding:2px 4px}
.glink b{color:var(--c);font-weight:500}
.tdots{display:inline-flex;gap:4px;vertical-align:middle}
.tdots i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:tdot 1.2s infinite}
.tdots i:nth-child(2){animation-delay:.15s}.tdots i:nth-child(3){animation-delay:.3s}
.wv{display:inline-flex;align-items:center;gap:3px;height:14px;vertical-align:-2px}
.wv i{display:block;width:3px;height:100%;border-radius:2px;background:currentColor;animation:bars .9s ease-in-out infinite;transform-origin:center}
.wv i:nth-child(2n){animation-delay:.12s}.wv i:nth-child(3n){animation-delay:.27s}.wv i:nth-child(5n){animation-delay:.4s}
@keyframes tdot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes breathe{0%,100%{opacity:.75;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}
@keyframes ripple{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes bars{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
/* the core: breathes when idle, ripples when listening, spins its inner arc when thinking */
.core{position:relative;display:grid;place-items:center;flex:none}
.core svg{overflow:visible}
.core .r-out{transform-origin:center;transform-box:fill-box;animation:spin 60s linear infinite}
.core .r-mid{transform-origin:center;transform-box:fill-box;animation:spinr 34s linear infinite}
.core .r-arc{transform-origin:center;transform-box:fill-box;animation:spin 9s linear infinite;opacity:0;transition:opacity .3s}
.core .glob{animation:breathe 5s ease-in-out infinite}
.core .rip{transform-origin:center;transform-box:fill-box;opacity:0}
.core .halo{transition:opacity .4s}
.s-listen .core .rip{animation:ripple 1.8s ease-out infinite}
.s-listen .core .rip.b{animation-delay:.6s}.s-listen .core .rip.c{animation-delay:1.2s}
.s-listen .core .glob{animation-duration:1.4s}
.s-think .core .r-arc{opacity:1;animation-duration:1.1s}
.s-think .core .r-out{animation-duration:8s}
.s-think .core .r-mid{animation-duration:5s}
.s-think .core .glob{animation-duration:2.2s}
.s-answer .core .halo{opacity:.9}
.slbl{text-align:center;font:500 11px "JetBrains Mono",monospace;letter-spacing:.32em;color:var(--c);text-transform:uppercase;position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){.core *{animation-duration:0s!important;animation-iteration-count:1!important}}

/* ---- desktop ---- */
.desk{display:grid;grid-template-rows:56px minmax(0,1fr);gap:18px 22px;padding:16px 26px 22px}
.desk>.top{grid-column:1/-1;border-bottom:1px solid #3ee8ff1c;padding-bottom:12px;position:relative;z-index:1}
.desk .col{display:flex;gap:10px;min-height:0;position:relative;z-index:1}
.desk .colL{flex-direction:row}
.desk .colR{flex-direction:row-reverse}
.desk .pans{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px;overflow-y:auto;scrollbar-width:none;padding-bottom:4px}
.desk .pans::-webkit-scrollbar{display:none}
.desk .pans>.pnl{flex:none}
.rail{width:44px;flex:none;display:flex;flex-direction:column;gap:8px}
.rail button{position:relative;width:44px;height:44px;display:grid;place-items:center;color:var(--c);border:1px solid #3ee8ff33;background:#071826cc}
.rail button svg.i{width:18px;height:18px}
.rail button:hover{background:#3ee8ff14}
.rail em{position:absolute;top:-6px;right:-6px;font:600 9px Inter;font-style:normal;background:var(--c);color:#022231;border-radius:8px;padding:1px 5px}
.rail em.w{background:var(--warn)}
.desk .mid{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative;z-index:1}
.desk .mid .chat{flex:1;padding:0 30px 14px}
.desk .mid .cmd{padding:0 30px}
.desk .mid .core{height:236px}

/* ---- phone ---- */
.phone{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.phone .hd{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 0;position:relative;z-index:1}
.phone .wm{font-size:17px;letter-spacing:.34em}
.phone .core{height:178px;z-index:1}
.phone .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 12px;z-index:1}
.phone .tiles .pnl{padding:9px 10px;text-align:left}
.phone .tiles .kv{font-size:22px}
.phone .pbody{flex:1;min-height:0;display:flex;flex-direction:column;z-index:1;position:relative}
.phone .chat{flex:1;gap:10px;padding:0 16px 10px}
.phone .msg{max-width:94%;font-size:13.5px}
.phone .cmd{padding:0 12px 8px;z-index:1}
.phone .pscroll{flex:1;overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:14px}
.phone .tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #3ee8ff1f;padding:8px 6px calc(10px + env(safe-area-inset-bottom));background:#02070dcc;z-index:1;position:relative}
.phone .tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font:10px "JetBrains Mono",monospace;letter-spacing:.06em;color:var(--mut);position:relative}
.phone .tabs button[aria-selected="true"]{color:var(--c)}
.phone .tabs svg.i{width:20px;height:20px}
.phone .tabs em{position:absolute;top:-4px;left:50%;margin-left:6px;font:600 9px Inter;background:var(--c);color:#022231;border-radius:8px;padding:0 5px;font-style:normal}
.phone .ph .fold{display:none}
.phone .acts .btn{padding:9px 13px}
.vlist{display:grid;gap:8px}
.vlist button{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid #3ee8ff22;background:#071826cc;text-align:left;font-size:14px}
.vlist button svg.i{color:var(--c);width:18px;height:18px}
.vlist button small{display:block;color:var(--mut);font-size:12px}

/* ---- sheets: an email with its reply, a team request with its thread ---- */
.sheetbg{position:fixed;inset:0;z-index:40;background:#010409c0;backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;padding:40px 16px}
.sheet{width:min(760px,100%);max-height:calc(100vh - 80px);display:flex;flex-direction:column;padding:0}
.sheet .shd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #3ee8ff1c}
.sheet .shd .x{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--c);border:1px solid #3ee8ff33;flex:none}
.sheet .sht{flex:1;min-width:0}
