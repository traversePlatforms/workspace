<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#13294b">
<title>Traverse Assistant</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Assistant"><meta name="mobile-web-app-capable" content="yes">
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});   /* only so it installs as an app; it keeps nothing */</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Familjen+Grotesk:wght@500;600;700&display=swap">
<!-- Matthew's assistant (2026-10-22), first part: email. Every inbox sorted by what needs him, reply drafts waiting in Gmail, nothing
     ever sent on its own. Talks only to api.php beside it.
     The face lift (2026-10-22, Matthew: "the color pallets makes it hard to digest information"): what is waiting, said first and
     tappable; each inbox its own colour (Personal violet, Traverse blue, Sixfold ember, Surge green, Surge's own #4abe4a) as a stripe on
     every email; each kind of email its own icon; the low-value kinds folded; settings on their own screen; on a computer a side
     column. Branded Traverse (2026-10-22, Matthew: "brand the assistant as well to the traverse branding"): the navy bar with the flag
     strip, flag-orange buttons, the route mark, Familjen Grotesk and Atkinson Hyperlegible. Sixfold's inbox colour is its 365 gold, so it
     never reads as a button. -->
<style>
  :root{--bg:#f4f6f9;--card:#fff;--ink:#0f1b2d;--soft:#566476;--faint:#8592a3;--line:#dce2ea;--sunk:#f7f9fb;--btn:#d6400c;--on-btn:#fff;--bar:#13294b;--bar-ink:#fff;--bar-soft:#c9d5e6;--flag:#d6400c;--head:"Familjen Grotesk","Atkinson Hyperlegible",system-ui,sans-serif;--hot:#d92d20;--hot-tint:#fdecea;--ok:#12805c;--ok-tint:#e3f4ec;
    --c-personal:#7c5cff;--c-traverse:#2f6fde;--c-sixfold:#c48a00;--c-surge:#3fa83f;--c-other:#8a93a1;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131d2e;--ink:#e8edf5;--soft:#a3b0c2;--faint:#7d8a9c;--line:#24324a;--sunk:#0e1726;--btn:#ff7a45;--on-btn:#0b1220;--bar:#0f1f39;--bar-ink:#fff;--bar-soft:#a9bbd1;--flag:#ff7a45;--hot:#ff6b5e;--hot-tint:#3a1714;--ok:#5fd3a0;--ok-tint:#0f2b20;
    --c-personal:#9b85ff;--c-traverse:#6d9dff;--c-sixfold:#f2c14e;--c-surge:#5fcf5f;color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  button,.btn{font:inherit;font-weight:650;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
  button:hover,.btn:hover{border-color:var(--faint)}
  button.go,.btn.go{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
  button:disabled{opacity:.55;cursor:default}
  .ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .muted{color:var(--soft)} .small{font-size:13px}
  .err{color:var(--hot);font-weight:600;margin:8px 0 0}
  input,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--ink)}
  textarea{min-height:76px;resize:vertical}
  input.key{-webkit-text-security:disc;font-family:ui-monospace,Consolas,monospace}
  label{display:grid;gap:5px;font-weight:600;font-size:13px;margin:0 0 12px}
  label.tick{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px}
  label.tick input{width:auto}
  /* the frame: a top bar, then on a computer a side column beside the list */
  .top{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--bar-ink);border-bottom:4px solid var(--flag)}
  .top button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:var(--bar-ink)}
  .top button:hover{border-color:rgba(255,255,255,.45)}
  .top button.go{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
  .top .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .mark{width:32px;height:32px;flex:none;display:grid;place-items:center}
  .mark svg{width:32px;height:32px}
  .brand b{font:700 18px var(--head);letter-spacing:-.01em;white-space:nowrap}
  .brand b span{color:var(--bar-soft);font-weight:600}
  .sign .brand b span{color:var(--soft)}
  .iconbtn{padding:8px;border-radius:10px}
  .shell{max-width:1180px;margin:0 auto;padding:16px 16px 70px}
  @media (min-width:1000px){.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}.side{position:sticky;top:70px}}
  .hello{margin:2px 0 14px}
  .hello h1{font:700 24px/1.15 var(--head);margin:0;letter-spacing:-.015em}
  .hello p{margin:3px 0 0;color:var(--soft)}
  /* what is waiting: big counts that filter */
  .counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 14px}
  @media (max-width:520px){.counts{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (min-width:1000px){.counts{grid-template-columns:1fr;gap:4px;margin:0 0 18px}}
  .count{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:11px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:left}
  .count b{font:700 26px/1 var(--head);font-variant-numeric:tabular-nums}
  .count span{font-size:13px;color:var(--soft);font-weight:600;display:flex;align-items:center;gap:6px}
  .count.hot b{color:var(--hot)}
  .count[aria-pressed="true"]{border-color:var(--btn);box-shadow:inset 0 0 0 1px var(--btn)}
  .count.zero{opacity:.55}
  @media (min-width:1000px){.count{flex-direction:row-reverse;justify-content:space-between;align-items:center;padding:9px 12px;background:transparent;border-color:transparent}.count b{font-size:15px}.count span{font-size:14px;color:var(--ink)}.count[aria-pressed="true"]{background:var(--card);border-color:var(--line);box-shadow:none}}
  .sidehead{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:0 0 6px 12px;display:none}
  @media (min-width:1000px){.sidehead{display:block}}
  /* the inboxes: a colour dot each */
  .inboxes{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
  @media (min-width:1000px){.inboxes{flex-direction:column;gap:2px}.inboxes button{justify-content:flex-start;background:transparent;border-color:transparent}.inboxes button[aria-pressed="true"]{background:var(--card);border-color:var(--line)}}
  .inboxes button{border-radius:999px;font-size:13.5px;padding:7px 12px}
  .inboxes button[aria-pressed="true"]{background:var(--bar);color:var(--bar-ink);border-color:var(--bar)}
  .inboxes button[aria-pressed="true"] .n{color:var(--bar-soft)}
  @media (min-width:1000px){.inboxes button{border-radius:10px;font-size:14px;padding:8px 12px}.inboxes button[aria-pressed="true"]{background:var(--card);border-color:var(--line);color:var(--ink);box-shadow:inset 3px 0 0 var(--bar)}.inboxes button[aria-pressed="true"] .n{color:var(--faint)}}
  .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
  .inboxes .n{margin-left:auto;color:var(--faint);font-weight:600;font-variant-numeric:tabular-nums}
  /* a section per kind of email, a row per email */
  .sec{margin:0 0 18px}
  .sechead{display:flex;align-items:center;gap:8px;margin:0 0 8px;font:700 15px var(--head)}
  .sechead .ic{color:var(--soft)}
  .sechead .n{color:var(--faint);font-weight:600}
  .list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .row{position:relative;padding:12px 14px 12px 18px;border-top:1px solid var(--line);display:grid;gap:3px}
  .row:first-child{border-top:0}
  .row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
  .row .l1{display:flex;align-items:baseline;gap:8px;min-width:0}
  .row .who{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .box{font-size:12px;font-weight:700;color:var(--c);white-space:nowrap}
  .row .when{margin-left:auto;font-size:12.5px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
  .row .subj{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .sum{color:var(--soft);font-size:14px}
  .row .todo{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:650;margin-top:2px}
  .row .todo .ic{width:15px;height:15px;color:var(--soft)}
  .soon{font-size:11.5px;font-weight:750;color:var(--hot);background:var(--hot-tint);border-radius:999px;padding:1px 8px;white-space:nowrap}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .acts button,.acts .btn{font-size:13px;padding:6px 10px;border-radius:9px}
  .acts .ready{background:var(--ok-tint);border-color:transparent;color:var(--ok)}
  @media (min-width:700px){.row{grid-template-columns:minmax(0,1fr) auto;column-gap:16px}.row>*{grid-column:1}.row .acts{grid-column:2;grid-row:1 / span 4;align-self:center;margin:0;flex-wrap:nowrap}}
  details.fold{margin:0 0 10px}
  details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:11px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-weight:650}
  details.fold>summary::-webkit-details-marker{display:none}
  details.fold>summary .n{margin-left:auto;color:var(--faint)}
  details.fold[open]>summary{border-radius:12px 12px 0 0}
  details.fold>.list{border-radius:0 0 14px 14px;border-top:0}
  .empty{padding:26px 18px;text-align:center;color:var(--soft);background:var(--card);border:1px dashed var(--line);border-radius:14px}
  .flash{margin:0 0 14px;padding:10px 14px;border-radius:12px;font-weight:600}
  .flash.ok{background:var(--ok-tint);color:var(--ok)} .flash.bad{background:var(--hot-tint);color:var(--hot)}
  /* settings, on its own screen */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
  .panel h2{font:700 17px var(--head);margin:0 0 4px}
  .panel>p.muted{margin:0 0 14px}
  .acct{display:grid;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
  .acct:first-of-type{border-top:0}
  .acct .head{display:flex;align-items:center;gap:8px}
  .acct .head b{font-size:15px}
  ol{padding-left:20px;margin:6px 0 10px} li{margin:0 0 6px}
  code{font-size:12.5px;background:var(--sunk);padding:2px 6px;border-radius:6px;word-break:break-all}
  /* an email in full, and the reply box (2026-10-22) */
  .row.tap{cursor:pointer}
  .row.tap:hover{background:var(--sunk)}
  .row.tap:focus-visible{outline:2px solid var(--btn);outline-offset:-2px}
  .sheetbg{position:fixed;inset:0;z-index:20;background:rgba(10,16,28,.45);display:flex;justify-content:center;align-items:stretch}
  .sheet{background:var(--bg);width:100%;max-width:820px;overflow:auto;display:flex;flex-direction:column;border-top:4px solid var(--c)}
  @media (min-width:860px){.sheetbg{align-items:flex-start;padding:28px 16px}.sheet{border-radius:16px;max-height:calc(100vh - 56px);border-top-width:5px;box-shadow:0 20px 60px rgba(0,0,0,.35)}}
  .shhead{position:sticky;top:0;z-index:1;display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line)}
  .shtitle{display:grid;gap:2px;min-width:0}
  .shtitle b{font:700 17px/1.25 var(--head)}
  .shmeta{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--soft)}
  .shbody{padding:14px 16px 24px;display:grid;gap:12px;align-content:start}
  .shfrom{font-size:14px;display:grid;gap:2px;word-break:break-word}
  .shsum{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:10px 12px;font-size:14px}
  .shtext{white-space:pre-wrap;word-break:break-word;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:15px;line-height:1.55;max-height:45vh;overflow:auto}
  .shbody>.btn{justify-self:start}
  .reply{display:grid;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .rlabel{font:700 15px var(--head)}
  .rtext{min-height:190px;font-size:15px;line-height:1.5;background:var(--bg)}
  .rnote{display:flex;gap:8px;flex-wrap:wrap}
  .rnote input{flex:1;min-width:200px}
  .racts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .racts .small{flex:1;min-width:160px}
  /* talking to the assistant (2026-10-22): a drawer on a computer, the whole screen on a phone */
  @media (max-width:520px){.top .brand b{display:none}}
  .chatbg{position:fixed;inset:0;z-index:19;background:rgba(10,16,28,.35);display:flex;justify-content:flex-end}
  .chat{background:var(--bg);width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;border-top:4px solid var(--flag)}
  @media (min-width:600px){.chat{border-top:0;border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.25)}}
  .chat .shhead .shtitle{flex:1}
  .chlog{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:88%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.5}
  .msg.me{align-self:flex-end;background:var(--bar);color:var(--bar-ink);border-bottom-right-radius:4px}
  .msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.wait{color:var(--soft);font-style:italic}
  .msg.bad{background:var(--hot-tint);color:var(--hot);border-color:transparent}
  .msg .acts{margin-top:10px}
  .chintro{color:var(--soft);display:grid;gap:10px;margin:auto 0 0}
  .chintro b{color:var(--ink);font:700 17px var(--head)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{border-radius:999px;font-size:13.5px;font-weight:600}
  .chform{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
  .chform textarea{min-height:46px;max-height:160px;resize:none;flex:1}
  .sign{max-width:380px;margin:12vh auto 0;padding:0 16px}
  .sign .panel{padding:22px}
  .sign .brand{margin:0 0 16px;color:var(--bar);--hole:var(--bg)}
  .top .mark{--hole:var(--bar)}
  @media (prefers-color-scheme:dark){.sign .brand{color:var(--ink)}}
</style>
</head>
<body>
<div id="app"><p class="muted" style="padding:16px">Loading…</p></div>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app'), S = { inbox: 'all', cat: 'all', view: 'home', data: null };
  /* icons: one line each, drawn with the stroke */
  var I = {
    mark: '<path d="M4 7l8 6 8-6"/><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M15.5 15.5l1.5 1.5 3-3" stroke-width="2.4"/>',
    reply: '<path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z"/>', todo: '<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12l3 3 5-6"/>',
    cal: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>', wait: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    fyi: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/>', receipt: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
    news: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/>', promo: '<path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
    shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M12 8v5M12 16v.01"/>', gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
    refresh: '<path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/>', open: '<path d="M14 4h6v6M20 4l-9 9"/><path d="M19 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/>',
    pen: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>', check: '<path d="M5 12l5 5 9-10"/>', back: '<path d="M15 6l-6 6 6 6"/>', arrow: '<path d="M9 6l6 6-6 6"/>',
    chat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>', send: '<path d="M4 12l16-8-6 16-2.5-6.5z"/>', plus: '<path d="M12 5v14M5 12h14"/>'
  };
  function ico(n) { var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('class', 'ic'); s.setAttribute('aria-hidden', 'true'); s.innerHTML = I[n]; return s; }
  var CAT = [['needs_reply', 'Needs a reply', 'reply'], ['action', 'To do', 'todo'], ['calendar', 'Calendar', 'cal'], ['spam_risk', 'Looks like a scam', 'shield'], ['waiting', 'Waiting on others', 'wait'], ['fyi', 'For your information', 'fyi'],
    ['receipt', 'Receipts', 'receipt'], ['newsletter', 'Newsletters', 'news'], ['promo', 'Offers', 'promo']];
  var LOW = { receipt: 1, newsletter: 1, promo: 1 };
  var COLOR = { Personal: 'var(--c-personal)', Traverse: 'var(--c-traverse)', 'Sixfold / 365': 'var(--c-sixfold)', Sixfold: 'var(--c-sixfold)', Surge: 'var(--c-surge)' };
  function colorOf(a) { if (!a) return 'var(--c-other)'; return COLOR[a.label] || (/sixfold|365/i.test(a.email) ? 'var(--c-sixfold)' : /traverse/i.test(a.email) ? 'var(--c-traverse)' : /surge/i.test(a.email) ? 'var(--c-surge)' : /gmail/i.test(a.email) ? 'var(--c-personal)' : 'var(--c-other)'); }
  function el(t, cls, txt) { var e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function btn(label, icon, cls) { var b = el('button', cls || null); b.type = 'button'; if (icon) b.appendChild(ico(icon)); if (label) b.appendChild(document.createTextNode(label)); return b; }
  function api(action, body) {
    return fetch('api.php?action=' + action, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), credentials: 'same-origin' } : { credentials: 'same-origin' })
      .then(function (r) { return r.json().catch(function () { return { ok: false, error: 'The server sent nothing readable.' }; }).then(function (j) { j._status = r.status; return j; }); });
  }
  function ago(t) { var s = Math.round(Date.now() / 1000 - t); if (s < 90) return 'now'; if (s < 3600) return Math.round(s / 60) + 'm'; if (s < 86400) return Math.round(s / 3600) + 'h'; return new Date(t * 1000).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }); }

    if (j.setup.google) ip.appendChild(el('p', 'small muted', 'Google will say the app is unverified: choose Advanced, then Go to Assistant. A Google Workspace address may first need the app allowed in that Workspace’s admin console (Security, API controls).'));
    wrap.appendChild(ip);
    /* drafts */
    var st = j.settings, dp = el('div', 'panel'); dp.appendChild(el('h2', null, 'Sorting and drafts'));
    var sk = el('label', 'tick'), skc = el('input'); skc.type = 'checkbox'; skc.checked = !!st.skipTabs; sk.appendChild(skc); sk.appendChild(document.createTextNode('Leave Gmail’s Promotions, Social, Updates and Forums tabs alone')); dp.appendChild(sk);
    var ad = el('label', 'tick'), adc = el('input'); adc.type = 'checkbox'; adc.checked = !!st.autoDraft; ad.appendChild(adc); ad.appendChild(document.createTextNode('Write a reply draft for every email that needs one')); dp.appendChild(ad);
    var lv = el('label', null, 'How your drafts should sound'), voice = el('textarea'); voice.value = st.voice; lv.appendChild(voice); dp.appendChild(lv);
    wrap.appendChild(dp);
    /* keys */
    var kp = el('div', 'panel'); kp.appendChild(el('h2', null, 'Keys')); kp.appendChild(el('p', 'muted small', 'Saved on the server only and never shown again. Leave a box empty to keep what is saved.'));
    var inp = {};
    [['anthropic', 'Anthropic API key', j.setup.anthropic, 'sk-ant-…'], ['googleId', 'Google client ID', j.setup.google, '…apps.googleusercontent.com'], ['googleSecret', 'Google client secret', j.setup.google, 'GOCSPX-…']].forEach(function (x) {
      var l = el('label', null, x[1] + (x[2] ? ' · saved' : '')), i = el('input'); i.type = 'text'; i.className = 'key'; i.name = 'k-' + x[0]; i.autocomplete = 'off'; i.spellcheck = false; i.setAttribute('autocapitalize', 'off'); i.setAttribute('data-lpignore', 'true'); i.setAttribute('data-1p-ignore', 'true'); i.placeholder = x[3]; inp[x[0]] = i; l.appendChild(i); kp.appendChild(l);
    });
    if (!j.setup.google) {
      var g = el('div', 'small'); g.appendChild(el('p', null, 'Google, one time:'));
      var ol = el('ol');
      ['console.cloud.google.com: a project; turn on the Gmail API.', 'Google Auth Platform: External; Branding filled in; Data Access: the scope https://www.googleapis.com/auth/gmail.modify; Audience: Publish app.', 'Clients: Web application, with the redirect address below.', 'Paste the client ID and secret above and save.'].forEach(function (t) { ol.appendChild(el('li', null, t)); });
      g.appendChild(ol); g.appendChild(el('code', null, j.setup.redirect)); kp.appendChild(g);
    }
    wrap.appendChild(kp);
    var save = btn('Save settings', null, 'go'), msg = el('span', 'small muted'), sr = el('div'); sr.style.cssText = 'display:flex;gap:10px;align-items:center;margin:0 0 18px';
    save.addEventListener('click', function () {
      save.disabled = true;
      api('setup', { anthropic: inp.anthropic.value, googleId: inp.googleId.value, googleSecret: inp.googleSecret.value, settings: { skipTabs: skc.checked, autoDraft: adc.checked, perRun: st.perRun, voice: voice.value } }).then(function (r) {
        save.disabled = false; if (r.ok) { flash = ['ok', 'Saved.']; home(); } else msg.textContent = r.error || 'Not saved.';
      });
    });
    sr.appendChild(save); sr.appendChild(msg); wrap.appendChild(sr);
    var out = btn('Sign out', null); out.addEventListener('click', function () { api('signout', {}).then(function () { api('state').then(signin); }); }); wrap.appendChild(out);
    return wrap;
  }
  function acctBlock(a) {
    var c = el('div', 'acct'), head = el('div', 'head'), d = el('span', 'dot'); d.style.setProperty('--c', colorOf(a));
    head.appendChild(d); head.appendChild(el('b', null, a.label)); head.appendChild(el('span', 'muted small', a.email + (a.on ? '' : ' · paused') + ' · ' + (a.lastCheck ? 'checked ' + ago(a.lastCheck) + ' ago' : 'not checked yet'))); c.appendChild(head);
    var l1 = el('label', null, 'Name'), lab = el('input'); lab.value = a.label; l1.appendChild(lab);
    var l2 = el('label', null, 'What it is for'), ab = el('textarea'); ab.value = a.about; l2.appendChild(ab);
    var l3 = el('label', null, 'Sign-off on drafts'), sg = el('input'); sg.value = a.signature; l3.appendChild(sg);
    [l1, l2, l3].forEach(function (x) { x.style.margin = '0'; c.appendChild(x); });
    var row = el('div'); row.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap';
    var sv = btn('Save'); sv.addEventListener('click', function () { sv.disabled = true; api('account', { email: a.email, label: lab.value, about: ab.value, signature: sg.value }).then(function () { flash = ['ok', a.email + ' saved.']; home(); }); });
    var on = btn(a.on ? 'Pause' : 'Resume'); on.addEventListener('click', function () { api('account', { email: a.email, on: !a.on }).then(home); });
    var rm = btn('Disconnect'); rm.addEventListener('click', function () { if (confirm('Disconnect ' + a.email + '? Its sorted list is kept until it ages out.')) api('account', { email: a.email, remove: true }).then(home); });
    row.appendChild(sv); row.appendChild(on); row.appendChild(rm); c.appendChild(row);
    return c;
  }
  api('state').then(function (st) { if (st.signedIn) home(); else signin(st); }, function () { app.textContent = 'No connection.'; });
})();
</script>
