<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#13294b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Groceries">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Groceries</title>
<!-- The shared grocery list (2026-10-27, Matthew: "Something simple that we can add remove and check off. Something my girlfriend and I can
     share."). Matthew opens it from the assistant (signed in); she opens it with the private link ?t=..., which reaches this list only.
     It refreshes itself every few seconds, so a change on one phone shows on the other. -->
<style>
  :root{--bg:#f4f6f9;--card:#fff;--ink:#0f1b2d;--soft:#566476;--faint:#8592a3;--line:#dce2ea;--btn:#d6400c;--on-btn:#fff;--bar:#13294b;--ok:#1f7a3a}
  @media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#18253b;--ink:#e8edf5;--soft:#a3b0c2;--faint:#7d8a9c;--line:#3d5070;--btn:#ff7a45;--on-btn:#0b1220;--bar:#0e1b30;--ok:#5fcf7f;color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  header{background:var(--bar);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  header h1{margin:0;font-size:20px}
  header .sub{font-size:12px;color:#c9d5e6}
  header button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:8px 12px;font:600 14px system-ui,sans-serif;cursor:pointer;min-height:40px}
  main{max-width:560px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
  form{display:flex;gap:8px;margin-bottom:14px}
  input[type=text]{flex:1;min-width:0;font:16px system-ui,sans-serif;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
  .add{background:var(--btn);color:var(--on-btn);border:0;border-radius:10px;padding:0 18px;font:700 16px system-ui,sans-serif;cursor:pointer;min-height:48px}
  ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  li{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 12px;border-top:1px solid var(--line);min-height:52px}
  li:first-child{border-top:0}
  li label{flex:1;min-width:0;display:flex;align-items:center;gap:12px;cursor:pointer;min-height:44px}
  li label>span{min-width:0;overflow-wrap:anywhere}
  li input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--ok)}
  li.done .txt{text-decoration:line-through;color:var(--faint)}
  li .by{font-size:11px;color:var(--faint);display:block}
  li .x{background:none;border:0;color:var(--faint);font-size:22px;line-height:1;width:44px;height:44px;cursor:pointer;border-radius:8px}
  li .x:hover{color:var(--btn)}
  .h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:18px 4px 6px;display:flex;justify-content:space-between;align-items:center}
  .h button{background:none;border:0;color:var(--btn);font:600 13px system-ui,sans-serif;cursor:pointer;padding:6px;text-transform:none;letter-spacing:0}
  .empty{color:var(--soft);text-align:center;padding:28px 12px}
  .msg{color:var(--btn);font-size:14px;min-height:20px;margin:-6px 4px 8px}
  .share{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;color:var(--soft)}
  .share b{color:var(--ink)}
  .share .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .share button{background:var(--bar);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:600 14px system-ui,sans-serif;cursor:pointer;min-height:44px}
  .share button.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
  .name{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--soft);margin:-4px 4px 12px}
  .name input{flex:none;width:140px;padding:6px 8px;font-size:14px}
  .gone{padding:40px 16px;text-align:center;color:var(--soft)}
</style>
</head>
<body>
<header><div><h1>Groceries</h1><div class="sub" id="sub">Shared list</div></div><button type="button" id="back" hidden>Assistant</button></header>
<main id="main">
  <form id="f" autocomplete="off"><input type="text" id="t" placeholder="Add an item" aria-label="Add an item" maxlength="120" enterkeyhint="done"><button class="add" type="submit">Add</button></form>
  <div class="msg" id="msg" role="status"></div>
  <div class="name" id="namebox" hidden>Your name on the list: <input type="text" id="who" maxlength="20" placeholder="Your name"></div>
  <ul id="todo"></ul>
  <div id="donebox" hidden><div class="h"><span>Checked off</span><button type="button" id="clear">Clear checked</button></div><ul id="done"></ul></div>
  <div class="share" id="share" hidden></div>
</main>
<script>
(function () {
  var T = new URLSearchParams(location.search).get('t') || '';
  var rev = -1, owner = false, busy = 0;
  var $ = function (id) { return document.getElementById(id); };
  var msg = function (s) { $('msg').textContent = s || ''; };
  var who = function () { try { return localStorage.getItem('groWho') || ''; } catch (e) { return ''; } };
  function api(action, body) {
    var url = 'api.php?action=' + action + (T && !body ? '&t=' + encodeURIComponent(T) : '');
    var o = body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ t: T, who: who() }, body)) } : {};
    return fetch(url, Object.assign({ credentials: 'same-origin', cache: 'no-store' }, o)).then(function (r) { return r.json().then(function (j) { j._status = r.status; return j; }); });
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function row(it) {
    var li = el('li', it.done ? 'done' : ''), lb = el('label'), cb = el('input'), sp = el('span');
    cb.type = 'checkbox'; cb.checked = !!it.done;
    cb.addEventListener('change', function () { change('groset', { id: it.id, done: cb.checked }); });
    sp.appendChild(el('span', 'txt', it.text));
    if (it.by) sp.appendChild(el('span', 'by', (it.done && it.doneBy ? 'Checked by ' + it.doneBy : 'Added by ' + it.by)));
    lb.appendChild(cb); lb.appendChild(sp); li.appendChild(lb);
    var x = el('button', 'x', '×'); x.type = 'button'; x.setAttribute('aria-label', 'Remove ' + it.text);
    x.addEventListener('click', function () { change('grodel', { id: it.id }); });
    li.appendChild(x);
    return li;
  }
  function draw(j) {
    rev = j.rev; owner = !!j.owner;
    var todo = j.items.filter(function (i) { return !i.done; }), done = j.items.filter(function (i) { return i.done; });
    $('todo').textContent = ''; $('done').textContent = '';
    if (!todo.length) { var e = el('li', 'empty', done.length ? 'Everything is checked off.' : 'Nothing on the list yet.'); $('todo').appendChild(e); }
    todo.forEach(function (i) { $('todo').appendChild(row(i)); });
    done.forEach(function (i) { $('done').appendChild(row(i)); });
    $('donebox').hidden = !done.length;
    $('sub').textContent = todo.length ? todo.length + ' to get' : 'Shared list';
    $('back').hidden = !owner; $('namebox').hidden = owner;
    if (owner && $('share').hidden) shareBox();
  }
  function load() { if (busy) return; api('gro').then(function (j) { if (!j.ok) { gone(j); return; } if (j.rev !== rev) draw(j); }).catch(function () {}); }
  function change(action, body) {
    busy++; msg('');
    api(action, body).then(function (j) { busy--; if (!j.ok) { if (j._status === 401) gone(j); else msg(j.error || 'Not saved. Try again.'); return; } draw(j); })
      .catch(function () { busy--; msg('No connection. Try again.'); load(); });
  }
  function gone(j) {
    $('main').textContent = '';
    var g = el('div', 'gone', T ? (j && j.error ? j.error : 'This link no longer works.') : 'Sign in to your assistant first. ');
    if (!T) { var a = el('a', null, 'Open the assistant'); a.href = './'; g.appendChild(a); }
    $('main').appendChild(g);
    clearInterval(timer);
  }
  function shareBox() {
    var s = $('share'); s.hidden = false; s.textContent = '';
    s.appendChild(el('b', null, 'Share this list'));
    s.appendChild(el('div', null, 'Send this link to your girlfriend. It opens only the grocery list, nothing else in your assistant. On her iPhone: open it in Safari, then Share → Add to Home Screen.'));
    var r = el('div', 'row'), c = el('button', null, 'Copy her link'), n = el('button', 'alt', 'Make a new link');
    c.type = n.type = 'button';
    var link = function (t) { return location.origin + location.pathname.replace(/[^/]*$/, '') + 'g.html?t=' + t; };
    c.addEventListener('click', function () {
      api('groshare', {}).then(function (j) { if (!j.ok) { msg(j.error || 'Try again.'); return; } var u = link(j.t);
        (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(function () { msg('Link copied. Text it to her.'); }, function () { window.prompt('Copy her link:', u); }); });
    });
    n.addEventListener('click', function () {
      if (!confirm('Make a new link? The old one stops working, so you will need to send her the new one.')) return;
      api('groshare', { renew: true }).then(function (j) { if (j.ok) msg('New link made. Copy it and send it to her.'); });
    });
    r.appendChild(c); r.appendChild(n); s.appendChild(r);
  }
  $('f').addEventListener('submit', function (e) {
    e.preventDefault(); var v = $('t').value.trim(); if (!v) return;
    $('t').value = ''; change('groadd', { text: v }); $('t').focus();
  });
  $('clear').addEventListener('click', function () { change('groclear', {}); });
  $('back').addEventListener('click', function () { location.href = './'; });
  $('who').value = who();
  $('who').addEventListener('change', function () { try { localStorage.setItem('groWho', $('who').value.trim()); } catch (e) {} });
  load();
  var timer = setInterval(function () { if (!document.hidden) load(); }, 5000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
