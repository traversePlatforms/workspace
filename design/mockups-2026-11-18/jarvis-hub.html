<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S. facelift: three directions (mockup, 18 Nov 2026)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- review chrome (not part of the design) ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0b0d12;color:#d9dee8;font:14px/1.45 Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.rv-top{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;padding:14px 24px;background:#11141bf2;border-bottom:1px solid #222836;backdrop-filter:blur(8px)}
.rv-top h1{font-size:15px;font-weight:600;letter-spacing:.02em;margin-right:auto}
.rv-top h1 small{display:block;font-weight:400;color:#8b93a5;font-size:12px}
.seg{display:flex;gap:2px;background:#1a1f2a;border:1px solid #2a3140;border-radius:10px;padding:3px}
.seg button{padding:6px 12px;border-radius:7px;color:#aab2c3;font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#2b3446;color:#fff}
.seg-l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#6f7890;margin-right:6px}
.grp{display:flex;align-items:center}
.rv-note{max-width:1400px;margin:18px auto 0;padding:0 24px;color:#aeb6c6}
.rv-note b{color:#fff}
.rv-stage{display:flex;gap:32px;justify-content:center;align-items:flex-start;padding:20px 24px 60px;flex-wrap:wrap}
.fw{position:relative}
.fw .cap{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#6f7890;margin-bottom:8px}
.fbox{position:relative;overflow:hidden;border-radius:14px;box-shadow:0 0 0 1px #262c3a,0 30px 80px #0008}
.fbox.ph{border-radius:44px;box-shadow:0 0 0 10px #1a1d24,0 0 0 11px #2c313d,0 30px 80px #0009}
.fbox>.scr{position:absolute;left:0;top:0;transform-origin:0 0}
body.full{background:#000;overflow:hidden}
body.full .rv-top,body.full .rv-note,body.full .cap{display:none}
body.full .rv-stage{padding:0;gap:0;display:block}
body.full .fbox{border-radius:0;box-shadow:none}

/* ---------- shared screen bits ---------- */
.scr{overflow:hidden;position:relative;-webkit-font-smoothing:antialiased}
.scr svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sb{display:flex;justify-content:space-between;align-items:center;height:44px;padding:0 26px 0 30px;font:600 15px Inter,sans-serif}
.sb .sbi{display:flex;gap:6px;align-items:center}
.sb .sbi i{display:block;width:17px;height:10px;border-radius:2px;border:1.5px solid currentColor;position:relative}
.sb .sbi i::after{content:"";position:absolute;inset:1px;right:5px;background:currentColor;border-radius:1px}
.sb .sbi b{display:block;width:16px;height:10px;background:linear-gradient(90deg,currentColor 0 3px,transparent 3px 4px,currentColor 4px 7px,transparent 7px 8px,currentColor 8px 11px,transparent 11px 12px,currentColor 12px);clip-path:polygon(0 100%,100% 0,100% 100%)}
.li{display:flex;gap:10px;align-items:flex-start}
.li .lx{flex:1;min-width:0}
.li .lt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .ls{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}
.prog{height:4px;border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:4px}
.chat{display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;min-height:0;-webkit-mask-image:linear-gradient(transparent 0,#000 56px);mask-image:linear-gradient(transparent 0,#000 56px)}
.chat>*{flex:none}
.chips{display:flex;gap:8px;overflow:hidden;flex-wrap:nowrap;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.chip{white-space:nowrap}
.tdots{display:inline-flex;gap:4px}
.tdots i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:tdot 1.2s infinite}
.tdots i:nth-child(2){animation-delay:.15s}.tdots i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes breathe{0%,100%{opacity:.75;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}
@keyframes ripple{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes bars{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.wv{display:inline-flex;align-items:center;gap:3px;height:18px}
.wv i{display:block;width:3px;height:100%;border-radius:2px;background:currentColor;animation:bars .9s ease-in-out infinite;transform-origin:center}
.wv i:nth-child(2n){animation-delay:.12s}.wv i:nth-child(3n){animation-delay:.27s}.wv i:nth-child(5n){animation-delay:.4s}
.caret{display:inline-block;width:2px;height:1.1em;vertical-align:-2px;background:currentColor;animation:blink 1s steps(1) infinite;margin-left:2px}
.spinr{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;vertical-align:-1px}
.ok{color:#4ade80}

/* ======================= DIRECTION A: HALO ======================= */
.dA{--bg:#03060c;--c:#3ee8ff;--c2:#1fb6d6;--cd:#3ee8ff33;--cl:#3ee8ff1f;--ink:#d8f6ff;--mut:#7fa3b4;--warn:#ffb648;--bad:#ff6b6b;
 color:var(--ink);font-family:Inter,sans-serif;background:
 radial-gradient(ellipse 60% 55% at 50% 38%,#0b2a3e 0%,#06121e 45%,transparent 75%),
 radial-gradient(circle at 50% 120%,#06283a 0,transparent 60%),var(--bg)}
.dA::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#3ee8ff0b 1px,transparent 1px),linear-gradient(90deg,#3ee8ff0b 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(ellipse 70% 70% at 50% 45%,#000 30%,transparent 85%)}
.dA::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#ffffff03 0 1px,transparent 1px 3px)}
.dA .mono{font-family:"JetBrains Mono",monospace}
.dA .pnl{position:relative;border:1px solid #3ee8ff1c;background:linear-gradient(180deg,#071826cc,#040c15cc);padding:14px 16px;
 background-image:linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c)),linear-gradient(180deg,#071826d9,#040c15d9);
 background-size:12px 1px,1px 12px,12px 1px,1px 12px,12px 1px,1px 12px,12px 1px,1px 12px,auto;
 background-position:0 0,0 0,100% 0,100% 0,0 100%,0 100%,100% 100%,100% 100%,0 0;background-repeat:no-repeat}
.dA .ph{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;font:500 11px "JetBrains Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--c)}
.dA .ph .n{color:#3ee8ffb8}
.dA .ph .pc{margin-left:auto;color:var(--mut);letter-spacing:.08em}
.dA .li{padding:8px 0;border-top:1px solid #3ee8ff12}
.dA .li:first-of-type{border-top:0}
.dA .lt{font-size:13px;font-weight:500}
.dA .ls{font-size:12px;color:var(--mut)}
.dA .lm{font:11px "JetBrains Mono",monospace;color:var(--mut)}
.dA .bdg{font:600 10px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:1px solid currentColor;border-radius:3px;white-space:nowrap}
.dA .bdg.dr{color:var(--c);background:#3ee8ff14;box-shadow:0 0 10px #3ee8ff33}
.dA .bdg.wk{color:var(--c)}.dA .bdg.nw{color:#a5b4fc}.dA .bdg.nm{color:var(--warn)}
.dA .ibx{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.dA .ibx div{border:1px solid #3ee8ff1a;padding:6px 8px;background:#3ee8ff06}
.dA .ibx b{display:block;font:600 20px Rajdhani,sans-serif;line-height:1}
.dA .ibx span{font:10px "JetBrains Mono",monospace;color:var(--mut);letter-spacing:.04em;display:flex;align-items:center;gap:5px}
.dA .ibx span i{width:6px;height:6px;border-radius:50%}
.dA .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dA .kpi{border:1px solid #3ee8ff1a;padding:8px 10px;background:#3ee8ff06}
.dA .kv{font:600 26px/1 Rajdhani,sans-serif}
.dA .kl{font:10px "JetBrains Mono",monospace;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;margin-top:3px}
.dA .prog{background:#3ee8ff14}.dA .prog i{background:linear-gradient(90deg,var(--c2),var(--c));box-shadow:0 0 8px var(--c)}
.dA .top{display:flex;align-items:center;gap:24px;font:11px "JetBrains Mono",monospace;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.dA .wm{font:700 22px Rajdhani,sans-serif;letter-spacing:.42em;color:#eafcff;text-shadow:0 0 18px #3ee8ff88}
.dA .st{display:flex;align-items:center;gap:6px}
.dA .st i{width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80}
.dA .msg{max-width:88%;font-size:14px;line-height:1.5}
.dA .msg.ai{align-self:flex-start;color:var(--ink)}
.dA .msg.ai .who{font:500 10px "JetBrains Mono",monospace;letter-spacing:.2em;color:var(--c);margin-bottom:4px}
.dA .msg.me{align-self:flex-end;background:#3ee8ff12;border:1px solid #3ee8ff2e;padding:9px 13px;border-radius:14px 14px 2px 14px}
.dA .acard{border:1px solid #3ee8ff38;background:linear-gradient(180deg,#0a2232f0,#061522f0);border-radius:10px;padding:14px 16px;margin-top:8px;box-shadow:0 0 30px #3ee8ff14,inset 0 1px #3ee8ff22}
.dA .acard .ah{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.dA .acard .ah .bdg{margin-left:auto}
.dA .acard .q{margin:10px 0;padding:10px 12px;border-left:2px solid var(--c);background:#3ee8ff0a;color:#bfe9f5;font-size:13px}
.dA .acard .meta{font:11px "JetBrains Mono",monospace;color:var(--mut)}
.dA .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.dA .btn{padding:8px 14px;border-radius:6px;font:600 12px Inter,sans-serif;letter-spacing:.02em;display:inline-flex;align-items:center;gap:6px}
.dA .btn.pri{background:var(--c);color:#022231;box-shadow:0 0 18px #3ee8ff66}
.dA .btn.sec{border:1px solid #3ee8ff55;color:var(--c)}
.dA .btn.gh{color:var(--mut)}
.dA .steps{font:12px "JetBrains Mono",monospace;color:var(--mut);display:grid;gap:5px;margin-top:6px}
.dA .steps .on{color:var(--c)}
.dA .chip{border:1px solid #3ee8ff33;color:#a9e9f7;padding:6px 12px;border-radius:999px;font-size:12px;background:#3ee8ff08}
.dA .cmdbar{display:flex;align-items:center;gap:10px;border:1px solid #3ee8ff40;background:#04111bcc;border-radius:14px;padding:8px 8px 8px 16px;box-shadow:0 0 0 4px #3ee8ff08,0 0 40px #3ee8ff12}
.dA .cmdbar .fld{flex:1;color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden}
.dA .cmdbar .fld.live{color:var(--ink)}
.dA .ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mut)}
.dA .ib.mic{background:#3ee8ff18;color:var(--c);border:1px solid #3ee8ff55}
.dA .ib.mic.on{background:var(--c);color:#022231;box-shadow:0 0 20px var(--c)}
.dA .ib.snd{background:var(--c);color:#022231}
.dA .glink{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.dA .glink b{color:var(--c);font-weight:500}
/* A core */
.dA .core{position:relative;display:grid;place-items:center}
.dA .core svg{overflow:visible}
.dA .core .r-out{transform-origin:center;animation:spin 60s linear infinite}
.dA .core .r-mid{transform-origin:center;animation:spinr 34s linear infinite}
.dA .core .r-arc{transform-origin:center;animation:spin 9s linear infinite;opacity:.0}
.dA .core .glob{transform-origin:center;animation:breathe 5s ease-in-out infinite}
.dA .core .rip{transform-origin:center;opacity:0}
.dA .core .lbl{position:absolute;bottom:-6px;left:0;right:0;text-align:center;font:500 11px "JetBrains Mono",monospace;letter-spacing:.3em;color:var(--c);text-transform:uppercase}
.dA.s-listen .core .rip{animation:ripple 1.8s ease-out infinite}
.dA.s-listen .core .rip.b{animation-delay:.6s}.dA.s-listen .core .rip.c{animation-delay:1.2s}
.dA.s-listen .core .glob{animation-duration:1.4s}
.dA.s-think .core .r-arc{opacity:1;animation-duration:1.1s}
.dA.s-think .core .r-out{animation-duration:8s}
.dA.s-think .core .r-mid{animation-duration:5s}
.dA.s-think .core .glob{animation-duration:2.2s}
.dA.s-answer .core .halo{opacity:.9}
/* A desktop layout */
.dA.desk{display:grid;grid-template-columns:340px minmax(0,1fr) 340px;grid-template-rows:56px 1fr;gap:18px 22px;padding:16px 26px 22px}
.dA.desk .top{grid-column:1/-1;border-bottom:1px solid #3ee8ff1c;padding-bottom:12px}
.dA.desk .colL,.dA.desk .colR{display:flex;flex-direction:column;gap:16px;min-height:0;position:relative;z-index:1}
.dA.desk .mid{display:flex;flex-direction:column;min-height:0;position:relative;z-index:1}
.dA.desk .mid .core{height:250px;flex:none}
.dA.desk .mid .chat{flex:1;gap:12px;padding:0 30px 14px}
.dA.desk .mid .cmd{padding:0 30px}
.dA.desk .chips{margin-bottom:10px}
/* A phone */
.dA.phone{display:flex;flex-direction:column}
.dA.phone .hd{display:flex;align-items:center;justify-content:space-between;padding:4px 20px 0;position:relative;z-index:1}
.dA.phone .wm{font-size:17px;letter-spacing:.34em}
.dA.phone .core{height:178px;flex:none;z-index:1}
.dA.phone .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 12px;z-index:1}
.dA.phone .tiles .pnl{padding:9px 10px}
.dA.phone .tiles .kv{font-size:22px}
.dA.phone .chat{flex:1;gap:10px;padding:0 16px 10px;z-index:1}
.dA.phone .msg{max-width:94%;font-size:13.5px}
.dA.phone .cmd{padding:0 12px 8px;z-index:1}
.dA.phone .chips{margin-bottom:8px}
.dA.phone .tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #3ee8ff1f;padding:8px 6px 24px;background:#02070dcc;z-index:1}
.dA.phone .tabs div{display:flex;flex-direction:column;align-items:center;gap:3px;font:10px "JetBrains Mono",monospace;letter-spacing:.06em;color:var(--mut);position:relative}
.dA.phone .tabs div.on{color:var(--c)}
.dA.phone .tabs svg.i{width:20px;height:20px}
.dA.phone .tabs em{position:absolute;top:-4px;left:50%;margin-left:6px;font:600 9px Inter;background:var(--c);color:#022231;border-radius:8px;padding:0 5px;font-style:normal}

/* ======================= DIRECTION B: COMMAND DECK ======================= */
.dB{--bg:#060912;--a:#2ee6c5;--v:#8b7bff;--ink:#e9eef8;--mut:#8590a8;--line:#ffffff14;--glass:#ffffff08;--warn:#ffb347;
 color:var(--ink);font-family:"Space Grotesk",Inter,sans-serif;background:
 radial-gradient(600px 400px at 18% 10%,#2ee6c51f,transparent 70%),
 radial-gradient(700px 500px at 85% 90%,#8b7bff24,transparent 70%),
 radial-gradient(500px 300px at 60% 40%,#1d3b8a1a,transparent 70%),var(--bg)}
.dB .mono{font-family:"IBM Plex Mono",monospace}
.dB .pnl{background:linear-gradient(180deg,#ffffff0d,#ffffff05);border:1px solid var(--line);border-radius:18px;padding:16px 18px;backdrop-filter:blur(14px);box-shadow:inset 0 1px #ffffff12,0 20px 40px #0005}
.dB .ph{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:600;font-size:14px}
.dB .ph svg.i{color:var(--a)}
.dB .ph .pc{margin-left:auto;font:12px "IBM Plex Mono",monospace;color:var(--mut)}
.dB .li{padding:10px 0;border-top:1px solid var(--line)}
.dB .li:first-of-type{border-top:0;padding-top:4px}
.dB .lt{font-size:13.5px;font-weight:500}
.dB .ls{font-size:12px;color:var(--mut)}
.dB .lm{font:11px "IBM Plex Mono",monospace;color:var(--mut);white-space:nowrap}
.dB .bdg{font:500 11px "Space Grotesk";padding:2px 8px;border-radius:999px;white-space:nowrap}
.dB .bdg.dr{background:linear-gradient(90deg,#2ee6c533,#8b7bff33);color:#bff8ec;border:1px solid #2ee6c555}
.dB .bdg.wk{background:#2ee6c51f;color:var(--a)}.dB .bdg.nw{background:#8b7bff26;color:#c3bbff}.dB .bdg.nm{background:#ffb34726;color:var(--warn)}
.dB .tabsx{display:flex;gap:4px;background:#ffffff08;border-radius:10px;padding:3px;margin-bottom:10px}
.dB .tabsx span{flex:1;text-align:center;padding:6px;border-radius:8px;font-size:12.5px;color:var(--mut)}
.dB .tabsx span.on{background:#ffffff14;color:var(--ink)}
.dB .tabsx em{font-style:normal;font:11px "IBM Plex Mono";margin-left:4px;color:var(--a)}
.dB .kpi{background:linear-gradient(160deg,#ffffff10,#ffffff04);border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative;overflow:hidden}
.dB .kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(var(--k,#2ee6c5),transparent 70%);opacity:.22}
.dB .kv{font:600 30px/1 "Space Grotesk";letter-spacing:-.02em}
.dB .kv small{font-size:14px;color:var(--mut);font-weight:500;margin-left:4px}
.dB .kl{font-size:12px;color:var(--mut);margin-top:6px}
.dB .kl b{color:var(--ink);font-weight:500}
.dB .prog{background:#ffffff10}.dB .prog i{background:linear-gradient(90deg,var(--a),var(--v))}
.dB .msg{max-width:80%;font-size:14.5px;line-height:1.55}
.dB .msg.ai{align-self:flex-start}
.dB .msg.ai .who{font:600 11px "IBM Plex Mono";letter-spacing:.14em;color:var(--a);margin-bottom:4px}
.dB .msg.me{align-self:flex-end;background:linear-gradient(135deg,#2ee6c5,#22b7d8);color:#03201c;padding:10px 15px;border-radius:18px 18px 4px 18px;font-weight:500}
.dB .acard{background:linear-gradient(180deg,#ffffff12,#ffffff06);border:1px solid #ffffff1f;border-radius:18px;padding:16px 18px;margin-top:10px;position:relative;box-shadow:0 20px 50px #0006}
.dB .acard::before{content:"";position:absolute;inset:-1px;border-radius:18px;padding:1px;background:linear-gradient(135deg,#2ee6c5aa,transparent 40%,transparent 60%,#8b7bffaa);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.dB .acard .ah{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.dB .acard .ah .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#2ee6c51f;color:var(--a)}
.dB .acard .ah .bdg{margin-left:auto}
.dB .acard .q{margin:12px 0 4px;padding:12px 14px;border-radius:12px;background:#00000040;color:#c8d1e4;font-size:13.5px}
.dB .acard .meta{font:11.5px "IBM Plex Mono";color:var(--mut);margin-top:8px}
.dB .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.dB .btn{padding:9px 16px;border-radius:11px;font:600 13px "Space Grotesk";display:inline-flex;align-items:center;gap:7px}
.dB .btn.pri{background:linear-gradient(135deg,#2ee6c5,#22b7d8);color:#03201c}
.dB .btn.sec{background:#ffffff10;border:1px solid #ffffff1f}
.dB .btn.gh{color:var(--mut)}
.dB .steps{display:grid;gap:7px;margin-top:8px;font-size:13px;color:var(--mut)}
.dB .steps div{display:flex;gap:8px;align-items:center}
.dB .steps .on{color:var(--a)}

  document.getElementById('fwD').style.display = S.v === 'phone' ? 'none' : ''; document.getElementById('fwP').style.display = S.v === 'desk' ? 'none' : '';
  var W = document.getElementById('stage').clientWidth - 48, pw = 390;
  var avail = S.v === 'both' && W > 1100 ? W - pw - 60 : W;
  var k = Math.min(1, avail / 1440);
  sd.style.transform = 'scale(' + k + ')'; bd.style.width = 1440 * k + 'px'; bd.style.height = 900 * k + 'px';
  var kp = S.v === 'phone' ? 1 : Math.min(1, (900 * k + 120) / 844, (W) / 390);
  if (S.v === 'both' && W > 1100) kp = Math.min(1, 900 * k / 844);
  sp.style.transform = 'scale(' + kp + ')'; bp.style.width = 390 * kp + 'px'; bp.style.height = 844 * kp + 'px';
}
function render() {
  writeHash();
  document.body.classList.toggle('full', !!S.full);
  seg(document.getElementById('segD'), DIRS, 'd'); seg(document.getElementById('segS'), STATES, 's'); seg(document.getElementById('segV'), VIEWS, 'v');
  var D = DIRS[S.d];
  document.getElementById('note').innerHTML = D.note;
  var sd = document.getElementById('scrD'), sp = document.getElementById('scrP');
  sd.className = 'scr desk d' + S.d + ' s-' + S.s; sp.className = 'scr phone d' + S.d + ' s-' + S.s;
  sd.dataset.state = sp.dataset.state = S.s;
  sd.innerHTML = D.desk(S.s); sp.innerHTML = D.phone(S.s);
  document.querySelectorAll('.sttC').forEach(function (e) { e.innerHTML = (S.s === 'listen' ? '<span style="width:7px;height:7px;border-radius:50%;background:#ff6b6b;display:inline-block;box-shadow:0 0 10px #ff6b6b"></span>' : '') + STLABEL[S.s]; });
  fit();
}
readHash(); render();
window.addEventListener('resize', fit);
window.addEventListener('hashchange', function () { readHash(); render(); });
waveFrame();
})();
