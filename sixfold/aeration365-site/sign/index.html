<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Your agreement · Sixfold 365</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2220%22%20fill%3D%22%232F5D2C%22%2F%3E%3Cg%20transform%3D%22translate(6%204)%20scale(.88)%22%3E%3Cpath%20d%3D%22M30%2084%20L50%2038%20L70%2084Z%22%20fill%3D%22%23E4703A%22%20fill-opacity%3D%22.6%22%2F%3E%3Cpath%20d%3D%22M44%2084%20L66%2026%20L88%2084Z%22%20fill%3D%22%23E4703A%22%20fill-opacity%3D%22.82%22%2F%3E%3Cpath%20d%3D%22M60%2084%20L79%2014%20L98%2084Z%22%20fill%3D%22%23E4703A%22%2F%3E%3Cpath%20d%3D%22M22%2069%20L9.5%2081.5%20L34.5%2081.5Z%20M22%2062%20L12%2074%20L32%2074Z%20M22%2055.5%20L14.5%2066.5%20L29.5%2066.5Z%20M4%2086H96V91H4Z%22%20fill%3D%22%23FFF8EC%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<meta name="theme-color" content="#2F5D2C">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--green:#2e5e2c;--green-d:#21451f;--grass:#4c9a3f;--soil:#8a5a3b;--sky:#cfe7f4;--cream:#fdf8ee;--ink:#1d2a1c;--soft:#5a6858;--line:#dfe6da;--card:#ffffff;--bad:#9a3412}
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.55 'DM Sans',system-ui,sans-serif}
  a{color:var(--green)}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px}
  header{background:#fff;border-bottom:1px solid var(--line)}
  header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:68px}
  header img{height:48px;width:auto;display:block}
  header a.call{font:700 15px 'Outfit',sans-serif;text-decoration:none;white-space:nowrap}
  .band{background:var(--sky);position:relative;overflow:hidden;padding:30px 0 62px}
  .band h1{font:800 clamp(28px,6vw,40px)/1.1 'Outfit',sans-serif;color:var(--green-d);margin:0 0 6px}
  .band p{margin:0;color:#2d3b2c;font-size:17px}
  .ground{position:absolute;left:0;right:0;bottom:0;height:36px;background:var(--soil)}
  .ground::before{content:"";position:absolute;left:0;right:0;top:-8px;height:12px;background:var(--grass);border-radius:50% 50% 0 0/100% 100% 0 0}
  main .wrap{display:grid;gap:18px;padding-top:22px;padding-bottom:40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
  .card h2{font:700 22px 'Outfit',sans-serif;color:var(--green);margin:0 0 12px}
  dl{margin:0;display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:8px 14px}
  dt{color:var(--soft);font-size:15px}
  dd{margin:0;font-weight:700}
  ol{margin:0;padding-left:20px;display:grid;gap:8px}
  .muted{color:var(--soft);font-size:14px;margin:0}
  label.name{display:grid;gap:6px;font:700 15px 'DM Sans',sans-serif;margin-top:14px}
  label.name input{font:20px 'DM Sans',sans-serif;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
  label.agree{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:15px}
  label.agree input{width:22px;height:22px;margin-top:2px;accent-color:var(--green);flex:none}
  input:focus-visible,.btn:focus-visible{outline:3px solid var(--grass);outline-offset:2px}
  .btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;margin-top:16px;border:0;border-radius:999px;background:var(--green);color:#fff;font:700 17px 'Outfit',sans-serif;cursor:pointer;text-decoration:none}
  .btn:hover{background:var(--green-d)}.btn:disabled{opacity:.6;cursor:default}
  .btn.ghost{background:#fff;color:var(--green);box-shadow:inset 0 0 0 2px var(--green)}
  .err{color:var(--bad);font-weight:700;font-size:14px;margin-top:10px;min-height:1px}
  .ok{background:#eef6ea;border-color:#cfe3c6}.ok h2{color:var(--green-d)}
  .sig{font:italic 700 26px 'Outfit',sans-serif;color:var(--green-d)}
  .skel{height:220px;border-radius:20px;background:linear-gradient(90deg,#f1ede3,#faf7f0,#f1ede3);background-size:200% 100%;animation:sk 1.2s infinite linear}
  @keyframes sk{to{background-position:-200% 0}}
  @media (prefers-reduced-motion:reduce){.skel{animation:none}}
  footer{background:var(--green-d);color:#cfe0c8;padding:26px 0;font-size:15px}
  footer .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
  footer img{height:56px;width:56px}
  footer a{color:#fff}
  @media print{header,footer,.band .ground,.noprint{display:none}.band{background:none;padding:0}.card{border:0;padding:0}body{background:#fff}}
  /* Sixfold 365 (2026-10-21): forest header with the Ridge mark, gold strip, the ember button; the page's layout is unchanged */
  :root{--green:#2F5D2C;--green-d:#1E3D1C;--cream:#FFF8EC;--line:#E6DCC8;--act:#B84C15;--act-d:#9A3E10;--strip:#F2C14E}
  header{background:var(--green);border-bottom:5px solid var(--strip)}
  header .lock{display:flex;align-items:center;gap:10px;color:var(--cream);text-decoration:none}
  header .lock svg,header .lock img{width:50px;height:50px;display:block}   /* the round Sixfold 365 badge, as on the homepage (2026-10-23) */
  header .lock span{font:800 22px/1 'Outfit',sans-serif;letter-spacing:.01em}
  header .lock b{color:var(--strip);font-weight:800}
  header a.call{color:var(--cream)}
  .band{background:var(--cream)}
  .ground{height:6px;background:var(--strip)}.ground::before{display:none}
  .btn{background:var(--act)}.btn:hover{background:var(--act-d)}
  footer .fmark{width:60px;height:60px;color:var(--cream);display:block}
</style>
</head>
<body>
<header><div class="wrap">
  <a href="/" class="lock" aria-label="Sixfold 365"><img src="/assets/sixfold365-badge-256.png" alt=""><span>Sixfold <b>365</b></span></a>
  <a class="call" href="tel:+17208304553">(720) 830-4553</a>
</div></header>
<div class="band"><div class="wrap"><h1 id="hi">Your agreement</h1><p>Sixfold 365</p></div><div class="ground"></div></div>
<main><div class="wrap" id="main"><div class="skel"></div></div></main>
<footer><div class="wrap">
  <img class="fmark" src="/assets/sixfold365-badge-256.png" alt="">
  <div>Questions? Call or text <a href="tel:+17208304553">(720) 830-4553</a><br><a href="mailto:contact@365aeration.com">contact@365aeration.com</a></div>
</div></footer>
<script>
(function () {
  /* through this site's own relay (api/lead.php), which passes it to the app; /a365/ is the test copy inside the app's test server */
  var API = /^\/a365\//.test(location.pathname) ? '/api/rounds.php' : '/api/lead.php';
  var key = (/[?&]s=([A-Za-z0-9-]+)/.exec(location.search) || [])[1] || '';
  var main = document.getElementById('main');
  function el(n, c, t) { var e = document.createElement(n); if (c) e.className = c; if (t != null) e.textContent = t; return e; }
  function sorry(msg) { main.textContent = ''; var c = el('div', 'card'); c.appendChild(el('h2', null, 'We could not open this form')); c.appendChild(el('p', 'muted', msg)); var a = el('a', 'btn', 'Call or text (720) 830-4553'); a.href = 'tel:+17208304553'; c.appendChild(a); main.appendChild(c); }
  if (!/^[wm]\d{14}[0-9a-f]{6}-[0-9a-f]{16}$/.test(key)) { sorry('This link looks incomplete. Call or text us and we will send it again.'); return; }
  function details(A) {
    var c = el('div', 'card'); c.appendChild(el('h2', null, 'What we agreed'));
    var dl = el('dl'); A.facts.forEach(function (f) { dl.appendChild(el('dt', null, f[0])); dl.appendChild(el('dd', null, f[1])); }); c.appendChild(dl);
    return c;
  }
  function terms(A) {
    var c = el('div', 'card'); c.appendChild(el('h2', null, 'The details'));
    var ol = el('ol'); A.terms.forEach(function (t) { ol.appendChild(el('li', null, t)); }); c.appendChild(ol);
    return c;
  }
  function signedCard(sg, booked, mailed) {
    var c = el('div', 'card ok'); c.appendChild(el('h2', null, booked ? 'Signed. You’re booked' : 'Signed'));
    if (booked) c.appendChild(el('p', null, booked.day + (booked.arrive ? ', arriving ' + booked.arrive : '') + '.'));
    c.appendChild(el('p', 'sig', sg.name));
    c.appendChild(el('p', 'muted', 'Signed electronically on ' + sg.when + '.'));
    if (mailed) c.appendChild(el('p', 'muted', 'A copy has been emailed to ' + mailed + '.'));   /* 2026-10-15 */
    var pr = el('button', 'btn ghost noprint', 'Print or save a copy'); pr.type = 'button'; pr.addEventListener('click', function () { window.print(); }); c.appendChild(pr);
    return c;
  }
  fetch(API + '?action=a365sign&s=' + encodeURIComponent(key) + (/[?&]staff=1\b/.test(location.search) ? '&staff=1' : ''), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (A) {
    if (!A || !A.ok) { sorry((A && A.error) || 'Something went wrong. Call or text us.'); return; }
    document.getElementById('hi').textContent = (A.first ? A.first + ', here’s your ' : 'Your ') + (A.nosign ? 'booking' : 'agreement');
    main.textContent = '';
    if (A.moved) { var mv = el('div', 'card ok'); mv.appendChild(el('h2', null, 'Your day has moved')); mv.appendChild(el('p', 'big', A.moved.day + (A.moved.arrive ? ', arriving ' + A.moved.arrive : '') + '.')); mv.appendChild(el('p', 'muted', 'We moved it for the weather. The agreement below shows the day it was first set for. Questions? Call or text (720) 830-4553.')); main.appendChild(mv); }   /* 2026-10-15 */
    main.appendChild(details(A)); main.appendChild(terms(A));
    if (A.view) {   /* view only (2026-10-16): the agreement as written, nothing to pay or sign */
      var vc = el('div', 'card'); vc.appendChild(el('p', 'muted', 'Questions? Call or text (720) 830-4553.'));
      var vp = el('button', 'btn ghost noprint', 'Print or save a copy'); vp.type = 'button'; vp.addEventListener('click', function () { window.print(); }); vc.appendChild(vp);
      main.appendChild(vc); return;
    }
    if (A.signed) { main.appendChild(signedCard(A.signed, null)); return; }
    if (A.nosign) {   /* no signature needed (2026-10-17): the deposit if it is by card, then this page is their confirmation */
      if (A.pay && !A.pay.paid && A.pay.url) main.appendChild(payCard(A, 'Your day is booked as soon as it’s paid.'));
      var nc = el('div', 'card' + (A.confirmed ? ' ok' : ''));
      nc.appendChild(el('h2', null, A.confirmed ? 'You’re booked' : 'Almost done'));
      if (A.confirmed && A.booked) nc.appendChild(el('p', 'big', A.booked.day + (A.booked.arrive ? ', arriving ' + A.booked.arrive : '') + '.'));
      nc.appendChild(el('p', 'muted', A.confirmed ? 'No signature needed. This page is your confirmation, so keep it for your records.' : 'No signature needed. Your day is held until the deposit is paid.'));
      nc.appendChild(el('p', 'muted', 'Questions? Call or text ' + (A.phone || '(720) 830-4553') + '.'));
      var np = el('button', 'btn ghost noprint', 'Print or save a copy'); np.type = 'button'; np.addEventListener('click', function () { window.print(); }); nc.appendChild(np);
      main.appendChild(nc); return;
    }
    if (A.pay && !A.pay.paid && A.pay.url) main.appendChild(payCard(A, 'You come straight back here to sign.'));
    else if (A.pay && A.pay.paid) { var ok = el('div', 'card ok'); ok.appendChild(el('h2', null, 'Deposit paid')); ok.appendChild(el('p', 'muted', 'Thank you. $' + A.pay.amount + ' received by Square. Now sign below.')); main.appendChild(ok); }
    signBox(A);
  }).catch(function () { sorry('We could not reach our system just now. Try again in a minute, or call or text us.'); });
  /* the deposit by Square (2026-10-15); shared by the signing form and the no-signature one (2026-10-17) */
  function payCard(A, after) {
    {
      var pc = el('div', 'card noprint'); pc.appendChild(el('h2', null, 'Pay your deposit'));
      pc.appendChild(el('p', null, 'Pay the $' + A.pay.amount + ' deposit by card on Square’s secure page. ' + after));
      var sv = null;
      if (A.save) { var sl = el('label', 'agree save'); sv = el('input'); sv.type = 'checkbox'; sv.checked = !!A.save.on; sl.appendChild(sv); sl.appendChild(el('span', null, A.save.text + ' (Optional. Leave it unticked to pay the balance another way.)')); pc.appendChild(sl); }   /* card on file (2026-10-15) */
      var pb = el('a', 'btn', 'Pay $' + A.pay.amount + ' deposit'); pb.href = A.pay.url; pc.appendChild(pb);
      if (sv) pb.addEventListener('click', function (e) {   /* their choice is kept first, then on to Square */
        e.preventDefault(); var go2 = function () { location.href = A.pay.url; };
        fetch(API + '?action=a365savecard', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ s: key, save: sv.checked }) }).then(go2, go2);
      });
      var rf = el('button', 'btn ghost', 'I paid: refresh'); rf.type = 'button'; rf.addEventListener('click', function () { location.reload(); }); pc.appendChild(rf);
      return pc;
    }
  }
  /* the signature (2026-10-14) */
  function signBox(A) {
    var c = el('div', 'card noprint'); c.appendChild(el('h2', null, 'Sign'));
    var nl = el('label', 'name', 'Type your full name'); var ni = el('input'); ni.autocomplete = 'name'; ni.maxLength = 120; nl.appendChild(ni); c.appendChild(nl);
    var boxes = (A.consents && A.consents.length ? A.consents : [A.consent]).map(function (t) { var al = el('label', 'agree'); var ai = el('input'); ai.type = 'checkbox'; al.appendChild(ai); al.appendChild(el('span', null, t)); c.appendChild(al); return ai; });   /* v2: read and agree, and sign electronically */
    var go = el('button', 'btn', 'Sign'); go.type = 'button'; c.appendChild(go);
    if (A.pay && !A.pay.paid) { go.disabled = true; c.appendChild(el('p', 'muted', 'Signing opens once the deposit is paid.')); }
    var err = el('div', 'err'); err.setAttribute('role', 'alert'); c.appendChild(err);
    go.addEventListener('click', function () {
      err.textContent = '';
      if (ni.value.trim().length < 3) { err.textContent = 'Type your full name to sign.'; ni.focus(); return; }
      if (boxes.some(function (b) { return !b.checked; })) { err.textContent = boxes.length > 1 ? 'Tick both boxes to agree.' : 'Tick the box to agree.'; return; }
      go.disabled = true; go.textContent = 'Signing…';
      fetch(API + '?action=a365signed', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ s: key, name: ni.value.trim(), agree: true, read: true }) })
        .then(function (r) { return r.json(); }).then(function (j) {
          if (!j || !j.ok) { go.disabled = false; go.textContent = 'Sign'; err.textContent = (j && j.error) || 'That did not go through. Try again, or call or text us.'; return; }
          c.replaceWith(signedCard(j.signed, j.booked, j.mailed)); window.scrollTo(0, 0);
        }).catch(function () { go.disabled = false; go.textContent = 'Sign'; err.textContent = 'No connection. Try again, or call or text us.'; });
    });
    main.appendChild(c);
  }
})();
</script>
</body>
</html>
