<!doctype html>

<title>Sixfold business card — A · Pine — Brandon Long — PRINT FILE</title>
<style>
  /* ==================================================================
     PRINT FILE for FedEx Office. Built 2026-09-18 from the A · Pine option
     in ../business-cards.html, front arrangement 2 ("both below").

     FedEx spec (office.fedex.com, checked 2026-09-18): file at 3.75 x 2.25 in
     — that is the 3.5 x 2 trim plus 0.125 in bleed on every side — PDF
     preferred, 300 dpi or better, two pages for a double-sided card.

     GEOMETRY. Every page is exactly 3.75 x 2.25 in with zero margin, and the
     Pine ground fills the whole page, so it bleeds. The trim line sits 0.125 in
     inside each edge. Content is inset 0.345 in from the page edge =
     0.125 (bleed) + 0.22 (the proof's own pad), so the layout is the proof's
     layout to the point. Nothing important is closer than 0.22 in to the trim,
     which is well inside FedEx's 0.125 in safe zone.

     Type sizes are the proof's sizes, in points, unchanged. Fonts: the proof
     uses system faces (Palatino Linotype, Cascadia Mono). Chrome embeds the
     glyphs it uses into the PDF, so the file is self-contained — FedEx does
     not need the fonts installed.

     scale: 1 in the JOBS table, and it must stay. 0.8 would print the card at
     80% inside a full-size page.
     ================================================================== */
  @page { size: 3.75in 2.25in; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Cascadia Mono", Consolas, "SFMono-Regular", monospace; }

  .page {
    position: relative;
    width: 3.75in; height: 2.25in;
    background: #0E1512;
    overflow: hidden;
    page-break-after: always;
    break-after: page;
  }
  .page:last-child { page-break-after: auto; break-after: auto; }
  .pad { position: absolute; inset: 0.345in; }

  /* on screen only: show the trim so the proof can be checked by eye */
  @media screen {
    body { background: #4A5550; padding: 24px; display: flex; gap: 24px; flex-wrap: wrap; }
    .page { box-shadow: 0 6px 24px rgba(0,0,0,.4); }
    .page::after { content: ""; position: absolute; inset: 0.125in; border: 0.4pt dashed rgba(255,255,255,.35); pointer-events: none; }
  }

  .wordmark { font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; font-size: 19pt; letter-spacing: -.3pt; line-height: 1; color: #EDE7DC; }
  .nm  { font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; font-size: 12pt; line-height: 1.1; color: #EDE7DC; }
  .ti  { font-size: 5.8pt; letter-spacing: 1.4pt; text-transform: uppercase; color: #8AA07A; margin-top: 2pt; }
  .dt  { font-size: 6.6pt; line-height: 1.85; color: #EDE7DC; }
  .dt .web { color: #E4703A; }
  .svc { font-size: 5.6pt; letter-spacing: 1.2pt; color: rgba(237,231,220,.5); }
  .band { font-size: 5.4pt; letter-spacing: 3.2pt; color: #8AA07A; margin-top: 4pt; }
  .co   { font-size: 5.2pt; letter-spacing: 3.6pt; color: rgba(237,231,220,.55); margin-top: 2.5pt; }
</style>
</head>
<body>
