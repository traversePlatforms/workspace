<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sixfold business card — Matthew Sharpe, ember on Bone</title>
<style>
  /* 3.75 x 2.25 in = a 3.5 x 2 in card plus 0.125 in bleed on every side.
     Two pages: 1 front, 2 back. Render at scale 1 — see tools/html-to-pdf.mjs. */
  @page { size: 3.75in 2.25in; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Cascadia Mono", Consolas, "SFMono-Regular", monospace; }

  .page { position: relative; width: 3.75in; height: 2.25in; background: #EDE7DC;
    overflow: hidden; page-break-after: always; break-after: page;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page:last-child { page-break-after: auto; break-after: auto; }
  /* 0.30in from the page edge = 0.175in inside the trim. FedEx asks for nothing
     important within 0.125in of the trim; this still clears the guard. */
  .pad { position: absolute; inset: 0.30in; }
  /* ⚑ An svg is a flex item and the default flex-shrink will SILENTLY squash it
     when the stack overflows — the mark comes out distorted and nothing looks
     wrong until you measure it. This happened at the first attempt on this card. */
  .pad > svg, .wordmark, .band, .co { flex: none; }

  @media screen {
    body { background: #4A5550; padding: 24px; display: flex; gap: 24px; flex-wrap: wrap; }
    .page { box-shadow: 0 6px 24px rgba(0,0,0,.4); }
    .page::after { content: ""; position: absolute; inset: 0.125in;
      border: 0.4pt dashed rgba(255,255,255,.35); pointer-events: none; }
  }

  /* ---- FRONT ---- */
  .wordmark { font-family: "Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
    font-size: 21pt; letter-spacing: -.35pt; line-height: 1; color: #0E1512; }
  .band { font-size: 6.2pt; letter-spacing: 3.5pt; color: #8A3A10; margin-top: 5pt; }
  .co   { font-size: 6.2pt; letter-spacing: 3.9pt; color: #5F6A62; margin-top: 3pt; }

  /* ---- BACK ---- */
  .back { display: flex; gap: .13in; align-items: stretch; height: 100%; }
  .info { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column;
    justify-content: space-between; }
  .nm  { font-family: "Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
    font-size: 12pt; line-height: 1.1; color: #0E1512; }
  .ti  { font-size: 6.2pt; letter-spacing: 1.4pt; text-transform: uppercase; color: #8A3A10; margin-top: 2pt; }
  .dt  { font-size: 7pt; line-height: 1.8; color: #0E1512; }
  .dt .web { color: #A34312; }
  .svc { font-size: 6.2pt; letter-spacing: 1.2pt; color: #5F6A62; }

  .qrwrap { flex: 0 0 auto; display: flex; flex-direction: column;
    align-items: center; justify-content: center; }
  /* The plate is padding around the image. The image already carries the
     4-module quiet zone; this only ever adds to it. */
  .plate { background: #EDE7DC; padding: 0.055in; border-radius: .055in;
    line-height: 0; }
  .plate img { display: block; width: 1.22in; height: 1.22in; }
  .qrcap { font-size: 6pt; letter-spacing: 1.1pt; text-transform: uppercase;
    color: #5F6A62; margin-top: 3.5pt; text-align: center; }
</style>
</head>
<body>

<!-- PAGE 1 — FRONT -->
<div class="page">
  <div class="pad" style="display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="3.5 13 95 101" width="85" height="90" role="img" aria-label="Sixfold mark, Ridge"><path fill="#B84C15" fill-rule="evenodd" d="M18 84L18.3 83.4L18.3 84L18 84ZM25.7 83.1L28.65 83.1L28.26 84L25.7 84L25.7 83.1ZM28.73 62.53L36 48L40.23 56.46L33.11 72.83L29.17 68.1L32.53 68.1L28.73 62.53ZM30.86 75.6L31.91 75.6L31.59 76.33L30.86 75.6ZM30 84L30.39 83.1L38.36 83.1L32.81 77.54L33.65 75.6L35.42 75.6L34.26 74.21L50 38L55.2 49.96L42.29 84L30 84Z"/><path fill="#8A3A10" fill-rule="evenodd" d="M44 84L66 26L70.71 38.42L58.34 84L44 84Z"/><path fill="#6E2E0C" fill-rule="evenodd" d="M60 84L79 14L98 84L60 84Z"/><path fill="#C9561F" fill-rule="evenodd" d="M9.5 81.5L17 74L12 74L18.25 66.5L14.5 66.5L22 55.5L29.5 66.5L25.75 66.5L32 74L27 74L34.5 81.5L24.1 81.5L24.1 84.5L19.9 84.5L19.9 81.5L9.5 81.5Z"/><path fill="#1F2A25" d="M4 86L96 86L96 91L4 91Z"/><g fill="none" stroke="#1F2A25" stroke-linecap="round" stroke-linejoin="round"><path d="M94 91 L92.2 94.4 L94.6 98 L91.4 102 L93.4 106 L90 109.4 L89.8 113" stroke-width="1.6"/><path d="M90.5 91 L88.4 93.6 L85.4 95.2 L87.8 98.6 L82.4 101.4 L84.2 104.6 L79.6 108" stroke-width="1.35"/><path d="M86.5 91 L83.8 92.6 L85.8 95 L80.4 96.2 L77.6 99 L74 99.2 L71.5 101" stroke-width="1.1"/><path d="M96 91 L97.6 93.8 L95 96.2 L97.4 99.6 L94.8 102.4 L96 106" stroke-width="1.15"/><path d="M92.6 91 L90.6 94.6 L92.4 97.6 L89.4 100.6 L90.6 104.4 L88 107.4" stroke-width="1.05"/><path d="M87.8 98.6 L85.4 100.8 L86.6 103.4 L83 105.8 L83.8 109" stroke-width="0.9"/><path d="M91.4 102 L94.2 103.4 L93.4 106.2 L95.8 108.6" stroke-width="0.85"/><path d="M84.6 91 L82.4 92.6 L83.8 94.8 L78.4 95.6 L75.6 97.4 L72.4 97.6" stroke-width="0.8"/><path d="M85.8 95 L83.4 96.8 L84.4 99.4 L80.6 100.8" stroke-width="0.75"/><path d="M95 91 L96.6 94.2 L94.4 96.6 L96.4 100" stroke-width="0.85"/></g></svg>
    <div class="wordmark" style="margin-top:4pt">Sixfold</div>
    <div class="band">LAWN, LAND &amp; FIRE</div>
    <div class="co">COLORADO</div>
  </div>
</div>

<!-- PAGE 2 — BACK -->
<div class="page">
  <div class="pad">
    <div class="back">
      <div class="info">
        <div>
          <div class="nm">Matthew Sharpe</div>
          <div class="ti">CTO</div>
        </div>
        <div class="dt">
          (803) 260-7359<br>
          M.Sharpe@SixfoldColorado.com<br>
          <span class="web">SixfoldColorado.com</span>
        </div>
        <div class="svc">AERATION &middot; LAWN CARE<br>LANDSCAPING &middot; FIRE</div>
      </div>
      <div class="qrwrap">
        <div class="plate">
          <img src="../../brand/qr/sixfold-qr-brand.png" alt="Scan for Sixfold Colorado">
        </div>
        <div class="qrcap">Scan for<br>our page</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
