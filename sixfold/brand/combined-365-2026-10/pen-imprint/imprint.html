<!doctype html>
<!-- Sixfold 365 pen imprint (2026-10-19, Matthew, for 4imprint Javelin Pen #6551: imprint area 0.75" H x 1.5" W, ONE colour).
     Drawn at true size: 1in = 96 CSS px, so the box is 144 x 72. ?c=white (dark pen) or ?c=green (white pen).
     The round badge is not used: its ring lettering would print near 3pt here and fill in. The flat Ridge mark (no roots) carries the
     brand; every line of type is 6.5pt or larger. render.mjs screenshots this at 8x with a clear background. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:transparent}
  .art{width:144px;height:72px;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--c);font-family:Outfit,sans-serif}
  .art svg{width:40px;height:33.6px;flex:none}
  .t{display:flex;flex-direction:column;line-height:1}
  .n{font-weight:800;font-size:14px;letter-spacing:.04em}            /* 10.5pt */
  .d{font-weight:700;font-size:8.7px;letter-spacing:.02em;margin-top:2.5px}   /* 6.5pt */
  .p{font-weight:800;font-size:11.4px;margin-top:4px}                 /* 8.5pt */
  .w{font-weight:600;font-size:9.4px;margin-top:2.5px}                /* 7pt */
</style></head>
<body>
<div class="art" id="art">
  <svg viewBox="4 13 94 79" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M18 84L18.3 83.4L18.3 84L18 84ZM25.7 83.1L28.65 83.1L28.26 84L25.7 84L25.7 83.1ZM28.73 62.53L36 48L40.23 56.46L33.11 72.83L29.17 68.1L32.53 68.1L28.73 62.53ZM30.86 75.6L31.910 75.6L31.59 76.33L30.86 75.6ZM30 84L30.39 83.1L38.36 83.1L32.81 77.54L33.65 75.6L35.42 75.6L34.26 74.21L50 38L55.2 49.96L42.29 84L30 84ZM44 84L66 26L70.71 38.42L58.34 84L44 84ZM60 84L79 14L98 84L60 84ZM9.5 81.5L17 74L12 74L18.25 66.5L14.5 66.5L22 55.5L29.5 66.5L25.75 66.5L32 74L27 74L34.5 81.5L24.1 81.5L24.1 84.5L19.9 84.5L19.9 81.5L9.5 81.5ZM4 86L96 86L96 91L4 91Z"/></svg>
  <div class="t">
    <span class="n">SIXFOLD 365</span>
    <span class="d">Aeration &amp; Seeding</span>
    <span class="p">(720) 830-4553</span>
    <span class="w">365aeration.com</span>
  </div>
</div>
<script>
  var c = (/[?&]c=(\w+)/.exec(location.search) || [])[1];
  document.getElementById('art').style.setProperty('--c', c === 'white' ? '#ffffff' : '#2F5D2C');
</script>
</body></html>
