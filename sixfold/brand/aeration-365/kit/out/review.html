ness page<br>Page › Edit › Cover photo.</figcaption></figure><figure><img src="social/google-business-cover-1024x576.png" loading="lazy"><figcaption><b>social/google-business-cover-1024x576.png</b> · 1024×576 · Google Business Profile<br>Photos › Cover photo.</figcaption></figure><figure><img src="social/share-image-1200x630.png" loading="lazy"><figcaption><b>social/share-image-1200x630.png</b> · 1200×630 · Links shared anywhere (365aeration.com)<br>Used by the website as its share picture.</figcaption></figure><figure><img src="social/post-intro-1080x1350.png" loading="lazy"><figcaption><b>social/post-intro-1080x1350.png</b> · 1080×1350 · Instagram / Facebook post<br>Feed post (4:5).</figcaption></figure><figure><img src="social/post-tip1-water-1080x1350.png" loading="lazy"><figcaption><b>social/post-tip1-water-1080x1350.png</b> · 1080×1350 · Instagram / Facebook post<br>Feed post (4:5). Source: CSU Extension PlantTalk 1505.</figcaption></figure><figure><img src="social/post-tip2-plugs-1080x1350.png" loading="lazy"><figcaption><b>social/post-tip2-plugs-1080x1350.png</b> · 1080×1350 · Instagram / Facebook post<br>Feed post (4:5). Source: UMass Amherst Extension.</figcaption></figure><figure><img src="social/post-tip3-season-1080x1350.png" loading="lazy"><figcaption><b>social/post-tip3-season-1080x1350.png</b> · 1080×1350 · Instagram / Facebook post<br>Feed post (4:5). Source: CSU Extension PlantTalk 1505.</figcaption></figure><figure><img src="social/story-quote-1080x1920.png" loading="lazy"><figcaption><b>social/story-quote-1080x1920.png</b> · 1080×1920 · Instagram / Facebook story<br>Story (9:16). Add a link sticker to 365aeration.com when posting.</figcaption></figure><figure><img src="social/highlight-quotes-1080x1920.png" loading="lazy"><figcaption><b>social/highlight-quotes-1080x1920.png</b> · 1080×1920 · Instagram story highlight cover<br>Edit highlight › Edit cover › pick from camera roll.</figcaption></figure><figure><img src="social/highlight-tips-1080x1920.png" loading="lazy"><figcaption><b>social/highlight-tips-1080x1920.png</b> · 1080×1920 · Instagram story highlight cover<br>Edit highlight › Edit cover › pick from camera roll.</figcaption></figure><figure><img src="social/highlight-about-1080x1920.png" loading="lazy"><figcaption><b>social/highlight-about-1080x1920.png</b> · 1080×1920 · Instagram story highlight cover<br>Edit highlight › Edit cover › pick from camera roll.</figcaption></figure><figure><img src="square/square-logo-small-400x400.png" loading="lazy"><figcaption><b>square/square-logo-small-400x400.png</b> · 400×400 · Square: small logo<br>Branding set › Small logo. Square asks for 400×400.</figcaption></figure><figure><img src="square/square-logo-full-1280x648.png" loading="lazy"><figcaption><b>square/square-logo-full-1280x648.png</b> · 1280×648 · Square: full logo<br>Branding set › Full logo. Square asks for at least 1280×648.</figcaption></figure><figure><img src="square/square-logo-full-transparent-1280x648.png" loading="lazy"><figcaption><b>square/square-logo-full-transparent-1280x648.png</b> · 1280×648 · Square: full logo (clear background)<br>Use instead of the white one if a page behind it is coloured.</figcaption></figure><figure><img src="square/square-logo-print-400x200.png" loading="lazy"><figcaption><b>square/square-logo-print-400x200.png</b> · 400×200 · Square: printed receipt logo<br>Printed receipts are black only, so this is black type on white. Square asks for at least 400×200.</figcaption></figure><figure><img src="square/square-logo-print-800x400.png" loading="lazy"><figcaption><b>square/square-logo-print-800x400.png</b> · 800×400 · Square: printed receipt logo (sharper)<br>The same at twice the size, if Square accepts it.</figcaption></figure><figure><img src="square/square-customer-display-2560x1600.png" loading="lazy"><figcaption><b>square/square-customer-display-2560x1600.png</b> · 2560×1600 · Square Register: customer display<br>Square recommends 2560×1600 for the customer-facing screen.</figcaption></figure>
