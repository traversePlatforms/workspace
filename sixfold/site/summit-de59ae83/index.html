<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Door rounds — Sixfold Colorado</title>
<!-- home-screen app (2026-10-02): add it once from the browser's share menu and it
     opens full screen with the Sixfold icon. No service worker: the page always
     loads fresh, so an upload is never hidden behind a stale offline copy. -->
<meta name="theme-color" content="#1F2A25">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rounds">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<!--
  Sixfold Colorado — door rounds, crew page. 2026-09-29.

  Read on a phone, in a driveway, often in sun, sometimes with gloves on. So:
  big addresses, big tap targets, light ground by default, and nothing that
  needs two hands.

  ⚑ NOTHING IS EMBEDDED IN THIS FILE. Every door comes from api/rounds.php after
  sign-in, one neighbourhood at a time. The page is public; the data is not.

  ⚑ QUEUED MARKS. Signal dies past Woodland Park. A mark that cannot be sent is
  kept in localStorage and retried, and the door shows as pending rather than
  done. The page never says a mark is saved when it is not — that is the failure
  that would make the crew stop trusting it.
-->
<style>
  /* ---- the 2026-10-02 look ----
     Sixfold's agreed five (pine, timber, ember, moss, bone) on a LIGHT ground by
     default, because this is read in full sun. Dark follows the phone's setting.
     Atkinson Hyperlegible for everything you read at a glance; the Palatino wordmark
     serif for names and addresses. Fire-hazard colours unchanged: every pairing was
     checked at >= 4.5:1, and every badge says its level in words. */
  :root{
    color-scheme: light;
    --bg:#F4F0E8; --card:#FFFDF9; --ink:#16201C; --soft:#55635B; --line:#DCD3C3; --sunk:#ECE6DA;
    --bar:#1F2A25; --bar-ink:#EDE7DC; --bar-soft:#A9B5AC; --bar-lift:rgba(237,231,220,.09); --bar-edge:rgba(237,231,220,.16);
    --ember:#E4703A; --ember-ink:#B84C15; --on-ember:#FFFFFF; --moss:#8AA07A; --moss-ink:#4E6142;
    --go:#2F7A4F; --on-go:#FFFFFF; --go-tint:#DDEBE1;
    --later:#8F5C0E; --later-tint:#F5E7CF; --miss:#4C5A53; --miss-tint:#E7E3DA; --bad:#A33A2A;
    --booked:#2F7A4F; --accent:#4E6142;
    --fire-vh:#9E2A1C; --fire-h:#A8460F; --fire-m:#85600F; --fire-low:#5F6B63; --fire-on:#FFFFFF;
    --toast:#16201C; --toast-ink:#EDE7DC;
    --shadow:0 1px 2px rgba(22,32,28,.05), 0 8px 22px -12px rgba(22,32,28,.22);
    --signin:#1F2A25; --signin-deep:#0E1512; --signin-ink:#EDE7DC; --signin-soft:#A9B5AC; --key:#2A3731; --key-down:#3A4A42;
    --serif:"Palatino Linotype","Book Antiqua",Palatino,"URW Palladio L",Georgia,serif;
    --sans:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --bg:#0E1512; --card:#18221D; --ink:#EDE7DC; --soft:#A3AEA6; --line:#2B3731; --sunk:#131C18;
      --bar:#16201B;
      --ember-ink:#F08A57; --on-ember:#0E1512; --moss-ink:#A9C196;
      --go:#7FC195; --on-go:#0A1A10; --go-tint:#1B3323;
      --later:#E2AA5C; --later-tint:#2D2416; --miss:#B4BEB7; --miss-tint:#222C27; --bad:#E0715C;
      --booked:#7FC195; --accent:#A9C196;
      --fire-vh:#F0806A; --fire-h:#F2A35E; --fire-m:#E0B85E; --fire-low:#9AA79E; --fire-on:#0E1512;
      --toast:#EDE7DC; --toast-ink:#16201C;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 24px -12px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box}
  /* ⚑ hidden must beat every display rule below: without this the dock's
     display:flex kept an empty bar on screen where no switch belongs */
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);
    -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--ember);outline-offset:2px}
  .vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .wrap{max-width:680px;margin:0 auto;padding-inline:14px;padding-block:14px 40px}
  body.has-dock .wrap{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
  .ic{width:20px;height:20px;flex:none}

  /* ---- splash, while the page asks who you are ---- */
  .splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    background:radial-gradient(120% 70% at 50% 20%,var(--signin) 0%,var(--signin-deep) 80%);color:var(--signin-ink);transition:opacity .35s}
  .splash svg{width:92px;height:88px;color:var(--ember);animation:rise .5s ease both}
  .splash b{font:400 38px/1 var(--serif);letter-spacing:-.018em}
  .splash.out{opacity:0;pointer-events:none}

  /* ---- app bar ---- */
  .appbar{position:sticky;top:0;z-index:10;background:var(--bar);color:var(--bar-ink);
    padding:calc(10px + env(safe-area-inset-top,0px)) 14px 12px;box-shadow:0 6px 18px -12px rgba(0,0,0,.5)}
  .barin{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:42px}
  .appbar .mk{width:32px;height:31px;color:var(--ember);flex:none}
  .appbar .ttl{flex:1;min-width:0}
  .appbar .ttl b{display:block;font:400 20px/1.15 var(--serif);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .appbar .ttl span{display:block;font-size:12.5px;color:var(--bar-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .appbar .back{width:40px;height:40px;border-radius:12px;border:0;background:var(--bar-lift);color:var(--bar-ink);
    display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
  .avatar{width:40px;height:40px;border-radius:50%;border:0;background:var(--moss);color:#0E1512;display:grid;place-items:center;
    font-weight:700;font-size:14px;flex:none;cursor:pointer;padding:0}
  .count{flex:none;text-align:right;line-height:1}
  .count b{display:block;font-size:28px;font-variant-numeric:tabular-nums;color:var(--ember)}
  .count span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--bar-soft)}
  .count.bump b{animation:bump .45s ease}
  @keyframes bump{30%{transform:scale(1.3);color:var(--bar-ink)}}
  .regions{flex:1;min-width:0}
  .regions select{width:100%;font:700 16px var(--sans);padding:10px 36px 10px 12px;border-radius:12px;
    border:1px solid var(--bar-edge);background-color:var(--bar-lift);color:var(--bar-ink);
    -webkit-appearance:none;appearance:none;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
    background-position:calc(100% - 19px) 50%,calc(100% - 13px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
  .regions select option{color:#16201C;background:#FFFDF9}

  /* ---- dock: the view switch, at the bottom where the thumb is ---- */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:12;display:flex;gap:6px;background:var(--bar);
    padding:7px max(10px,calc((100% - 680px) / 2)) calc(7px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -8px 20px -14px rgba(0,0,0,.6)}
  .dock button{flex:1;border:0;background:transparent;color:var(--bar-soft);padding:9px 4px 7px;border-radius:13px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:700;transition:background .2s,color .2s}
  .dock button .ic{width:22px;height:22px}
  .dock button[aria-pressed="true"]{background:var(--ember-ink);color:var(--on-ember)}

  /* ---- messages ---- */
  .msg{margin:12px 0 0;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:14px;line-height:1.5;color:var(--soft)}
  .msg.bad{border-color:var(--bad);color:var(--bad)}
  h2{font:700 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:22px 4px 10px}
  .back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--accent);font:700 14px var(--sans);padding:8px 2px;cursor:pointer}
  .back .ic{width:17px;height:17px}

  /* ---- sign in ---- */
  .signin{position:fixed;inset:0;z-index:20;overflow-y:auto;display:flex;flex-direction:column;align-items:center;
    padding:calc(36px + env(safe-area-inset-top,0px)) 24px calc(20px + env(safe-area-inset-bottom,0px));
    background:radial-gradient(120% 70% at 50% 0%,var(--signin) 0%,var(--signin-deep) 78%);color:var(--signin-ink)}
  .signin .in{width:100%;max-width:360px;flex:1;display:flex;flex-direction:column;align-items:center}
  .signin .mk{width:84px;height:80px;color:var(--ember)}
  .signin h1{font:400 40px/1 var(--serif);letter-spacing:-.018em;margin:14px 0 4px}
  .signin .sub{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--moss);font-weight:700}
  .signin .prompt{margin:28px 0 12px;color:var(--signin-soft);font-size:15px}
  .boxes{display:flex;gap:8px}
  .boxes span{width:44px;height:56px;border-radius:12px;border:1.5px solid rgba(237,231,220,.22);display:grid;place-items:center;
    font-size:26px;font-weight:700;transition:border-color .15s,background .15s}
  .boxes span.on{border-color:var(--ember);background:rgba(228,112,58,.12)}
  .boxes span.next{border-color:rgba(237,231,220,.6)}
  .boxes.busy span{animation:breathe .9s ease-in-out infinite}
  .boxes.ok span{border-color:var(--moss);background:rgba(138,160,122,.2);animation:pop .4s ease both}
  .boxes.ok span:nth-child(2){animation-delay:.04s}.boxes.ok span:nth-child(3){animation-delay:.08s}
  .boxes.ok span:nth-child(4){animation-delay:.12s}.boxes.ok span:nth-child(5){animation-delay:.16s}.boxes.ok span:nth-child(6){animation-delay:.2s}
  .boxes.err{animation:shake .4s ease}
  .boxes.err span{border-color:#E0715C}
  @keyframes breathe{50%{opacity:.45}}
  @keyframes pop{40%{transform:translateY(-6px)}}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .signin .say{min-height:44px;margin-top:12px;font-size:14px;font-weight:700;text-align:center;color:var(--moss)}
  .signin .say.bad{color:#F0806A}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin-top:auto}
  .keys button{height:60px;border-radius:16px;border:0;background:var(--key);color:var(--signin-ink);font-size:25px;font-weight:700;cursor:pointer;
    transition:transform .08s,background .15s;display:grid;place-items:center}
  .keys button:active{transform:scale(.94);background:var(--key-down)}
  .keys button.ghost{background:transparent;cursor:default}
  .keys button .ic{width:28px;height:28px}
  .hint{margin-top:16px;font-size:13px;color:var(--signin-soft);display:flex;align-items:center;gap:7px;text-align:left}
  .hint .ic{width:17px;height:17px;color:var(--moss)}

  /* ---- field tools ---- */
  .choose{max-width:460px;margin:8px auto 0}
  .choose .who{color:var(--soft);font-size:14.5px;margin:6px 4px 16px}
  .choose .tile{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;margin-bottom:11px;padding:16px;
    border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);box-shadow:var(--shadow);text-decoration:none;
    transition:transform .12s}
  .choose .tile:active{transform:scale(.985)}
  .choose .tile .ti{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--bar);color:var(--ember)}
  .choose .tile .ti .ic{width:26px;height:26px}
  .choose .tile .tt{flex:1;min-width:0}
  .choose .tile b{display:block;font:400 20px/1.15 var(--serif);margin:2px 0 4px}
  .choose .tile span{display:block;font-size:14px;color:var(--soft);line-height:1.45}
  .choose .tile .tag{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--moss-ink)}
  .choose .out{margin:18px 4px 0;font-size:14px}
  .choose .out button{background:none;border:0;color:var(--soft);text-decoration:underline;cursor:pointer;padding:0}

  /* ---- town summary + neighbourhoods ---- */
  .prog{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;gap:16px;align-items:center;box-shadow:var(--shadow)}
  .prog .pi{min-width:0}
  .prog h3{margin:0;font:400 21px/1.15 var(--serif)}
  .prog .pt{margin:3px 0 9px;color:var(--soft);font-size:14px;font-variant-numeric:tabular-nums}
  .ring{flex:none;position:relative;display:grid;place-items:center}
  .ring > svg{display:block;transform:rotate(-90deg)}
  .ring .trk{stroke:var(--sunk)} .ring .val{stroke:var(--ember);transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
  .ring.done .val{stroke:var(--go)}
  .ring em{position:absolute;font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;text-align:center}
  .prog .ring em{font-size:19px}
  .prog .ring em small{display:block;font-size:9.5px;letter-spacing:.1em;color:var(--soft);margin-top:3px}
  .ring.done em .ic{width:18px;height:18px;color:var(--go)}
  .chips{display:flex;gap:5px;flex-wrap:wrap}
  .chip,.again,.duep,.nsp,.hot,.bk,.lawnc{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;line-height:1.35;white-space:nowrap}
  .chip .ic,.again .ic,.duep .ic,.nsp .ic,.hot .ic,.bk .ic,.lawnc .ic{width:13px;height:13px}
  .bk{background:var(--go-tint);color:var(--go)}
  .duep{background:var(--later-tint);color:var(--later)}
  .again{background:var(--miss-tint);color:var(--miss)}
  .nsp{background:var(--ink);color:var(--bg)}
  .hot{background:var(--fire-h);color:var(--fire-on)} .hot.v{background:var(--fire-vh)}
  .sect{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 10px}
  .sect h2{margin:0}
  .sect span{font-size:12.5px;color:var(--soft)}
  .area{width:100%;text-align:left;display:flex;gap:13px;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:18px;padding:13px 14px;margin-bottom:9px;cursor:pointer;color:inherit;box-shadow:var(--shadow);transition:transform .12s}
  .area:active{transform:scale(.985)}
  .area .ring em{font-size:12px}
  .area .mid{flex:1;min-width:0}
  .area .nm{font:400 17px/1.2 var(--serif);letter-spacing:-.005em;overflow-wrap:anywhere}
  .area .chips > *{white-space:normal;max-width:100%}
  .area .sub{font-size:12.5px;color:var(--soft);margin:2px 0 6px;font-variant-numeric:tabular-nums}
  .area .left{flex:none;text-align:right;line-height:1;font-variant-numeric:tabular-nums}
  .area .left b{display:block;font-size:25px}
  .area .left small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
  .area[data-done="1"]{background:transparent;box-shadow:none}
  .area[data-done="1"] .left b{color:var(--go);font-size:15px}
  .area[data-nosol] .nm{color:var(--soft);text-decoration:line-through;text-decoration-thickness:1px}
  .adminlink{display:inline-flex;align-items:center;gap:6px;margin:14px 4px 0;color:var(--accent);font-size:14px;font-weight:700;
    background:none;border:0;padding:6px 0;cursor:pointer;text-decoration:none}

  /* ---- doors ---- */
  .door{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px 19px;margin-bottom:10px;
    overflow:hidden;box-shadow:var(--shadow);transition:height .32s cubic-bezier(.4,0,.2,1),margin .32s,padding .32s,opacity .3s,transform .32s}
  .door::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--edge,var(--line))}
  .door.f5{--edge:var(--fire-vh)} .door.f4{--edge:var(--fire-h)} .door.f3{--edge:var(--fire-m)} .door.f2,.door.f1,.door.fx{--edge:var(--fire-low)}
  .d-top{display:flex;align-items:baseline;gap:8px}
  .door .addr{flex:1;min-width:0;font:400 20px/1.18 var(--serif);letter-spacing:-.01em}
  .door .meta{font-size:13.5px;color:var(--soft);margin-top:6px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .door .meta.st{margin-top:5px;font-weight:700}
  .dist{flex:none;font-size:13px;font-weight:700;color:var(--ember-ink);font-variant-numeric:tabular-nums}
  .fire{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;line-height:1.35;white-space:nowrap;
    box-shadow:inset 0 0 0 1.5px currentColor}
  .fire .ic{width:13px;height:13px}
  .fire.f5{background:var(--fire-vh);color:var(--fire-on);box-shadow:none}
  .fire.f4{background:var(--fire-h);color:var(--fire-on);box-shadow:none}
  .fire.f3{color:var(--fire-m)}
  .fire.f1,.fire.f2{color:var(--fire-low)}
  .fire.fx{color:var(--fire-low);box-shadow:none;border:1.5px dashed currentColor}
  .acts{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:7px;margin-top:11px}
  .acts button{border:0;border-radius:14px;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;
    font-size:13px;font-weight:700;cursor:pointer;transition:transform .08s}
  .acts button:active{transform:scale(.95)}
  .acts button .ic{width:22px;height:22px}
  .acts button[data-k="booked"]{background:var(--ember-ink);color:var(--on-ember)}
  .acts button[data-k="later"]{background:var(--later-tint);color:var(--later)}
  .acts button[data-k="miss"]{background:var(--miss-tint);color:var(--miss)}
  .stamp{position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;font-weight:700;font-size:17px;
    background:color-mix(in srgb,var(--go) 93%,transparent);color:var(--on-go)}
  .stamp.later{background:color-mix(in srgb,var(--later-tint) 95%,transparent);color:var(--later)}
  .stamp.miss,.stamp.nosolicit{background:color-mix(in srgb,var(--miss-tint) 95%,transparent);color:var(--miss)}
  .stamp div{display:flex;flex-direction:column;align-items:center;gap:4px}
  .stamp .ic{width:40px;height:40px;stroke-dasharray:32;stroke-dashoffset:32}
  .door.marking .stamp{animation:fadein .22s ease forwards}
  .door.marking .stamp .ic{animation:draw .35s .08s ease forwards}
  @keyframes fadein{to{opacity:1}}
  @keyframes draw{to{stroke-dashoffset:0}}
  .door.gone{opacity:0;transform:translateX(46px)}
  .door.flash{animation:flash 1.6s ease}
  @keyframes flash{0%,65%{box-shadow:0 0 0 3px var(--ember)}}

  .door.done{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px;padding:11px 12px 11px 16px;
    background:transparent;box-shadow:none;border-style:dashed}
  .door.done::before{width:4px}
  .door.done .addr{font-size:16px;color:var(--ink)}
  .door.done .fire{margin-top:5px;font-size:11px;padding:2px 7px}
  .by{font-size:12px;color:var(--soft);margin-top:3px}
  .tag{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
  .tag.booked{color:var(--go);background:var(--go-tint)}
  .tag.later{color:var(--later);background:var(--later-tint)}
  .tag.miss{color:var(--miss);background:var(--miss-tint)}
  .tag.nosolicit{color:var(--bg);background:var(--ink)}
  .tag.pending{color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
  .undo{border:0;background:var(--sunk);border-radius:10px;padding:6px 11px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}
  .door.done .xt{flex-basis:100%}

  /* tools row, phone, note */
  .xt{margin-top:2px}
  .adds{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .adds a.sat,.adds .lnk{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--moss-ink);text-decoration:none;
    background:var(--sunk);border:0;border-radius:10px;padding:6px 10px;cursor:pointer;white-space:nowrap}
  .adds .ic{width:15px;height:15px}
  .ph{margin-top:10px;font-size:13px}
  .ph a.num{display:inline-flex;align-items:center;gap:7px;font-size:17px;font-weight:700;color:var(--ink);text-decoration:none}
  .ph a.num .ic{width:17px;height:17px;color:var(--go)}
  .ph .src,.nt .src{display:block;font-size:12px;color:var(--soft);margin-top:2px}
  .ph .dnc{display:block;font-size:12px;color:var(--later);margin-top:3px;font-weight:700}
  .ph button.lnk,.nt button.lnk{background:none;border:0;padding:6px 0 0;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer}
  .phf{margin-top:6px;display:grid;gap:10px;background:var(--sunk);border-radius:14px;padding:12px}
  .phf label{font-size:12.5px;font-weight:700;color:var(--soft);display:grid;gap:5px}
  .phf input,.phf select,.phf textarea{font:16px var(--sans);padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;
    background:var(--card);color:var(--ink);width:100%}
  .phf textarea{resize:vertical;min-height:76px}
  .phf .cnt{font-size:12px;color:var(--soft);margin-top:-5px}
  .phf .row{display:flex;gap:7px}
  .phf .row button{flex:1;font-size:14px;font-weight:700;padding:12px 4px;border-radius:12px;border:0;background:var(--card);color:var(--soft);cursor:pointer}
  .phf .row button.save{background:var(--go);color:var(--on-go)}
  .phf .err{font-size:13px;color:var(--bad);font-weight:700}
  .phf .err:empty{display:none}
  .nt{margin-top:10px}
  .ntxt{font-size:14.5px;line-height:1.45;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;
    background:var(--sunk);border-radius:12px;padding:9px 12px}

  /* "not now" chooser */
  .later{margin-top:11px;border-radius:16px;padding:12px;background:var(--later-tint);animation:rise .25s ease both}
  .later .lq{font-size:14px;font-weight:700;color:var(--later);margin-bottom:9px}
  .later .chips{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .later .chip{display:block;text-align:left;padding:10px 12px;border-radius:12px;border:0;background:var(--card);color:var(--ink);
    cursor:pointer;font-size:14px;font-weight:700;white-space:normal;line-height:1.3}
  .later .chip .cd{display:block;font-weight:400;font-size:12.5px;color:var(--soft);margin-top:2px}
  .later .pick{display:flex;gap:7px;align-items:flex-end;margin-top:9px}
  .later .pick label{flex:1;font-size:12.5px;font-weight:700;color:var(--later);display:grid;gap:5px}
  .later .pick input{font:16px var(--sans);padding:10px;border:0;border-radius:12px;background:var(--card);color:var(--ink);width:100%}
  .later .pick .chip{flex:none;text-align:center}
  .later .row2{display:flex;gap:7px;margin-top:9px}
  .later .row2 button{flex:1;font-size:13.5px;font-weight:700;padding:11px 4px;border-radius:12px;border:0;background:var(--card);color:var(--soft);cursor:pointer}
  .later .nosol{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:9px;padding:11px;border-radius:12px;
    border:1.5px dashed var(--later);background:transparent;color:var(--later);font-size:13.5px;font-weight:700;cursor:pointer}
  .later .nosol .ic{width:16px;height:16px}

  /* finished, skeleton, flags */
  .finished{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 18px;margin-bottom:10px;box-shadow:var(--shadow);animation:rise .4s ease both}
  .finished svg.mkf{width:60px;height:58px;color:var(--ember)}
  .finished h3{font:400 25px/1.15 var(--serif);margin:10px 0 4px}
  .finished p{margin:0 0 16px;color:var(--soft)}
  .finished button{border:0;background:var(--ember-ink);color:var(--on-ember);border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer}
  .skel{height:160px;border-radius:18px;margin-bottom:10px;background:linear-gradient(100deg,var(--sunk) 30%,var(--card) 50%,var(--sunk) 70%) 0 0/300% 100%;
    animation:shimmer 1.1s linear infinite}
  .skel.s2{height:96px}
  @keyframes shimmer{to{background-position:-150% 0}}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}}
  .nsban{margin:4px 0 12px;padding:13px 14px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:14px;line-height:1.45}
  .nsban b{display:flex;align-items:center;gap:7px;font-size:15px;margin-bottom:3px}
  .nsban b .ic{width:17px;height:17px}
  .nsban button{margin-top:10px;padding:8px 12px;border-radius:10px;border:1px solid currentColor;background:transparent;color:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .jump{display:flex;align-items:center;gap:8px;width:100%;margin:2px 0 12px;padding:12px 14px;border-radius:14px;border:0;
    background:var(--miss-tint);color:var(--miss);font-size:14.5px;font-weight:700;cursor:pointer;text-align:left}
  .jump .ic{width:19px;height:19px}
  .jump.fu{background:var(--later-tint);color:var(--later);margin:12px 0 0}
  .jump .fut{display:flex;flex-direction:column;line-height:1.3}
  .jump .fut small{font-weight:400;font-size:13px;opacity:.9}
  #dueHead,#againHead{scroll-margin-top:calc(88px + env(safe-area-inset-top,0px))}   /* land below the sticky app bar */
  .jump .ic:last-child{margin-left:auto}
  .putback{border:0;background:var(--sunk);color:var(--ink);border-radius:9px;padding:5px 10px;font-size:12.5px;font-weight:700;cursor:pointer}
  /* lawn level (SX-19): from the 2023 aerial photo, or the crew's answer */
  .lawn{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font:700 12px/1.35 var(--sans);
    white-space:nowrap;border:0;cursor:pointer}
  span.lawn{cursor:default}
  .lawn .ic{width:13px;height:13px}
  .lawn em{font-style:normal;font-weight:400;opacity:.85}
  .lawn.lv-L{background:var(--go);color:var(--on-go)}
  .lawn.lv-M{background:var(--go-tint);color:var(--go)}
  .lawn.lv-S{background:transparent;color:var(--go);box-shadow:inset 0 0 0 1.5px var(--go)}
  .lawn.lv-N{background:var(--miss-tint);color:var(--miss)}
  .lawn.lv-T{background:transparent;color:var(--miss);box-shadow:inset 0 0 0 1.5px var(--miss)}
  .lawn.lv-x{background:transparent;color:var(--soft);box-shadow:inset 0 0 0 1.5px var(--line)}
  .door.done .lawn{margin-top:5px;font-size:11px;padding:2px 7px}
  .lawnc{background:var(--go-tint);color:var(--go)}
  .lawnfix{margin-top:10px;border-radius:14px;padding:12px;background:var(--go-tint);animation:rise .25s ease both;flex-basis:100%}
  .lawnfix .lq{font-size:14px;font-weight:700;color:var(--go)}
  .lawnfix .lsub{font-size:12.5px;color:var(--soft);margin:2px 0 9px}
  .lawnfix .lrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .lawnfix .lrow button{border:0;border-radius:11px;padding:10px 4px;background:var(--card);color:var(--ink);font-size:13.5px;font-weight:700;cursor:pointer}
  .lawnfix .lrow button.on{background:var(--go);color:var(--on-go)}
  .lawnfix .lrow2{display:flex;gap:7px;margin-top:8px}
  .lawnfix .lrow2 button{flex:1;border:0;border-radius:11px;padding:9px;background:transparent;color:var(--soft);font-size:13px;font-weight:700;cursor:pointer}
  /* aerial view: the lot, its line, the photo */
  .aerial{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
  .aerial .ahead{background:var(--bar);color:var(--bar-ink);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 12px;display:flex;gap:10px;align-items:center}
  .aerial .ahead b{flex:1;min-width:0;font:400 19px/1.2 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .aerial .ahead button{width:40px;height:40px;border-radius:12px;border:0;background:var(--bar-lift);color:var(--bar-ink);display:grid;place-items:center;cursor:pointer;flex:none}
  .aerial .amap{flex:1;min-height:0;position:relative;isolation:isolate;z-index:0;background:#2a332e}
  .aerial .afoot{padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    background:var(--card);border-top:1px solid var(--line)}
  .aerial .afoot span{flex:1;min-width:190px;font-size:12.5px;line-height:1.4;color:var(--soft)}
  .aerial .afoot a{display:inline-flex;align-items:center;gap:6px;background:var(--ember-ink);color:var(--on-ember);border-radius:12px;
    padding:11px 15px;font-weight:700;font-size:14px;text-decoration:none;flex:none}
  .aerial .afoot a .ic{width:17px;height:17px}
  .geohelp b{display:block;font-size:15px;margin-bottom:4px}
  .geohelp ol{margin:6px 0 4px;padding-left:20px;color:var(--ink);font-size:13.5px;line-height:1.5}
  .geohelp li+li{margin-top:4px}
  .geohelp .back{color:var(--bad)}
  /* map card: the full door card slides up over the map; minimise to tap the next house */
  .msheet{max-height:72%;overflow-y:auto;padding:6px 10px 10px}
  .msheet .shbar{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--card);padding:4px 0 6px;z-index:1}
  .msheet .shbar .grabbtn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;padding:6px 2px;color:var(--ink)}
  .msheet .shbar .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0;flex:none}
  .msheet .shbar .shaddr{flex:1;min-width:0;text-align:left;font:400 16px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .msheet .shbar .shbtn{width:36px;height:36px;border-radius:11px;border:0;background:var(--sunk);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
  .msheet .shbar .shbtn .ic{width:18px;height:18px}
  .msheet .door{box-shadow:none;border:0;margin:0;padding:2px 2px 4px 12px;background:transparent}
  .msheet .door::before{border-radius:3px}
  /* email */
  .ph.em a.num .ic{color:var(--accent)}
  /* photos */
  .photos{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
  .photos button{flex:none;width:76px;height:76px;border-radius:10px;border:0;padding:0;overflow:hidden;background:var(--sunk);cursor:pointer}
  .photos img{width:100%;height:100%;object-fit:cover;display:block}
  .phrule{font-size:11.5px;color:var(--soft);margin-top:4px}
  .pviewer{position:fixed;inset:0;z-index:45;background:#0b0f0d;display:flex;flex-direction:column;color:#EDE7DC}
  .pviewer .pvimg{flex:1;min-height:0;display:grid;place-items:center;padding:10px}
  .pviewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
  .pviewer .pvbar{display:flex;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
  .pviewer .pvbar span{flex:1;min-width:0;font-size:13.5px;color:#A9B5AC}
  .pviewer button{border:0;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;background:rgba(237,231,220,.12);color:#EDE7DC;display:inline-flex;align-items:center;gap:6px}
  .pviewer button.del{background:#A33A2A}
  /* stats */
  .stoday{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
  .stoday h3{margin:0 0 10px;font:400 20px var(--serif)}
  .stgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stgrid div{background:var(--sunk);border-radius:14px;padding:11px 12px}
  .stgrid b{display:block;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
  .stgrid span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);font-weight:700}
  .stgrid .hl b{color:var(--ember-ink)}
  .stcmp{margin:12px 2px 0;font-size:13.5px;color:var(--soft);line-height:1.5}
  .stcmp .up{color:var(--go);font-weight:700} .stcmp .dn{color:var(--bad);font-weight:700}
  .stchart{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 10px 6px;box-shadow:var(--shadow)}
  .stchart svg{display:block;width:100%;height:auto}
  .stchart .key{display:flex;gap:14px;font-size:12px;color:var(--soft);margin:4px 4px 6px}
  .stchart .key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .stday{display:flex;align-items:baseline;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  .stday b{min-width:84px;font-weight:700}
  .stday span{flex:1;min-width:0;color:var(--soft);font-size:13.5px}
  .seg{display:flex;gap:4px;margin:0 0 12px;padding:4px;background:var(--sunk);border-radius:14px}
  .seg button{flex:1;border:0;background:transparent;color:var(--soft);font:700 14px var(--sans);padding:9px 4px;border-radius:11px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .mdrow2{display:flex;gap:8px;margin:0 0 10px}
  .mdrow2 input,.mdrow2 select,.mdlater input{flex:1;min-width:0;font:600 14px var(--sans);padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  .mdlater input{display:block;width:100%;margin-top:8px}
  .tag.onlist{color:var(--ink);background:var(--sunk)}
  .mdacts{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;align-items:center}
  .mdb{border:0;border-radius:11px;padding:8px 11px;font:700 13px var(--sans);cursor:pointer}
  .mdb.booked{background:var(--ember-ink);color:var(--on-ember)}
  .mdb.later{background:var(--later-tint);color:var(--later)}
  .mdb.miss{background:var(--miss-tint);color:var(--miss)}
  .mdb.nosolicit{background:var(--sunk);color:var(--ink)}
  .mdacts .putback{font:700 13px var(--sans);padding:8px 11px;border-radius:11px}
  .mdopen{margin-left:auto;border:0;background:transparent;color:var(--ember-ink);font:700 13.5px var(--sans);display:inline-flex;align-items:center;gap:2px;cursor:pointer;padding:8px 2px}
  .mdopen .ic{width:16px;height:16px}
  .tag.later{margin-top:0;padding:3px 10px;border-radius:999px;animation:none}
  .mdb.later{margin-top:0;padding:8px 11px;border-radius:11px;animation:none}
  .stday em{font-style:normal;font-weight:700;color:var(--ember-ink)}
  .teamrow{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;align-items:baseline;background:var(--card);
    border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;cursor:pointer;color:inherit;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
  .teamrow .tn{font:400 17px var(--serif);grid-column:1}
  .teamrow .tv{text-align:right}
  .teamrow .tv b{display:block;font-size:19px}
  .teamrow .tv small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
  .teamrow .ts{grid-column:1/-1;font-size:12.5px;color:var(--soft)}
  .nsflag{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin:22px 0 4px;padding:13px;border-radius:14px;
    border:1.5px dashed var(--line);background:transparent;color:var(--soft);font-size:13.5px;font-weight:700;cursor:pointer}
  .nsflag .ic{width:16px;height:16px}

  /* ---- map ---- */
  .mapwrap{position:relative;margin-top:4px}
  /* isolation keeps Leaflet's internal z-indexes (up to 1000) under the app bar and the dock */
  .map{height:calc(100vh - 250px);height:calc(100dvh - 250px);min-height:340px;border-radius:20px;border:1px solid var(--line);overflow:hidden;
    position:relative;z-index:0;isolation:isolate;box-shadow:var(--shadow)}
  .legend{position:absolute;top:10px;left:10px;right:58px;z-index:2;display:flex;flex-wrap:wrap;gap:5px;pointer-events:none}
  .legend span{display:inline-flex;align-items:center;gap:5px;background:var(--card);color:var(--ink);border-radius:999px;padding:4px 9px 4px 6px;
    font-size:11.5px;font-weight:700;box-shadow:0 2px 6px -2px rgba(0,0,0,.3)}
  .legend i{width:11px;height:11px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .legend i.h{background:transparent;border:2.5px solid #9E2A1C;box-shadow:none}
  .mapwrap.has-sheet .leaflet-bottom{bottom:var(--sheet-h,0px);transition:bottom .3s}
  .msheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;background:var(--card);border-radius:18px;padding:14px 14px 12px;
    box-shadow:0 -8px 30px -12px rgba(0,0,0,.45);animation:sheetup .3s cubic-bezier(.2,.9,.3,1.1) both}
  @keyframes sheetup{from{transform:translateY(24px);opacity:0}}
  .msheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:-4px auto 10px}
  .msheet .pa{font:400 19px/1.2 var(--serif)}
  .msheet .ps{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:5px;font-size:13.5px;color:var(--soft)}
  .msheet .row{display:flex;gap:7px;margin-top:11px}
  .msheet .row > *{flex:1;border:0;border-radius:12px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;
    align-items:center;justify-content:center;gap:6px;text-decoration:none}
  .msheet .row .ic{width:17px;height:17px}
  .msheet .pb{background:var(--ember-ink);color:var(--on-ember)}
  .msheet .px{background:var(--sunk);color:var(--ink)}
  .you-ic span{display:block;width:16px;height:16px;border-radius:50%;background:#111;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);position:relative}
  .you-ic span::after{content:"";position:absolute;inset:-3px;border-radius:50%;background:#111;opacity:.3;animation:pulse 2s ease-out infinite;z-index:-1}
  @keyframes pulse{from{transform:scale(.8);opacity:.4}to{transform:scale(3);opacity:0}}

  /* ---- quotes to build ---- */
  .qc .meta{margin-top:4px}
  .qsent{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:12px;padding:13px;border-radius:14px;border:0;
    background:var(--go);color:var(--on-go);font-size:14px;font-weight:700;cursor:pointer}
  .qsent .ic{width:18px;height:18px}
  .qsent.on{background:var(--sunk);color:var(--soft)}
  .qc.sent{opacity:.8}
  .sub2{font-size:14px;color:var(--soft);margin:2px 4px 12px}

  /* ---- report ---- */
  .tablecard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 14px;overflow-x:auto;box-shadow:var(--shadow)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 8px 9px 0;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:0}
  th{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
  td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}

  /* ---- toast + burst ---- */
  .toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:14;width:min(652px,calc(100% - 28px));
    background:var(--toast);color:var(--toast-ink);border-radius:14px;padding:11px 10px 11px 15px;display:flex;align-items:center;gap:10px;
    font-size:14px;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);transform:translate(-50%,24px);opacity:0;pointer-events:none;
    transition:transform .28s cubic-bezier(.2,.9,.3,1.2),opacity .2s}
  body:not(.has-dock) .toast{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
  .toast span{flex:1;min-width:0;overflow-wrap:anywhere}
  .toast button{border:0;background:transparent;color:var(--ember);font-weight:700;cursor:pointer;padding:6px 8px;font-size:14px}
  .burst{position:fixed;width:0;height:0;z-index:30;pointer-events:none}
  .burst i{position:absolute;left:0;top:0;width:var(--s);height:var(--s);border-radius:2px;background:var(--c);animation:fly .8s cubic-bezier(.15,.7,.3,1) forwards}
  @keyframes fly{from{transform:translate(-50%,-50%);opacity:1}to{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.4);opacity:0}}

  footer{margin:26px 4px 0;padding-top:14px;border-top:1px solid var(--line);font-size:12px;line-height:1.6;color:var(--soft)}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <!-- the Ridge mark, flat, as used in the public site's header -->
  <symbol id="ridge" viewBox="0 0 100 96"><path fill="currentColor" fill-rule="evenodd" d="M18 84L18.3 83.4L18.3 84L18 84ZM25.7 83.1L28.65 83.1L28.26 84L25.7 84L25.7 83.1ZM28.73 62.53L36 48L40.23 56.46L33.11 72.83L29.17 68.1L32.53 68.1L28.73 62.53ZM30.86 75.6L31.91 75.6L31.59 76.33L30.86 75.6ZM30 84L30.39 83.1L38.36 83.1L32.81 77.54L33.65 75.6L35.42 75.6L34.26 74.21L50 38L55.2 49.96L42.29 84L30 84ZM44 84L66 26L70.71 38.42L58.34 84L44 84ZM60 84L79 14L98 84L60 84ZM9.5 81.5L17 74L12 74L18.25 66.5L14.5 66.5L22 55.5L29.5 66.5L25.75 66.5L32 74L27 74L34.5 81.5L24.1 81.5L24.1 84.5L19.9 84.5L19.9 81.5L9.5 81.5ZM4 86L96 86L96 91L4 91Z"/></symbol>
</svg>
<div class="splash" id="splash" aria-hidden="true"><svg viewBox="0 0 100 96"><use href="#ridge"/></svg><b>Sixfold</b></div>
<header class="appbar" id="hdr" hidden><div class="barin" id="barin"></div></header>
<div class="wrap">
  <div id="view"></div>
  <footer id="foot" hidden>
    Lot sizes from county assessor public records. Every door listed is one where the owner
    lives at the property. Mark every door, including the misses.
  </footer>
</div>
<nav class="dock sortbar" id="dock" hidden aria-label="View"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button type="button" id="toastUndo">Undo</button></div>

<script>
(function () {
  var API = '../api/rounds.php';
  var OUT = { booked: 'Quote booked', later: 'Not now', miss: 'No answer', nosolicit: 'No soliciting' };
  var QKEY = 'sixfold.rounds.queue';

  var view = document.getElementById('view');
  var hdr = document.getElementById('hdr');
  var foot = document.getElementById('foot');
  var regionBar = null;                         /* built by setBar('town') */
  var dock = document.getElementById('dock');

  var S = { me: null, role: 'crew', regions: [], region: null, area: null, doors: [], busy: false };

  function q(n, c, t) { var e = document.createElement(n); if (c) e.className = c; if (t !== undefined) e.textContent = t; return e; }

  /* ---- offline queue ---- */
  function queue() { try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch (e) { return []; } }
  function setQueue(a) { try { localStorage.setItem(QKEY, JSON.stringify(a)); } catch (e) {} }
  function enqueue(item) { var a = queue(); a.push(item); setQueue(a); }
  function pendingFor(id) { return queue().filter(function (x) { return x.id === id; }).pop(); }

  function api(action, opts) {
    opts = opts || {};
    var url = API + '?action=' + encodeURIComponent(action);
    if (opts.params) for (var k in opts.params) url += '&' + k + '=' + encodeURIComponent(opts.params[k]);
    return fetch(url, {
      method: opts.body ? 'POST' : 'GET',
      headers: opts.body ? { 'Content-Type': 'application/json' } : {},
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      credentials: 'same-origin'
    }).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: 'Server did not answer properly.' }; })
        .then(function (j) { j._status = r.status; return j; });
    });
  }

  function flush() {
    var a = queue();
    if (!a.length) return Promise.resolve();
    var item = a[0];
    return api('mark', { body: item }).then(function (j) {
      if (!j.ok && j._status !== 500) return;          /* a rejected mark is not retried forever */
      var rest = queue().slice(1);
      setQueue(rest);
      if (rest.length) return flush();
    }).catch(function () {});
  }

  /* ---- the 2026-10-02 look: icons, rings, app bar, dock, toast, burst ----
     Every icon is a constant string drawn on a 24-unit grid; nothing from the
     server is ever put through innerHTML. */
  var ICON = {
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    knock: '<path d="M7 21V4.5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1V21M4.5 21h15"/><circle cx="13.8" cy="12.5" r=".9" fill="currentColor"/>',
    globe: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.6 5.4 3.6 8.5s-1 6.1-3.6 8.5c-2.6-2.4-3.6-5.4-3.6-8.5s1-6.1 3.6-8.5z"/>',
    phone: '<path d="M6 3.5h3.2l1.6 4.4-2.1 1.3a10.5 10.5 0 0 0 6.1 6.1l1.3-2.1 4.4 1.6V18a2 2 0 0 1-2 2A15.5 15.5 0 0 1 4 6a2 2 0 0 1 2-2.5z"/>',
    note: '<path d="M5 4h14v10.5L14.5 19H5z"/><path d="M14 19v-5h5"/>',
    flame: '<path d="M12 3c.8 3 5 4.8 5 9.8a5 5 0 0 1-10 0c0-2.2 1.1-3.7 2.1-4.6.2 1.5.9 2.5 2 3 0-2.8-.9-4.8.9-8.2z"/>',
    flag: '<path d="M6 21V4M6 4.5h10.5l-2 4 2 4H6"/>',
    mail: '<rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="M4 7l8 6 8-6"/>',
    camera: '<path d="M4 8.5h3l1.8-2.5h6.4L17 8.5h3v10H4z"/><circle cx="12" cy="13.2" r="3.4"/>',
    chart: '<path d="M4 20V4M4 20h16"/><path d="M8 16v-5M12 16V8M16 16v-3"/>',
    users: '<circle cx="9" cy="8.5" r="3"/><path d="M3.5 19c.6-3.3 2.8-5 5.5-5s4.9 1.7 5.5 5"/><circle cx="16.5" cy="9" r="2.4"/><path d="M15.5 14.2c2.4.1 4.2 1.6 4.8 4.3"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    leaf: '<path d="M5 19.5c0-8.5 5.5-14 14.5-14.5 0 9-5.5 14.5-14 14.5z"/><path d="M5 19.5c3-4.5 6.5-7.5 10.5-9.5"/>',
    list: '<path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.5" cy="6.5" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="17.5" r="1" fill="currentColor"/>',
    near: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/>',
    map: '<path d="M9 4.5L3.5 6.5v13l5.5-2 6 2 5.5-2v-13l-5.5 2z"/><path d="M9 4.5v13M15 6.5v13"/>',
    route: '<circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8.2 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.8"/>',
    back: '<path d="M15 5l-7 7 7 7"/>',
    chev: '<path d="M9 6l6 6-6 6"/>',
    del: '<path d="M9 5h11v14H9l-6-7z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/>',
    card: '<rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M7 10h10M7 14h6"/>',
    door: '<path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M3.5 21h17"/><circle cx="14.5" cy="12" r="1" fill="currentColor"/>',
    calc: '<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.5 7h7M8.5 11.5h1M12 11.5h1M15.5 11.5h0M8.5 15h1M12 15h1M8.5 18h1M12 18h1M15.5 15v3"/>',
    clip: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/>',
    table: '<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M9.5 9.5v10"/>',
    mobile: '<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/>',
    refresh: '<path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4"/>'
  };
  function ico(name, sw) {
    var w = document.createElement('span');
    w.innerHTML = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 2) +
      '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + ICON[name] + '</svg>';
    return w.firstChild;
  }
  function ridge(cls) {
    var w = document.createElement('span');
    w.innerHTML = '<svg class="' + cls + '" viewBox="0 0 100 96" aria-hidden="true" focusable="false"><use href="#ridge"/></svg>';
    return w.firstChild;
  }
  function reduced() { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
  function standalone() {
    return !!((window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone);
  }
  function initials(name) {
    var p = String(name || '').trim().split(/\s+/).filter(Boolean);
    return p.length ? (p[0].charAt(0) + (p.length > 1 ? p[p.length - 1].charAt(0) : '')).toUpperCase() : '·';
  }
  function townLabel() { var r = S.regions.filter(function (x) { return x.key === S.region; })[0]; return r ? r.label : ''; }
  function chipEl(cls, icn, text) { var c = q('span', cls); if (icn) c.appendChild(ico(icn, 2.4)); c.appendChild(document.createTextNode(text)); return c; }

  /* a progress ring: pct 0..1, centre is text or a node */
  function ring(size, stroke, pct, centre, done) {
    var r = (size - stroke) / 2, C = 2 * Math.PI * r, w = q('div', 'ring' + (done ? ' done' : ''));
    w.style.width = size + 'px'; w.style.height = size + 'px';
    w.innerHTML = '<svg width="' + size + '" height="' + size + '" aria-hidden="true"><circle class="trk" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r +
      '" fill="none" stroke-width="' + stroke + '"/><circle class="val" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke-width="' + stroke +
      '" stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - Math.max(0, Math.min(1, pct)))).toFixed(1) + '"/></svg>';
    var em = q('em');
    if (typeof centre === 'string') em.textContent = centre; else if (centre) em.appendChild(centre);
    w.appendChild(em);
    return w;
  }
  function pctText(p) { return p > 0 && p < 0.01 ? '<1%' : Math.round(p * 100) + '%'; }

  /* the app bar: 'town' (mark, town picker, you), or a titled bar with a back button */
  function setBar(mode, o) {
    o = o || {};
    hdr.hidden = false;
    S.barArea = null;                             /* renderDoors re-claims it */
    var b = document.getElementById('barin');
    b.textContent = '';
    if (mode === 'town') {
      b.appendChild(ridge('mk'));
      regionBar = q('div', 'regions'); regionBar.id = 'regions';
      b.appendChild(regionBar);
      var av = q('button', 'avatar', initials(S.me)); av.type = 'button';
      av.setAttribute('aria-label', 'Field tools and sign out' + (S.me ? ' — signed in as ' + S.me : ''));
      av.addEventListener('click', chooseView);
      b.appendChild(av);
      return;
    }
    if (o.back) {
      var bk = q('button', 'back'); bk.type = 'button';
      bk.appendChild(ico('back', 2.4));
      bk.appendChild(q('span', 'vh', o.backLabel || 'Back'));
      bk.addEventListener('click', o.back);
      b.appendChild(bk);
    } else b.appendChild(ridge('mk'));
    var t = q('div', 'ttl');
    t.appendChild(q('b', null, o.title || ''));
    if (o.sub) t.appendChild(q('span', null, o.sub));
    b.appendChild(t);
    if (typeof o.count === 'number') {
      var c = q('div', 'count'); c.id = 'barCount';
      c.appendChild(q('b', null, String(o.count)));
      c.appendChild(q('span', null, 'to knock'));
      b.appendChild(c);
    }
  }

  /* the dock: the view switch, at the bottom where a thumb reaches */
  function setDock(items, current, onPick) {
    if (!items) { dock.hidden = true; dock.textContent = ''; document.body.classList.remove('has-dock'); return; }
    dock.hidden = false; document.body.classList.add('has-dock');
    dock.textContent = '';
    items.forEach(function (m) {
      var b = q('button'); b.type = 'button';
      b.appendChild(ico(m[2]));
      b.appendChild(document.createTextNode(m[1]));
      b.setAttribute('aria-pressed', String(current === m[0]));
      b.addEventListener('click', function () { onPick(m[0]); });
      dock.appendChild(b);
    });
  }

  /* toast with Undo. It names what was marked, and never says "saved": a mark
     with no signal is queued, and the Done row says "not sent yet" until it goes. */
  var toastTimer = null, toastUndo = null;
  function toast(strong, rest, undo) {
    var t = document.getElementById('toast'), m = document.getElementById('toastMsg'), u = document.getElementById('toastUndo');
    m.textContent = '';
    m.appendChild(q('b', null, strong));
    if (rest) m.appendChild(document.createTextNode(' · ' + rest));
    u.hidden = !undo; toastUndo = undo || null;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 4500);
  }
  function hideToast() { document.getElementById('toast').classList.remove('show'); toastUndo = null; }

  /* a small ember burst, for a quote booked and a finished neighbourhood */
  function burst(fromEl) {
    if (reduced() || !fromEl || !fromEl.getBoundingClientRect) return;
    var r = fromEl.getBoundingClientRect(), b = q('div', 'burst');
    b.style.left = (r.left + r.width / 2) + 'px'; b.style.top = (r.top + r.height / 2) + 'px';
    var cols = ['#E4703A', '#F2A35E', '#8AA07A', '#EDE7DC', '#B84C15'];
    for (var i = 0; i < 16; i++) {
      var a = Math.PI * 2 * i / 16 + Math.random() * 0.4, d = 44 + Math.random() * 48, p = q('i');
      p.style.setProperty('--x', (Math.cos(a) * d) + 'px');
      p.style.setProperty('--y', (Math.sin(a) * d - 18) + 'px');
      p.style.setProperty('--r', (Math.random() * 360) + 'deg');
      p.style.setProperty('--c', cols[i % cols.length]);
      p.style.setProperty('--s', (5 + Math.random() * 5) + 'px');
      b.appendChild(p);
    }
    document.body.appendChild(b);
    setTimeout(function () { b.remove(); }, 900);
  }
  function hideSplash() {
    var s = document.getElementById('splash');
    if (!s || s.classList.contains('out')) return;
    s.classList.add('out');
    setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 400);
  }

  /* ---- views ---- */
  /* Sign in: six boxes and a number pad, big enough for gloves. A keyboard works
     too (digits, Backspace). Six digits sends it; a wrong code shakes and clears. */
  function signinView(err) {
    hideSplash(); hideToast();
    S.screen = 'signin';
    hdr.hidden = true; foot.hidden = true; setDock(null);
    view.textContent = '';
    var box = q('div', 'signin'), inn = q('div', 'in');
    box.appendChild(inn);
    inn.appendChild(ridge('mk'));
    inn.appendChild(q('h1', null, 'Sixfold'));
    inn.appendChild(q('div', 'sub', 'Door rounds'));
    inn.appendChild(q('div', 'prompt', 'Enter your six-digit code'));
    var boxes = q('div', 'boxes');
    for (var i = 0; i < 6; i++) boxes.appendChild(q('span'));
    inn.appendChild(boxes);
    var say = q('div', 'say' + (err ? ' bad' : ''), err || '');
    say.setAttribute('role', 'status'); say.setAttribute('aria-live', 'polite');
    inn.appendChild(say);
    var code = '';
    function paint() {
      [].forEach.call(boxes.children, function (b, k) {
        b.textContent = code[k] ? '•' : '';
        b.className = code[k] ? 'on' : (k === code.length ? 'next' : '');
      });
    }
    function fail(m) {
      code = ''; paint();
      boxes.className = 'boxes'; void boxes.offsetWidth; boxes.className = 'boxes err';
      say.className = 'say bad'; say.textContent = m;
    }
    function go() {
      if (S.busy) return;
      S.busy = true; boxes.className = 'boxes busy'; say.className = 'say'; say.textContent = 'Checking…';
      api('signin', { body: { code: code } }).then(function (j) {
        S.busy = false;
        if (!j.ok) return fail(j.error || 'That code was not recognised.');
        S.me = j.name; S.role = j.role; S.signin = null;
        boxes.className = 'boxes ok';
        say.textContent = 'Welcome back, ' + String(j.name || '').split(' ')[0];
        setTimeout(chooseView, reduced() ? 0 : 650);
      }).catch(function () { S.busy = false; fail('No connection. Try again when you have signal.'); });
    }
    function press(k) {
      if (S.busy || boxes.classList.contains('ok')) return;
      if (boxes.classList.contains('err')) boxes.className = 'boxes';
      if (k === 'del') code = code.slice(0, -1);
      else if (code.length < 6) code += k;
      paint();
      if (code.length === 6) go();
    }
    var keys = q('div', 'keys');
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'].forEach(function (k) {
      var b = q('button', k === '' ? 'ghost' : null); b.type = 'button';
      if (k === '') { b.disabled = true; b.setAttribute('aria-hidden', 'true'); }
      else if (k === 'del') { b.appendChild(ico('del')); b.setAttribute('aria-label', 'Delete'); }
      else { b.textContent = k; b.setAttribute('aria-label', k); }
      if (k !== '') b.addEventListener('click', function () { press(k); });
      keys.appendChild(b);
    });
    inn.appendChild(keys);
    if (!standalone()) {
      var h = q('div', 'hint'); h.appendChild(ico('mobile'));
      h.appendChild(document.createTextNode('Add this page to your Home Screen and it opens like an app'));
      inn.appendChild(h);
    }
    S.signin = press;
    view.appendChild(box);
    paint();
  }

  /* Signing in no longer lands straight on doors. There are two tools behind one
     code now, so the code opens a door onto both — and the quote side is gated on
     ROLE, never on a particular person's code. Making Brad an admin in
     api/rounds-codes.php is what gives him the quote tool; nothing here changes. */
  function tile(tag, icn, title, text, tagText, fn, href) {
    var t = q(tag, 'tile');
    if (tag === 'button') t.type = 'button';
    if (href) t.href = href;
    var ti = q('span', 'ti'); ti.appendChild(ico(icn)); t.appendChild(ti);
    var tt = q('span', 'tt');
    tt.appendChild(q('b', null, title));
    tt.appendChild(q('span', null, text));
    if (tagText) tt.appendChild(q('span', 'tag', tagText));
    t.appendChild(tt);
    if (fn) t.addEventListener('click', fn);
    return t;
  }
  function chooseView() {
    hideSplash(); hideToast();
    S.signin = null; S.screen = 'tools';
    foot.hidden = true; setDock(null);
    setBar('tools', { title: 'Sixfold', sub: 'Field tools' });
    view.textContent = '';
    var box = q('div', 'choose');
    box.appendChild(q('p', 'who', 'Signed in as ' + (S.me || 'crew') + '.'));
    box.appendChild(tile('button', 'door', 'Door rounds',
      'Walk a neighbourhood and mark every door, including the misses. Works offline and syncs when you have signal.', null, start));
    if (S.role === 'admin') {
      box.appendChild(tile('a', 'calc', 'Quote build',
        'Cost-up pricing from walk-sheet counts. Pick a job type and the sheet shows only the lines that job uses.', 'Admin only · in testing', null, 'quote.html'));
      box.appendChild(tile('button', 'clip', 'Quotes to build',
        'Every door marked Quote booked, newest first, with the number, the note, the fire hazard and a satellite link. Tick each one off when the quote goes out.', 'Admin only', quotesView));
    }
    box.appendChild(tile('button', 'chart', 'My stats',
      'How your days went: doors knocked, people talked to, quotes booked. Today next to your recent days.', null, function () { statsView(S.me, chooseView); }));
    if (S.role === 'admin') box.appendChild(tile('button', 'users', 'Team stats',
      'Everyone' + "'" + 's doors, conversations and quotes, today and over the last week and month.', 'Admin only', teamView));
    var out = q('div', 'out');
    var so = q('button', null, 'Sign out');
    so.type = 'button';
    so.addEventListener('click', function () {
      api('signout').then(function () { S.me = null; S.role = 'crew'; signinView(); });
    });
    out.appendChild(so);
    box.appendChild(out);
    view.appendChild(box);
    window.scrollTo(0, 0);
  }

  /* ⚑ A DROPDOWN, NOT CHIPS. Chips were right at three towns. At eleven they
     wrapped to four rows in a STICKY header — about 40% of a phone screen
     permanently occupied by town buttons while scrolling doors. A native select
     is one row, and on a phone it opens the OS picker, which is easier to hit
     with gloves on than a small pill. */
  function renderRegions() {
    if (!regionBar) return;
    regionBar.textContent = '';
    var sel = document.createElement('select');
    sel.id = 'region';
    sel.setAttribute('aria-label', 'Town');
    S.regions.forEach(function (r) {
      var o = document.createElement('option');
      o.value = r.key;
      var doors = r.areas.reduce(function (n, a) { return n + (a.total - a.done - (a.noanswer || 0)); }, 0);
      o.textContent = r.label + ' — ' + doors + ' to knock';
      if (r.key === S.region) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener('change', function () {
      if (S.region === sel.value) return;
      S.region = sel.value; S.area = null; renderAreas();
    });
    regionBar.appendChild(sel);
  }

  function renderAreas() {
    S.returnTo = null;                            /* the neighbourhood list is home again */
    var r = S.regions.filter(function (x) { return x.key === S.region; })[0];
    if (!r) return;
    hideSplash(); hideToast();
    S.signin = null; S.screen = 'areas';
    setBar('town'); renderRegions();
    foot.hidden = false;
    view.textContent = '';

    /* town summary (2026-10-01): visited = every door with any mark, misses included */
    var T = r.areas.reduce(function (t, a) { t.t += a.total; t.v += a.done + (a.noanswer || 0); t.b += (a.booked || 0); t.d += (a.due || 0); return t; }, { t: 0, v: 0, b: 0, d: 0 });
    var pct = T.t ? T.v / T.t : 0;
    var pg = q('div', 'prog');
    var centre = q('span'); centre.appendChild(document.createTextNode(pctText(pct))); centre.appendChild(q('small', null, 'VISITED'));
    pg.appendChild(ring(88, 9, pct, centre, false));
    var pi = q('div', 'pi');
    pi.appendChild(q('h3', null, r.label));
    pi.appendChild(q('div', 'pt', T.v.toLocaleString() + ' of ' + T.t.toLocaleString() + ' doors visited'));
    var sc = q('div', 'chips');
    if (T.b) sc.appendChild(chipEl('bk', 'check', T.b + (T.b === 1 ? ' quote' : ' quotes') + ' booked'));

    pg.appendChild(pi);
    view.appendChild(pg);
    var pend = queue().length;
    if (pend) view.appendChild(q('div', 'msg bad', pend + ' mark' + (pend === 1 ? '' : 's') + ' still waiting for signal. Keep the page open.'));

    /* doors to come back to, across EVERY town: with ~30,000 doors a no-answer is

    /* Sort: map order keeps walking routes sensible; fire hazard puts the
       neighbourhoods with the most high-hazard doors STILL TO KNOCK first. The
       choice is remembered on this phone only. */
    var hasFire = r.areas.some(function (a) { return typeof a.hot === 'number'; });
    var mode = 'map';
    try { mode = localStorage.getItem('sixfold.rounds.sort') || 'map'; } catch (e) {}
    var hasLawn = r.areas.some(function (a) { return (a.lawnL || 0) + (a.lawnM || 0) > 0; });
    if (mode === 'fire' && !hasFire) mode = 'map';
    if (mode === 'lawn' && !hasLawn) mode = 'map';
    var opts = [['map', 'Map order', 'route'], ['near', 'Nearest', 'near']];
    if (hasFire) opts.push(['fire', 'Fire', 'flame']);
    if (hasLawn) opts.push(['lawn', 'Lawn', 'leaf']);
    setDock(opts, mode, function (v) {
      try { localStorage.setItem('sixfold.rounds.sort', v); } catch (e) {}
      if (v === 'near') { S.pickTown = true; locate(function () { if (S.screen === 'areas') renderAreas(); }); }
      renderAreas();

    });

    /* ---- nearest NEIGHBOURHOOD (2026-10-02) ----
       Inside a neighbourhood the doors are all a few hundred feet apart; the useful
       question is which neighbourhood to drive to. One location fix, then sorted by
       the distance to each neighbourhood's centre. On a fresh fix it also moves to
       the closest TOWN, and says so. */
    if (mode === 'near') {
      if (!S.here && !S.locating && !S.geoErr) { S.pickTown = true; locate(function () { if (S.screen === 'areas') renderAreas(); }); }
      if (S.locating) view.appendChild(q('div', 'msg', 'Finding where you are\u2026'));
      else if (S.geoErr) view.appendChild(geoMsg());
      if (S.here && S.pickTown) {
        S.pickTown = false;
        var best = null;
        S.regions.forEach(function (rg) { rg.areas.forEach(function (a) { var m = hoodDist(a); if (m !== null && (!best || m < best.m)) best = { m: m, key: rg.key, label: rg.label }; }); });
        if (best && best.key !== S.region) { S.region = best.key; S.townNote = 'Showing ' + best.label + ', the closest town to you.'; return renderAreas(); }
      }

      if (S.here) {
        var rf = q('button', 'back'); rf.type = 'button';
        rf.appendChild(ico('refresh', 2.2)); rf.appendChild(document.createTextNode('Update my location'));
        rf.addEventListener('click', function () { S.pickTown = true; locate(function () { if (S.screen === 'areas') renderAreas(); }); renderAreas(); });

    }
    var sect = q('div', 'sect');

               ((y.lawnL || 0) + (y.lawnM || 0)) - ((x.lawnL || 0) + (x.lawnM || 0)) || (y.lawnL || 0) - (x.lawnL || 0);

    if (mode === 'fire') {

               (y.hot || 0) - (x.hot || 0) || (y.vhot || 0) - (x.vhot || 0) ||
               (y.total - y.done - (y.noanswer || 0)) - (x.total - x.done - (x.noanswer || 0));

    list.forEach(function (a) {
      var na = a.noanswer || 0;

      var mid = q('div', 'mid');

      if (a.lawnL || a.lawnM) chips.appendChild(chipEl('lawnc', 'leaf', (a.lawnL ? a.lawnL + ' large' : '') + (a.lawnL && a.lawnM ? ' · ' : '') + (a.lawnM ? a.lawnM + ' medium' : '') + ' lawns'));

      btn.appendChild(cnt);

    if (S.role === 'admin') {

  /* ---- doors to come back to (2026-10-02) ----
     Every neighbourhood, in every town, holding a no-answer or a door whose

  function followups() {

          S.dview = S.dview === 'map' ? 'street' : S.dview;

        });
        view.appendChild(btn);
      });
    });
    window.scrollTo(0, 0);
  }

  /* ---- stats (2026-10-02) ----
     A door counts once per person per day, at its last outcome that day. "Talked to"
     leaves out no-answers, so the quote rate is quotes per conversation. */
  var ZERO = { doors: 0, booked: 0, later: 0, miss: 0, nosolicit: 0, phones: 0, emails: 0, photos: 0, notes: 0 };
  function isoMinus(base, n) { var p = base.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2] - n); return isoOf(d); }

  function dayName(iso) { var p = iso.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]); return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; }
  function sumDays(rows) { var t = {}; Object.keys(ZERO).forEach(function (k) { t[k] = 0; }); rows.forEach(function (r) { Object.keys(ZERO).forEach(function (k) { t[k] += r[k] || 0; }); }); return t; }
  function statsView(name, back) {
    hideToast(); S.signin = null; S.screen = 'stats';
    foot.hidden = true; setDock(null);

    view.textContent = '';
    view.appendChild(statTabs(name, back));
    if (S.statTab === 'doors') return myDoors(name, back);
    var holder = q('div'); holder.appendChild(q('div', 'skel')); view.appendChild(holder);
    var params = { days: 30 }; if (S.role === 'admin' && name !== S.me) params.who = name;
    if (S.role === 'admin' && name === S.me) params.who = S.me;
    api('stats', { params: params }).then(function (j) {
      holder.textContent = '';
      if (j._status === 401) return signinView('Signed out. Enter your code again.');
      if (!j.ok) { holder.appendChild(q('div', 'msg bad', j.error || 'Could not load the stats.')); return; }
      var p = (j.people || []).filter(function (x) { return x.name === name; })[0] || { days: [] };
      var by = {}; p.days.forEach(function (r) { by[r.date] = r; });
      var T = by[j.today] || ZERO, talked = T.doors - T.miss;
      var card = q('div', 'stoday');
      card.appendChild(q('h3', null, 'Today'));
      var g = q('div', 'stgrid');
      [[T.doors, 'Doors knocked'], [talked, 'Talked to'], [T.booked, 'Quotes booked', 'hl'], [rate(T.booked, talked), 'Quote rate']].forEach(function (c) {
        var x = q('div', c[2] || null); x.appendChild(q('b', null, String(c[0]))); x.appendChild(q('span', null, c[1])); g.appendChild(x);
      });
      card.appendChild(g);
      /* compare with the recent working days (days with doors), not counting today */
      var prior = []; for (var i = 1; i <= 14 && prior.length < 7; i++) { var r = by[isoMinus(j.today, i)]; if (r && r.doors) prior.push(r); }
      var cmp = q('div', 'stcmp');
      if (!prior.length) cmp.textContent = T.doors ? 'Your first day on record. Tomorrow you' + "'" + 'll have something to compare with.' : 'Nothing marked today yet.';
      else {
        var avg = sumDays(prior), n = prior.length, ad = avg.doors / n, ab = avg.booked / n;
        var line = function (label, now, was) {
          var diff = now - was, el = q('span', diff >= 0 ? 'up' : 'dn', (diff >= 0 ? '▲ ' : '▼ ') + Math.abs(Math.round(diff * 10) / 10));
          var w = q('div'); w.appendChild(document.createTextNode(label + ': ' + now + ' today vs ' + (Math.round(was * 10) / 10) + ' on an average day ')); w.appendChild(el); return w;
        };
        cmp.appendChild(q('div', null, 'Compared with your last ' + n + (n === 1 ? ' working day' : ' working days') + ':'));
        cmp.appendChild(line('Doors', T.doors, ad));
        cmp.appendChild(line('Quotes', T.booked, ab));
      }
      card.appendChild(cmp);
      holder.appendChild(card);
      /* last 14 days, drawn to one scale */
      holder.appendChild(q('h2', null, 'Last 14 days'));
      var days = []; for (var k2 = 13; k2 >= 0; k2--) { var iso = isoMinus(j.today, k2); days.push({ iso: iso, r: by[iso] || ZERO }); }
      var max = Math.max(5, Math.max.apply(null, days.map(function (x) { return x.r.doors; })));
      var W = 340, H = 150, padL = 26, padB = 26, bw = (W - padL) / 14;
      var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Doors and quotes per day, last 14 days">';
      [0, max / 2, max].forEach(function (v) { var y = H - padB - (v / max) * (H - padB - 10);
        svg += '<line x1="' + padL + '" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/>' +
               '<text x="' + (padL - 5) + '" y="' + (y + 4) + '" text-anchor="end" font-size="10" fill="var(--soft)">' + Math.round(v) + '</text>'; });
      days.forEach(function (x, idx) {
        var h = (x.r.doors / max) * (H - padB - 10), hb = (x.r.booked / max) * (H - padB - 10), bx = padL + idx * bw + 3, y0 = H - padB;
        svg += '<rect x="' + bx + '" y="' + (y0 - h) + '" width="' + (bw - 6) + '" height="' + h + '" rx="2" fill="var(--sunk)" stroke="var(--line)"/>';
        if (hb) svg += '<rect x="' + bx + '" y="' + (y0 - hb) + '" width="' + (bw - 6) + '" height="' + hb + '" rx="2" fill="var(--ember-ink)"/>';
        var p2 = x.iso.split('-');
        svg += '<text x="' + (bx + (bw - 6) / 2) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" fill="var(--soft)"' + (idx === 13 ? ' font-weight="700"' : '') + '>' + (+p2[2]) + '</text>';
      });
      svg += '</svg>';
      var ch = q('div', 'stchart'); ch.innerHTML = svg;
      var key = q('div', 'key'); key.innerHTML = '<span><i style="background:var(--sunk);border:1px solid var(--line)"></i>Doors</span><span><i style="background:var(--ember-ink)"></i>Quotes booked</span>';
      ch.insertBefore(key, ch.firstChild);
      holder.appendChild(ch);
      /* day by day */
      var worked = p.days.filter(function (r) { return r.doors || r.phones || r.emails || r.photos; });
      holder.appendChild(q('h2', null, 'Day by day'));
      if (!worked.length) { holder.appendChild(q('div', 'msg', 'Nothing marked in the last 30 days yet.')); return; }
      worked.forEach(function (r) {
        var row = q('div', 'stday');
        row.appendChild(q('b', null, dayName(r.date)));
        var extra = []; if (r.phones) extra.push(r.phones + ' phone'); if (r.emails) extra.push(r.emails + ' email'); if (r.photos) extra.push(r.photos + ' photo');
        row.appendChild(q('span', null, r.doors + ' doors · ' + (r.doors - r.miss) + ' talked' + (extra.length ? ' · ' + extra.join(', ') : '')));
        row.appendChild(q('em', null, r.booked + ' booked'));
        holder.appendChild(row);
      });
    }).catch(function () { holder.textContent = ''; holder.appendChild(q('div', 'msg bad', 'No connection. Try again when you have signal.')); });
  }
  /* ---- my doors (2026-10-02) ----
     Every door this person acted on, by day or week, with the fix right there:
     change the outcome, or put a door back on the list after a slip of the thumb.
     Crew cannot change a door someone else has marked since; they open it instead. */
  var MD_RANGES = [['today', 'Today'], ['yday', 'Yesterday'], ['week', '7 days'], ['month', '30 days']];
  function statTabs(name, back) {
    var t = q('div', 'seg');
    [['nums', 'Numbers'], ['doors', 'Doors']].forEach(function (x) {
      var b = q('button', null, x[1]); b.type = 'button';
      b.setAttribute('aria-pressed', String((S.statTab || 'nums') === x[0]));
      b.addEventListener('click', function () { if ((S.statTab || 'nums') === x[0]) return; S.statTab = x[0]; statsView(name, back); });
      t.appendChild(b);
    });
    return t;
  }
  function openDoorFrom(r, name, back) {
    var go = function () {
      S.region = r.region; S.area = null; S.flash = r.id;
      S.returnTo = function () { statsView(name, back); };
      openArea(r.area);
    };
    if (S.regions.length) go();
    else api('regions').then(function (j) { if (j.ok) S.regions = j.regions; go(); }).catch(go);
  }
  function myDoors(name, back) {
    var who = name;
    var holder = q('div'); holder.appendChild(q('div', 'skel')); view.appendChild(holder);
    var params = { days: 30 }; if (S.role === 'admin') params.who = name;
    api('mydoors', { params: params }).then(function (j) {
      holder.textContent = '';
      if (j._status === 401) return signinView('Signed out. Enter your code again.');
      if (!j.ok) { holder.appendChild(q('div', 'msg bad', j.error || 'Could not load the doors.')); return; }
      var rows = j.doors || [];
      var seg = q('div', 'seg'); holder.appendChild(seg);
      var row2 = q('div', 'mdrow2');
      var dayIn = document.createElement('input'); dayIn.type = 'date'; dayIn.setAttribute('aria-label', 'Pick a day');
      dayIn.max = j.today; dayIn.min = isoMinus(j.today, 29);
      if ((S.mdRange || '').indexOf('day:') === 0) dayIn.value = S.mdRange.slice(4);
      var kind = document.createElement('select'); kind.setAttribute('aria-label', 'What was done');
      [['all', 'Everything'], ['booked', 'Quote booked'], ['later', 'Not now'], ['miss', 'No answer'], ['nosolicit', 'No soliciting'],
       ['back', 'Put back on the list'], ['info', 'Phone, email, note or photo only']].forEach(function (x) {
        var o = document.createElement('option'); o.value = x[0]; o.textContent = x[1]; kind.appendChild(o);
      });
      kind.value = S.mdKind || 'all';
      row2.appendChild(dayIn); row2.appendChild(kind); holder.appendChild(row2);
      var sum = q('div', 'sub2'); holder.appendChild(sum);
      var list = q('div'); holder.appendChild(list);
      dayIn.addEventListener('change', function () { S.mdRange = dayIn.value ? 'day:' + dayIn.value : 'today'; draw(); });
      kind.addEventListener('change', function () { S.mdKind = kind.value; draw(); });
      function dayOf(r) { return isoOf(new Date(r.at * 1000)); }
      function inRange(r) {
        var d = dayOf(r), rg = S.mdRange || 'today';
        if (rg.indexOf('day:') === 0) return d === rg.slice(4);
        if (rg === 'today') return d === j.today;
        if (rg === 'yday') return d === isoMinus(j.today, 1);
        if (rg === 'week') return d >= isoMinus(j.today, 6);
        return true;
      }
      function kindOf(r) { return r.mine ? (r.mine.outcome || 'back') : 'info'; }
      function when(r) {
        var dt = new Date(r.at * 1000), h = dt.getHours(), m = dt.getMinutes();
        var t = ((h % 12) || 12) + ':' + (m < 10 ? '0' : '') + m + (h < 12 ? ' am' : ' pm');
        return dayOf(r) === j.today ? t : dayName(dayOf(r)) + ' · ' + t;
      }
      function draw() {
        seg.textContent = '';
        MD_RANGES.forEach(function (x) {
          var b = q('button', null, x[1]); b.type = 'button';
          b.setAttribute('aria-pressed', String((S.mdRange || 'today') === x[0]));
          b.addEventListener('click', function () { S.mdRange = x[0]; dayIn.value = ''; draw(); });
          seg.appendChild(b);
        });
        var k = S.mdKind || 'all';
        var shown = rows.filter(function (r) { return inRange(r) && (k === 'all' || kindOf(r) === k); });
        var nb = shown.filter(function (r) { return r.mine && r.mine.outcome === 'booked'; }).length;
        sum.textContent = shown.length ? shown.length + (shown.length === 1 ? ' door' : ' doors') + (nb ? ' · ' + nb + ' booked' : '') +
          '. Newest first. Fix a mark here; open the door for notes, phone and photos.' : '';
        list.textContent = '';
        if (!shown.length) { list.appendChild(q('div', 'msg', rows.length ? 'Nothing here for that filter. Try 7 days or 30 days.' : 'No doors in the last 30 days yet.')); return; }
        shown.forEach(function (r) { list.appendChild(rowFor(r)); });
      }
      function setMark(r, o, rv, quiet) {
        if (o === null && !quiet && r.now && r.now.outcome === 'nosolicit' &&
            !window.confirm('Undo the no-soliciting flag? Only if the sign was a mistake — otherwise this door gets knocked again.')) return;
        var prev = r.now ? { outcome: r.now.outcome, revisit: r.now.revisit || '' } : null;
        var item = { region: r.region, id: r.id, outcome: o };
        if (o === 'later' && rv) item.revisit = rv;
        var at = Math.floor(Date.now() / 1000);
        S.mdLater = null; S.mdEdit = null;
        r.now = o === null ? null : { outcome: o, by: S.me, at: at, revisit: item.revisit || '', pending: true };
        if (who === S.me) r.mine = { outcome: o, at: at, revisit: item.revisit || '' };
        draw();
        api('mark', { body: item }).then(function (j2) {
          if (j2._status === 401) return signinView('Signed out. Enter your code again.');
          if (j2.ok) { if (r.now) r.now.pending = false; } else enqueue(item);

  /* ---- phone numbers (SX-14) ----
     Entered BY A PERSON: from the homeowner at the door, or from a manual lookup.
     Nothing here fetches from a people-search site.
     The source is kept because it decides what may be done with the number. One
     given at the door is consent. One looked up is a cold call, and must clear the
     national and Colorado Do Not Call lists before anyone dials it.
     ⚑ Phone saves are NOT in the offline queue. That queue is mark-only and
     pendingFor() matches on door id alone, so a phone item there would show as a
     phantom mark and be posted to the wrong action. A failed save instead keeps
     the form open with what was typed. */
  var SRC = { door: 'Given at the door', tps: 'Found on True People Search',
              fps: 'Found on Fast People Search', other: 'From another source' };
  var SRC_PICK = { door: 'They gave it to me at the door', tps: 'True People Search',
                   fps: 'Fast People Search', other: 'Somewhere else' };
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function digits(p) { return String(p || '').replace(/\D/g, ''); }
  function fmtPhone(p) {
    var n = digits(p);
    if (n.length === 11 && n.charAt(0) === '1') n = n.slice(1);
    return n.length === 10 ? '(' + n.slice(0, 3) + ') ' + n.slice(3, 6) + '-' + n.slice(6) : n;
  }
  function phoneStatement(ph) {
    var s = SRC[ph.source] || SRC.other;
    if (ph.source === 'door') {
      if (ph.at) { var d = new Date(ph.at * 1000); s += ' · ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
    } else if (ph.seen) {
      var m = /^(\d{4})-(\d{2})$/.exec(ph.seen);
      if (m) s += ' · last seen ' + MONTHS[+m[2] - 1] + ' ' + m[1];
    }
    return s;
  }
  function savePhone(d, data, errEl) {
    errEl.textContent = '';

    return api('phone', { body: body }).then(function (j) {
      if (j._status === 401) { signinView('Signed out. Enter your code again.'); return false; }
      if (!j.ok) { errEl.textContent = j.error || 'Could not save that.'; return false; }
      var n = digits(data.phone);
      if (n.length === 11 && n.charAt(0) === '1') n = n.slice(1);
      d.phone = n ? { phone: n, source: data.source, seen: data.source === 'door' ? '' : (data.seen || ''),
                      by: S.me, at: Math.floor(Date.now() / 1000) } : null;
