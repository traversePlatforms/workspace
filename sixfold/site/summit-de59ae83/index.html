  /* ---- satellite view (2026-10-01) ----
     The Google Earth step from Via's funnel: look at the lot from above before
     knocking or quoting — trees and brush crowding the house are the job.
     Uses the parcel centroid, not the address: rural addresses here can geocode
     to the nearest road. Zoom scales with lot size because the centroid is the
     middle of the LOT, not the house, and a 10-acre lot needs room. Format is
     Google's documented Maps URL; on a phone it opens the Maps app if installed. */
  /* ---- dates, for "come back when" (2026-10-01) ----
     All local to the phone. Spring = 1 April, fall = 1 September: the next one
     still ahead. Every chip shows its actual month, so nobody has to guess. */
  function isoOf(dt) { var m = dt.getMonth() + 1, d = dt.getDate(); return dt.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (d < 10 ? '0' : '') + d; }

  function addMonthsISO(n) {
    var t = new Date(), y = t.getFullYear(), m = t.getMonth() + n, d = t.getDate();

    return isoOf(new Date(y, m, Math.min(d, last)));
  }
  function nextISO(month, day) {
    var t = new Date(), c = new Date(t.getFullYear(), month - 1, day);

  }

  function fmtDate(s) { var p = String(s).split('-'); return (+p[2]) + ' ' + MONTHS[+p[1] - 1] + ' ' + p[0]; }
  function fmtDay(ts) { var d = new Date(ts * 1000); return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }

  /* ---- aerial view (2026-10-02) ----
     Google's links can centre a satellite map OR drop a pin, never both, and can't draw a
     property line, so the old link landed near the lot with nothing marked. This shows
     the lot itself: the 2023 USDA photo (public domain; tiles from Microsoft's Planetary
     Computer, a free PREVIEW service, so it has a fallback) fitted to the parcel boundary,
     which is read live from the Colorado statewide parcel service. Google stays one tap
     away for a newer picture, now aimed at the lot's real centre and zoom. */
  var PARCEL_API = 'https://gis.colorado.gov/public/rest/services/Address_and_Parcel/Colorado_Public_Parcels/FeatureServer/0/query';
  var PC_API = 'https://planetarycomputer.microsoft.com/api';
  function zoomFor(acres) { return acres >= 3 ? 18 : acres >= 1 ? 19 : 20; }
  function googleSat(lat, lon, zoom) {
    return 'https://www.google.com/maps/@?api=1&map_action=map&center=' + lat + '%2C' + lon + '&zoom=' + zoom + '&basemap=satellite';
  }
  function closeAerial() {
    var a = document.getElementById('aerial');
    if (a) { a.parentNode.removeChild(a); document.body.style.overflow = ''; }
  }
  window.addEventListener('popstate', function () { if (document.getElementById('aerial')) closeAerial(); });
  function aerialView(d) {
    closeAerial();
    var box = q('div', 'aerial'); box.id = 'aerial';
    var head = q('div', 'ahead');
    var x = q('button'); x.type = 'button'; x.setAttribute('aria-label', 'Close the aerial view'); x.appendChild(ico('back', 2.4));
    x.addEventListener('click', function () { if (history.state && history.state.aerial) history.back(); else closeAerial(); });
    head.appendChild(x); head.appendChild(q('b', null, d.address || 'This lot'));
    box.appendChild(head);
    var mapEl = q('div', 'amap'); box.appendChild(mapEl);
    var foot = q('div', 'afoot'), cap = q('span', null, 'Loading the photo and the property line…');
    var g = q('a'); g.href = googleSat(d.lat, d.lon, zoomFor(d.acres)); g.target = '_blank'; g.rel = 'noopener noreferrer';
    g.appendChild(ico('globe', 2.2)); g.appendChild(document.createTextNode('Google Maps'));
    foot.appendChild(cap); foot.appendChild(g); box.appendChild(foot);
    document.body.appendChild(box); document.body.style.overflow = 'hidden';
    try { history.pushState({ aerial: 1 }, ''); } catch (e) {}           /* the phone's Back closes it */
    var st = { photo: null, line: null, year: '' };
    function setCap() {
      var parts = [];
      if (st.photo === false) parts.push('Aerial photo unavailable right now, so this is the street map. Google Maps has satellite.');
      else if (st.photo) parts.push(st.year + ' aerial photo.');
      if (st.line === true) parts.push('Yellow = the property line from county records (can be off by a few feet).');
      else if (st.line === false) parts.push('The property line could not load; the orange dot is the middle of the lot.');
      if (parts.length) cap.textContent = parts.join(' ');
    }
    loadLeaflet(function () {
      if (!document.body.contains(mapEl)) return;
      if (!window.L) { cap.textContent = 'The map could not load (no signal?). Use Google Maps.'; return; }
      var map = L.map(mapEl, { zoomControl: true });
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 21, maxNativeZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);
      map.setView([d.lat, d.lon], zoomFor(d.acres));
      mapEl.addEventListener('click', function (e) {                 /* credit links open in a new tab, never over the app */
        var a = e.target && e.target.closest ? e.target.closest('.leaflet-control-attribution a') : null;
        if (a) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
      }, true);
      fetch(PC_API + '/stac/v1/search', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ collections: ['naip'], intersects: { type: 'Point', coordinates: [d.lon, d.lat] }, query: { 'naip:year': { eq: '2023' } }, limit: 4 }) })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          var f = (j.features || []).sort(function (a, b) { return a.properties.gsd - b.properties.gsd; })[0];
          if (!f) throw new Error('no photo');
          st.year = String(f.properties.datetime).slice(0, 4);
          L.tileLayer(PC_API + '/data/v1/item/tiles/WebMercatorQuad/{z}/{x}/{y}@1x?collection=naip&item=' + encodeURIComponent(f.id) +
            '&assets=image&asset_bidx=image%7C1%2C2%2C3&format=png', { maxZoom: 21, maxNativeZoom: 19, minZoom: 12,
            attribution: 'USDA NAIP ' + st.year + ' (public domain)' }).addTo(map);
          st.photo = true; setCap();
        })
        .catch(function () { st.photo = false; setCap(); });
      fetch(PARCEL_API + '?' + new URLSearchParams({ f: 'json', geometry: d.lon + ',' + d.lat, geometryType: 'esriGeometryPoint', inSR: '4326', outSR: '4326',
        spatialRel: 'esriSpatialRelIntersects', returnGeometry: 'true', outFields: 'OBJECTID', geometryPrecision: '7' }).toString())
        .then(function (r) { return r.json(); })
        .then(function (j) {
          var geo = j.features && j.features[0] && j.features[0].geometry;
          if (!geo || !geo.rings) throw new Error('no parcel');
          var ll = geo.rings.map(function (ring) { return ring.map(function (p) { return [p[1], p[0]]; }); });
          L.polygon(ll, { color: '#000', weight: 6, opacity: 0.5, fill: false, interactive: false }).addTo(map);
          var poly = L.polygon(ll, { color: '#FFE600', weight: 3, fillColor: '#FFE600', fillOpacity: 0.07, interactive: false }).addTo(map);
          map.fitBounds(poly.getBounds(), { padding: [26, 26], maxZoom: 20 });
          var c = poly.getBounds().getCenter();
          g.href = googleSat(c.lat.toFixed(6), c.lng.toFixed(6), Math.max(16, Math.min(20, map.getZoom())));
          st.line = true; setCap();
        })
        .catch(function () {
          L.circleMarker([d.lat, d.lon], { radius: 8, color: '#fff', weight: 3, fillColor: '#E4703A', fillOpacity: 1 }).addTo(map);
          st.line = false; setCap();
        });
    });
  }

  /* the door card, shared by the list and the map (2026-10-02) */

  function renderDoors() {
    S.signin = null; S.screen = 'doors';
    hideSplash();
    /* THREE states, not two. A no-answer means nobody was home — that door is not
       finished, it needs another evening. So it leaves the main list (nobody wants
       to re-knock it the same afternoon) but lands in its own section with the
       buttons still live, instead of disappearing among the booked jobs. */
    var today = todayISO();
    var todo = S.doors.filter(function (d) { return !d.mark; });
    var due = S.doors.filter(function (d) { return d.mark && d.mark.outcome === 'later' && d.mark.revisit && d.mark.revisit <= today; });
    var again = S.doors.filter(function (d) { return d.mark && d.mark.outcome === 'miss'; });
    var done = S.doors.filter(function (d) { return d.mark && d.mark.outcome !== 'miss' && due.indexOf(d) < 0; });

    /* the bar is kept, not rebuilt, while on the same neighbourhood: a mark redraws
       the page twice (at once, then when the server answers), and a rebuilt bar
       would lose the count's bump halfway through */
    var bc = document.getElementById('barCount');
    if (S.barArea === S.area && bc) {
      var cb = bc.querySelector('b');
      if (cb.textContent !== String(todo.length)) {
        cb.textContent = String(todo.length);
        bc.classList.remove('bump'); void bc.offsetWidth; bc.classList.add('bump');
      }
    } else {
      setBar('area', { title: S.area, sub: townLabel() + ' · ' + S.doors.length + (S.doors.length === 1 ? ' door' : ' doors'), count: todo.length,
        back: areaBack, backLabel: S.returnTo ? 'Back' : 'All neighbourhoods' });
      S.barArea = S.area;
    }
    doorDock();
    foot.hidden = true;
    if (S.dview === 'map' && S.liveMap && S.liveMap.area === S.area && document.body.contains(S.liveMap.el)) { S.liveMap.refresh(); return; }
    S.liveMap = null;
    view.textContent = '';

    var finished = S.doors.length > 0 && !todo.length && !again.length && !due.length;
    if (finished) {
      var fin = q('div', 'finished');
      fin.appendChild(ridge('mkf'));
      fin.appendChild(q('h3', null, S.area + ' is finished'));

      var nx = q('button', null, 'Pick another neighbourhood'); nx.type = 'button';

      fin.appendChild(nx);

    else if (!todo.length) view.appendChild(q('div', 'msg', 'First pass finished. Start with the doors due back.'));
    S.celebrate = false;

      else if (S.geoErr) view.appendChild(geoMsg());

          pending ? 'not sent yet' : (OUT[d.mark.outcome] || d.mark.outcome) +

        var u = q('button', 'undo', 'Undo');
        u.type = 'button';
        u.addEventListener('click', function () {
          if (d.mark.outcome === 'nosolicit' && !window.confirm('Undo the no-soliciting flag? Only if the sign was a mistake — otherwise this door gets knocked again.')) return;
          markDoor(d, null);
        });
        rhs.appendChild(u);
        row.appendChild(lhs); row.appendChild(rhs);
        if (S.editLawn === d.id) row.appendChild(lawnChooser(d));
        row.appendChild(extras(d));
        view.appendChild(row);
      });
    }
    if (!S.areaNosol) {
      var fl = q('button', 'nsflag'); fl.type = 'button';
      fl.appendChild(ico('flag', 2.2));
      fl.appendChild(document.createTextNode('No-soliciting sign at the entrance? Flag this neighbourhood'));
      fl.addEventListener('click', function () {
        if (!window.confirm('Flag ' + S.area + ' as no soliciting? Everyone will see a warning on it. Only an admin can clear it.')) return;
        setAreaFlag(true);
      });
      view.appendChild(fl);
    }
    flashCard();
  }
  function nosolBanner() {
    var b = q('div', 'nsban');
    var h = q('b'); h.appendChild(ico('flag', 2.4)); h.appendChild(document.createTextNode('No soliciting posted'));
    b.appendChild(h);
    b.appendChild(document.createTextNode('Flagged by ' + (S.areaNosol.by || 'crew') + ' · ' + fmtDay(S.areaNosol.at) +
      '. Read the posting before knocking — a sign at one entrance may not cover every street.'));
    if (S.role === 'admin') {
      var c = q('button', null, 'Clear the flag (admin)'); c.type = 'button';
      c.addEventListener('click', function () {
        if (!window.confirm('Clear the no-soliciting flag on ' + S.area + '? Only if the posting is gone or was never there.')) return;
        setAreaFlag(false);
      });
      b.appendChild(c);
    }
    return b;
  }
  function setAreaFlag(on) {
    api('areaflag', { body: { region: S.region, area: S.area, on: on } }).then(function (j) {
      if (!j.ok) { window.alert(j.error || 'Could not save that.'); return; }
      refresh().then(function () { openArea(S.area); });
    }).catch(function () { window.alert('No connection. Try again when you have signal.'); });
  }

  function renderReport() {
    hideToast();
    S.signin = null; S.screen = 'report';
    foot.hidden = true; setDock(null);
    setBar('back', { title: 'Who marked what', sub: 'Every town', back: renderAreas, backLabel: 'Back' });
    view.textContent = '';
    var holder = q('div'); holder.appendChild(q('div', 'skel s2')); view.appendChild(holder);
    api('report').then(function (j) {
      holder.textContent = '';
      if (!j.ok) { holder.appendChild(q('div', 'msg bad', j.error || 'Could not load that.')); return; }
      var t = document.createElement('table');
      var hr = document.createElement('tr');
      ['Person', 'Booked', 'Not now', 'No answer', 'No soliciting', 'Total'].forEach(function (h, i) {
        var th = q('th', null, h); if (i) th.style.textAlign = 'right'; hr.appendChild(th);
      });
      t.appendChild(hr);
      var any = false;
      for (var who in j.byPerson) {
        any = true;
        var p = j.byPerson[who], tr = document.createElement('tr');
        tr.appendChild(q('td', null, who));
        var ns = p.nosolicit || 0;
        [p.booked, p.later, p.miss, ns, p.booked + p.later + p.miss + ns].forEach(function (n) {
          tr.appendChild(q('td', 'n', String(n)));
        });
        t.appendChild(tr);
      }
      if (!any) { holder.appendChild(q('div', 'msg', 'Nothing marked yet.')); return; }
      var card = q('div', 'tablecard'); card.appendChild(t); holder.appendChild(card);
      if (S.role === 'admin') {
        var a = document.createElement('a');
        a.className = 'adminlink'; a.href = API + '?action=export';
        a.appendChild(ico('table')); a.appendChild(document.createTextNode('Download everything as CSV'));
        holder.appendChild(a);
      }
    }).catch(function () { holder.textContent = ''; holder.appendChild(q('div', 'msg bad', 'No connection. Try again when you have signal.')); });
  }

  function refresh() {
    return api('regions').then(function (j) {
      if (!j.ok) { if (j._status === 401) return signinView(); return; }
      S.regions = j.regions;
      if (!S.region && S.regions.length) S.region = S.regions[0].key;
      renderAreas();
    });
  }

  function start() { flush().then(refresh); }

  document.getElementById('toastUndo').addEventListener('click', function () { var f = toastUndo; hideToast(); if (f) f(); });
  document.addEventListener('keydown', function (e) {
    if (!S.signin || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); S.signin(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); S.signin('del'); }
  });

  api('me').then(function (j) {
    if (j.ok) { S.me = j.name; S.role = j.role; chooseView(); }
    else signinView();
  }).catch(function () { signinView('No connection.'); });

  window.addEventListener('online', function () { flush().then(function () { if (S.screen === 'areas') refresh(); }); });
})();
</script>
</body>
</html>
