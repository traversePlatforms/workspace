<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Door rounds — Sixfold Colorado</title>
<!--
  Sixfold Colorado — door rounds, crew page. 2026-09-29.

  Read on a phone, in a driveway, often in sun, sometimes with gloves on. So:
  big addresses, big tap targets, light ground by default, and nothing that
  needs two hands.

  ⚑ NOTHING IS EMBEDDED IN THIS FILE. Every door comes from api/rounds.php after
  sign-in, one neighbourhood at a time. The page is public; the data is not.

  ⚑ QUEUED MARKS. Signal dies past Woodland Park. A mark that cannot be sent is
  kept in localStorage and retried, and the door shows as pending rather than
  done. The page never says a mark is saved when it is not — that is the failure
  that would make the crew stop trusting it.
-->
<style>
  :root{
    color-scheme: light;
    --paper:#F4F2EC; --card:#FFFFFF; --ink:#16201B; --soft:#5A665E;
    --line:#DCD7CB; --faint:#E9E4DA;
    --accent:#2F7A4F; --on-accent:#FFFFFF;
    --booked:#2F7A4F; --later:#B5761F; --miss:#6E7A72; --bad:#A33A2A;
    /* wildfire hazard — every pairing checked >= 4.5:1, and every badge says its level
       in words, so colour is never the only signal */
    --fire-vh:#9E2A1C; --fire-h:#A8460F; --fire-m:#85600F; --fire-low:#5F6B63; --fire-on:#FFFFFF;
    --shadow:0 1px 2px rgba(20,32,27,.06), 0 6px 18px rgba(20,32,27,.05);
    --serif:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
    --sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --paper:#0E1512; --card:#18221D; --ink:#E9E4DA; --soft:#9AA79E;
      --line:#2A352E; --faint:#222C26;
      --accent:#8AA07A; --on-accent:#0E1512;
      --booked:#8AA07A; --later:#D9A05B; --miss:#8B968E; --bad:#E0715C;
      --fire-vh:#F0806A; --fire-h:#F2A35E; --fire-m:#E0B85E; --fire-low:#9AA79E; --fire-on:#0E1512;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  .wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:0 80px}

  header{position:sticky;top:0;z-index:5;background:var(--paper);
    border-bottom:1px solid var(--line);margin-inline:-16px;
    padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px}
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  h1{font-family:var(--serif);font-size:19px;margin:0;font-weight:600}
  .who{font-family:var(--mono);font-size:11px;color:var(--soft)}
  .who button{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:0 0 0 8px}
  .regions{margin-top:10px}
  .regions select{width:100%;font:600 15px var(--sans);padding:11px 12px;border-radius:9px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    -webkit-appearance:none;appearance:none;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
    background-position:calc(100% - 19px) 50%,calc(100% - 13px) 50%;
    background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:38px}
  .regions select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  h2{font-family:var(--serif);font-size:15px;margin:22px 0 8px;font-weight:600}
  .msg{margin:14px 0 0;padding:11px 13px;border-radius:9px;border:1px solid var(--line);
    background:var(--card);font-size:13.5px;line-height:1.5;color:var(--soft)}
  .msg.bad{border-color:var(--bad);color:var(--bad)}

  /* sign in */
  .signin{max-width:340px;margin:12vh auto 0;text-align:center}
  .signin h2{font-size:21px;margin-bottom:6px}
  .signin p{color:var(--soft);font-size:14px;line-height:1.55;margin:0 0 18px}
  .signin input{width:100%;font:600 27px var(--mono);letter-spacing:.22em;text-align:center;
    padding:14px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);
    color:var(--ink)}
  .choose{max-width:420px;margin:10vh auto 0}
  .choose h2{font-size:21px;margin:0 0 4px}
  .choose p.who{color:var(--soft);font-size:14px;margin:0 0 20px}
  .choose a.tile,.choose button.tile{display:block;width:100%;text-align:left;cursor:pointer;
    margin-bottom:11px;padding:16px 17px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);box-shadow:var(--shadow);font:inherit;
    text-decoration:none;-webkit-tap-highlight-color:transparent}
  .choose .tile:hover{border-color:var(--accent)}
  .choose .tile b{display:block;font-size:17px;font-weight:600;margin-bottom:3px}
  .choose .tile span{display:block;font-size:13.5px;color:var(--soft);line-height:1.45}
  .choose .tile .tag{display:inline-block;margin-top:9px;font:600 10px var(--mono);
    letter-spacing:.11em;text-transform:uppercase;color:var(--accent)}
  .choose .out{margin-top:18px;font-size:13px;color:var(--soft)}
  .signin button{width:100%;margin-top:10px;font:600 16px var(--sans);padding:14px;border-radius:10px;
    border:0;background:var(--accent);color:var(--on-accent);cursor:pointer}

  .area{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;
    gap:4px 12px;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:13px 14px;margin-bottom:8px;cursor:pointer;color:inherit;
    font:inherit;box-shadow:var(--shadow)}
  .area .nm{grid-column:1;grid-row:1;min-width:0;font-family:var(--serif);font-size:16px;
    font-weight:600;overflow-wrap:anywhere}
  .area .sub{grid-column:1;grid-row:2;font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
  .area .left{grid-column:2;grid-row:1 / span 2;font-family:var(--mono);font-size:19px;
    font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  .area .left small{display:block;font:400 10px var(--sans);letter-spacing:.08em;
    text-transform:uppercase;color:var(--soft)}
  .area[data-done="1"]{opacity:.55}
  .again{display:inline-block;margin-left:2px;padding:1px 7px;border-radius:999px;
    border:1px solid var(--miss);color:var(--miss);font-size:11px;white-space:nowrap}
  .bar{grid-column:1 / -1;grid-row:3;height:4px;border-radius:2px;background:var(--faint);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent)}

  .back{display:inline-flex;gap:6px;background:none;border:0;color:var(--accent);
    font:500 14px var(--sans);padding:8px 0;cursor:pointer}

  .door{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:13px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
  .door .addr{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.25}
  .door .meta{font-size:12.5px;color:var(--soft);margin-top:3px;font-variant-numeric:tabular-nums}
  .acts{display:flex;gap:6px;margin-top:11px}
  .acts button{flex:1;font:600 12.5px var(--sans);padding:12px 4px;border-radius:8px;
    border:1px solid var(--line);background:transparent;color:var(--soft);cursor:pointer}
  .acts button[data-k="booked"]{color:var(--booked);border-color:var(--booked)}
  .acts button[data-k="later"]{color:var(--later);border-color:var(--later)}
  .acts button:active{transform:scale(.98)}

  .done{display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:transparent;border:1px dashed var(--line);box-shadow:none}
  .done .addr{font-size:14px;font-weight:400;color:var(--soft)}
  .tag{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;
    padding:3px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
  .tag.booked{color:var(--booked)} .tag.later{color:var(--later)}
  .tag.miss{color:var(--miss)} .tag.pending{color:var(--bad)}
  .by{font-size:11px;color:var(--soft)}

  /* phone numbers (SX-14). Inputs are 16px so iOS does not zoom the page on focus. */
  .ph{margin-top:9px;font-size:13px}
  .ph a.num{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--ink);text-decoration:none}
  .ph .src{display:block;font-size:11.5px;color:var(--soft);margin-top:2px}
  .ph .dnc{display:block;font-size:11px;color:var(--later);margin-top:2px}
  .ph button.lnk{background:none;border:0;padding:6px 0 0;color:var(--accent);font:500 13px var(--sans);cursor:pointer}
  .phf{margin-top:4px;display:grid;gap:9px}
  .phf label{font-size:11.5px;color:var(--soft);display:grid;gap:4px}
  .phf input,.phf select{font:16px var(--sans);padding:11px 10px;border:1px solid var(--line);
    border-radius:8px;background:var(--card);color:var(--ink);width:100%;box-sizing:border-box}
  .phf .row{display:flex;gap:6px}
  .phf .row button{flex:1;font:600 13px var(--sans);padding:12px 4px;border-radius:8px;
    border:1px solid var(--line);background:transparent;color:var(--soft);cursor:pointer}
  .phf .row button.save{color:var(--booked);border-color:var(--booked)}
  .phf .err{font-size:12px;color:var(--bad);min-height:0}
  .phf .err:empty{display:none}
  /* on a Done row the number wraps onto its own full-width line */
  .done{flex-wrap:wrap}
  .done .ph{flex-basis:100%;margin-top:4px}
  a.sat{display:inline-block;margin-top:6px;font:500 13px var(--sans);color:var(--accent);text-decoration:none}

  /* wildfire hazard (SX-9b) */
  .fire{display:inline-block;margin-top:6px;font:600 10px var(--mono);letter-spacing:.07em;
    text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
  .fire.f5{background:var(--fire-vh);border-color:var(--fire-vh);color:var(--fire-on)}
  .fire.f4{background:var(--fire-h);border-color:var(--fire-h);color:var(--fire-on)}
  .fire.f3{color:var(--fire-m)}
  .fire.f1,.fire.f2{color:var(--fire-low)}
  .fire.fx{color:var(--fire-low);border-style:dashed}
  .done .fire{margin-top:4px;font-size:9px;padding:2px 6px}
  .hot{display:inline-block;margin-left:2px;padding:1px 7px;border-radius:999px;font-weight:600;
    background:var(--fire-h);color:var(--fire-on)}
  .hot.v{background:var(--fire-vh)}
  .sortbar{display:flex;gap:6px;margin:4px 0 12px}
  .sortbar button{flex:1;font:600 12.5px var(--sans);padding:10px 4px;border-radius:8px;
    border:1px solid var(--line);background:transparent;color:var(--soft);cursor:pointer}
  .sortbar button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* notes and come-back dates (2026-10-01) */
  .xt{margin-top:2px}
  .done .xt{flex-basis:100%}
  .adds{margin-top:6px}
  .adds .lnk{background:none;border:0;padding:4px 0;color:var(--accent);font:500 13px var(--sans);cursor:pointer}
  .adds .sep{color:var(--soft);margin:0 7px}
  .nt{margin-top:9px}
  .ntxt{font-size:13.5px;line-height:1.4;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;
    border-left:3px solid var(--accent);padding:4px 0 4px 9px}
  .nt .src{display:block;font-size:11.5px;color:var(--soft);margin-top:3px}
  .nt button.lnk{background:none;border:0;padding:6px 0 0;color:var(--accent);font:500 13px var(--sans);cursor:pointer}
  .phf textarea{font:16px var(--sans);padding:10px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--ink);width:100%;box-sizing:border-box;resize:vertical;min-height:72px}
  .phf .cnt{font-size:11px;color:var(--soft);margin-top:-4px}
  .later{margin-top:11px;border:1px solid var(--later);border-radius:9px;padding:10px}
  .later .lq{font:600 13px var(--sans);color:var(--ink);margin-bottom:8px}
  .later .chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .later .chip{text-align:left;padding:9px 10px;border-radius:8px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);cursor:pointer;font:600 13px var(--sans)}
  .later .chip .cd{display:block;font:400 11.5px var(--sans);color:var(--soft);margin-top:2px}
  .later .pick{display:flex;gap:6px;align-items:flex-end;margin-top:8px}
  .later .pick label{flex:1;font-size:11.5px;color:var(--soft);display:grid;gap:4px}
  .later .pick input{font:16px var(--sans);padding:9px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--ink);width:100%;box-sizing:border-box}
  .later .pick .chip{flex:none}
  .later .row2{display:flex;gap:6px;margin-top:8px}
  .later .row2 button{flex:1;font:600 12.5px var(--sans);padding:11px 4px;border-radius:8px;
    border:1px solid var(--line);background:transparent;color:var(--soft);cursor:pointer}
  .duep{display:inline-block;margin-left:2px;padding:1px 7px;border-radius:999px;font-weight:600;
    border:1px solid var(--booked);color:var(--booked)}
  .done a.sat{margin-top:3px;font-size:12px}
  .undo{background:none;border:0;color:var(--accent);font:500 12.5px var(--sans);cursor:pointer;padding:4px}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:7px 8px 7px 0;border-bottom:1px solid var(--faint)}
  th{font:600 10.5px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--soft)}
  td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .adminlink{display:inline-block;margin-top:10px;color:var(--accent);font-size:13.5px}

  footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);
    font-size:11.5px;line-height:1.6;color:var(--soft)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header hidden id="hdr">
    <div class="top">
      <h1>Door rounds</h1>
      <span class="who" id="who"></span>
    </div>
    <div class="regions" id="regions"></div>
  </header>
  <div id="view"></div>
  <footer id="foot" hidden>
    Lot sizes from county assessor public records. Every door listed is one where the owner
    lives at the property. Mark every door, including the misses.
  </footer>
</div>

<script>
(function () {
  var API = '../api/rounds.php';
  var OUT = { booked: 'Quote booked', later: 'Not now', miss: 'No answer' };
  var QKEY = 'sixfold.rounds.queue';

  var view = document.getElementById('view');
  var hdr = document.getElementById('hdr');
  var foot = document.getElementById('foot');
  var regionBar = document.getElementById('regions');
  var whoEl = document.getElementById('who');

  var S = { me: null, role: 'crew', regions: [], region: null, area: null, doors: [], busy: false };

  function q(n, c, t) { var e = document.createElement(n); if (c) e.className = c; if (t !== undefined) e.textContent = t; return e; }

  /* ---- offline queue ---- */
  function queue() { try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch (e) { return []; } }
  function setQueue(a) { try { localStorage.setItem(QKEY, JSON.stringify(a)); } catch (e) {} }
  function enqueue(item) { var a = queue(); a.push(item); setQueue(a); }
  function pendingFor(id) { return queue().filter(function (x) { return x.id === id; }).pop(); }

  function api(action, opts) {
    opts = opts || {};
    var url = API + '?action=' + encodeURIComponent(action);
    if (opts.params) for (var k in opts.params) url += '&' + k + '=' + encodeURIComponent(opts.params[k]);
    return fetch(url, {
      method: opts.body ? 'POST' : 'GET',
      headers: opts.body ? { 'Content-Type': 'application/json' } : {},
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      credentials: 'same-origin'
    }).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: 'Server did not answer properly.' }; })
        .then(function (j) { j._status = r.status; return j; });
    });
  }

  function flush() {
    var a = queue();
    if (!a.length) return Promise.resolve();
    var item = a[0];
    return api('mark', { body: item }).then(function (j) {
      if (!j.ok && j._status !== 500) return;          /* a rejected mark is not retried forever */
      var rest = queue().slice(1);
      setQueue(rest);
      if (rest.length) return flush();
    }).catch(function () {});
  }

  /* ---- views ---- */
  function signinView(err) {
    hdr.hidden = true; foot.hidden = true;
    view.textContent = '';
    var box = q('div', 'signin');
    box.appendChild(q('h2', null, 'Sixfold door rounds'));
    box.appendChild(q('p', null, 'Enter your six-digit code.'));
    var inp = document.createElement('input');
    inp.id = 'code'; inp.type = 'text'; inp.inputMode = 'numeric'; inp.autocomplete = 'one-time-code';
    inp.maxLength = 6; inp.placeholder = '••••••'; inp.setAttribute('aria-label', 'Six digit code');
    var btn = q('button', null, 'Sign in');
    btn.type = 'button';
    function go() {
      if (S.busy) return;
      S.busy = true; btn.textContent = 'Checking…';
      api('signin', { body: { code: inp.value } }).then(function (j) {
        S.busy = false; btn.textContent = 'Sign in';
        if (!j.ok) return signinView(j.error || 'That code was not recognised.');
        S.me = j.name; S.role = j.role; chooseView();
      }).catch(function () {
        S.busy = false; btn.textContent = 'Sign in';
        signinView('No connection. Try again when you have signal.');
      });
    }
    btn.addEventListener('click', go);
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    box.appendChild(inp); box.appendChild(btn);
    if (err) { var m = q('div', 'msg bad', err); m.style.marginTop = '16px'; box.appendChild(m); }
    view.appendChild(box);
    inp.focus();
  }

  /* Signing in no longer lands straight on doors. There are two tools behind one
     code now, so the code opens a door onto both — and the quote side is gated on
     ROLE, never on a particular person's code. Making Brad an admin in
     api/rounds-codes.php is what gives him the quote tool; nothing here changes. */
  function chooseView() {
    hdr.hidden = true; foot.hidden = true;
    view.textContent = '';
    var box = q('div', 'choose');
    box.appendChild(q('h2', null, 'Sixfold field tools'));
    box.appendChild(q('p', 'who', 'Signed in as ' + (S.me || 'crew') + '.'));

    var doors = q('button', 'tile');
    doors.type = 'button';
    doors.innerHTML = '<b>Door rounds</b><span>Walk a neighbourhood and mark every door, including the misses. Works offline and syncs when you have signal.</span>';
    doors.addEventListener('click', start);
    box.appendChild(doors);

    if (S.role === 'admin') {
      var quote = document.createElement('a');
      quote.className = 'tile';
      quote.href = 'quote.html';
      quote.innerHTML = '<b>Quote build</b><span>Cost-up pricing from walk-sheet counts. Pick a job type and the sheet shows only the lines that job uses.</span><span class="tag">Admin only &middot; in testing</span>';
      box.appendChild(quote);
    }

    var out = q('div', 'out');
    var so = q('button', null, 'Sign out');
    so.type = 'button';
    so.style.cssText = 'background:none;border:0;color:var(--soft);font:inherit;text-decoration:underline;cursor:pointer;padding:0';
    so.addEventListener('click', function () {
      api('signout').then(function () { S.me = null; S.role = 'crew'; signinView(); });
    });
    out.appendChild(so);
    box.appendChild(out);
    view.appendChild(box);
  }

  /* ⚑ A DROPDOWN, NOT CHIPS. Chips were right at three towns. At eleven they
     wrapped to four rows in a STICKY header — about 40% of a phone screen
     permanently occupied by town buttons while scrolling doors. A native select
     is one row, and on a phone it opens the OS picker, which is easier to hit
     with gloves on than a small pill. */
  function renderRegions() {
    regionBar.textContent = '';
    var sel = document.createElement('select');
    sel.id = 'region';
    sel.setAttribute('aria-label', 'Town');
    S.regions.forEach(function (r) {
      var o = document.createElement('option');
      o.value = r.key;
      var doors = r.areas.reduce(function (n, a) { return n + (a.total - a.done - (a.noanswer || 0)); }, 0);
      o.textContent = r.label + ' — ' + doors + ' to knock';
      if (r.key === S.region) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener('change', function () {
      if (S.region === sel.value) return;
      S.region = sel.value; S.area = null; renderAreas();
    });
    regionBar.appendChild(sel);
  }

  function renderAreas() {
    view.textContent = '';
    var r = S.regions.filter(function (x) { return x.key === S.region; })[0];
    if (!r) return;
    view.appendChild(q('h2', null, r.label + ' — pick a neighbourhood'));
    var pend = queue().length;
    if (pend) view.appendChild(q('div', 'msg bad', pend + ' mark' + (pend === 1 ? '' : 's') + ' still waiting for signal. Keep the page open.'));

    /* Sort: map order keeps walking routes sensible; fire hazard puts the
       neighbourhoods with the most high-hazard doors STILL TO KNOCK first. The
       choice is remembered on this phone only. */
    var hasFire = r.areas.some(function (a) { return typeof a.hot === 'number'; });
    var mode = 'map';
    try { mode = localStorage.getItem('sixfold.rounds.sort') || 'map'; } catch (e) {}
    if (!hasFire) mode = 'map';
    if (hasFire) {
      var bar0 = q('div', 'sortbar');
      [['map', 'Map order'], ['fire', 'Most fire hazard']].forEach(function (m) {
        var b = q('button', null, m[1]); b.type = 'button';
        b.setAttribute('aria-pressed', String(mode === m[0]));
        b.addEventListener('click', function () {
          try { localStorage.setItem('sixfold.rounds.sort', m[0]); } catch (e) {}
          renderAreas();
        });
        bar0.appendChild(b);
      });
      view.appendChild(bar0);
    }
    var list = r.areas.slice();
    if (mode === 'fire') {
      list.sort(function (x, y) {
        return (y.hot || 0) - (x.hot || 0) || (y.vhot || 0) - (x.vhot || 0) ||
               (y.total - y.done - (y.noanswer || 0)) - (x.total - x.done - (x.noanswer || 0));
      });
    }

    list.forEach(function (a) {
      var na = a.noanswer || 0;
      var left = a.total - a.done - na;          /* a no-answer is not finished */
      var btn = q('button', 'area');
      btn.type = 'button';
      if (left === 0 && na === 0) btn.setAttribute('data-done', '1');
      btn.appendChild(q('div', 'nm', a.name));
      var cnt = q('div', 'left', (left === 0 && na === 0) ? 'done' : String(left));
      if (!(left === 0 && na === 0)) cnt.appendChild(q('small', null, 'to knock'));
      btn.appendChild(cnt);
      var sub = a.total + (a.total === 1 ? ' door' : ' doors') + (a.avg ? ' · average lot ' + a.avg.toFixed(2) + ' acres' : '');
      var subEl = q('div', 'sub', sub);
      if (na) {
        var tag = q('span', 'again', na + ' to try again');
        subEl.appendChild(document.createTextNode(' '));
        subEl.appendChild(tag);
      }
      if (a.due) {
        var dp = q('span', 'duep', a.due + ' due back');
        subEl.appendChild(document.createTextNode(' '));
        subEl.appendChild(dp);
      }
      if (a.hot) {
        var h = q('span', 'hot' + (a.vhot ? ' v' : ''),
          a.hot + ' high fire hazard' + (a.vhot ? ' · ' + a.vhot + ' very high' : ''));
        subEl.appendChild(document.createTextNode(' '));
        subEl.appendChild(h);
      }
      btn.appendChild(subEl);
      var bar = q('div', 'bar'); var fill = q('i');
      fill.style.width = (a.total ? Math.round(a.done / a.total * 100) : 0) + '%';
      bar.appendChild(fill); btn.appendChild(bar);
      btn.addEventListener('click', function () { openArea(a.name); });
      view.appendChild(btn);
    });
    {
      var link = q('button', 'adminlink', 'See who marked what →');
      link.type = 'button';
      link.style.background = 'none'; link.style.border = '0'; link.style.cursor = 'pointer';
      link.addEventListener('click', renderReport);
      view.appendChild(link);
    }
  }

  function openArea(name) {
    view.textContent = '';
    view.appendChild(q('div', 'msg', 'Loading ' + name + '…'));
    api('area', { params: { region: S.region, area: name } }).then(function (j) {
      if (!j.ok) return renderAreas();
      S.area = j.area; S.doors = j.doors; S.avg = j.avg; S.editPhone = null; S.editNote = null; S.pickLater = null;
      renderDoors();
      window.scrollTo(0, 0);
    });
  }

  function markDoor(d, kind, revisit) {
    var item = { region: S.region, id: d.id, outcome: kind };
    if (kind === 'later' && revisit) item.revisit = revisit;      /* travels in the offline queue too */
    d.mark = kind === null ? null : { outcome: kind, by: S.me, pending: true, revisit: item.revisit || '' };
    renderDoors();
    api('mark', { body: item }).then(function (j) {
      if (j.ok) { if (d.mark) d.mark.pending = false; }
      else if (j._status === 401) { return signinView('Signed out. Enter your code again.'); }
      else { enqueue(item); }
      renderDoors();
    }).catch(function () { enqueue(item); renderDoors(); });
  }

  /* ---- phone numbers (SX-14) ----
     Entered BY A PERSON: from the homeowner at the door, or from a manual lookup.
     Nothing here fetches from a people-search site.
     The source is kept because it decides what may be done with the number. One
     given at the door is consent. One looked up is a cold call, and must clear the
     national and Colorado Do Not Call lists before anyone dials it.
     ⚑ Phone saves are NOT in the offline queue. That queue is mark-only and
     pendingFor() matches on door id alone, so a phone item there would show as a
     phantom mark and be posted to the wrong action. A failed save instead keeps
     the form open with what was typed. */
  var SRC = { door: 'Given at the door', tps: 'Found on True People Search',
              fps: 'Found on Fast People Search', other: 'From another source' };
  var SRC_PICK = { door: 'They gave it to me at the door', tps: 'True People Search',
                   fps: 'Fast People Search', other: 'Somewhere else' };
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function digits(p) { return String(p || '').replace(/\D/g, ''); }
  function fmtPhone(p) {
    var n = digits(p);
    if (n.length === 11 && n.charAt(0) === '1') n = n.slice(1);
    return n.length === 10 ? '(' + n.slice(0, 3) + ') ' + n.slice(3, 6) + '-' + n.slice(6) : n;
  }
  function phoneStatement(ph) {
    var s = SRC[ph.source] || SRC.other;
    if (ph.source === 'door') {
      if (ph.at) { var d = new Date(ph.at * 1000); s += ' · ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
    } else if (ph.seen) {
      var m = /^(\d{4})-(\d{2})$/.exec(ph.seen);
      if (m) s += ' · last seen ' + MONTHS[+m[2] - 1] + ' ' + m[1];
    }
    return s;
  }
  function savePhone(d, data, errEl) {
    errEl.textContent = '';
    var body = { region: S.region, id: d.id, phone: data.phone, source: data.source, seen: data.seen };
    return api('phone', { body: body }).then(function (j) {
      if (j._status === 401) { signinView('Signed out. Enter your code again.'); return false; }
      if (!j.ok) { errEl.textContent = j.error || 'Could not save that.'; return false; }
      var n = digits(data.phone);
      if (n.length === 11 && n.charAt(0) === '1') n = n.slice(1);
      d.phone = n ? { phone: n, source: data.source, seen: data.source === 'door' ? '' : (data.seen || ''),
                      by: S.me, at: Math.floor(Date.now() / 1000) } : null;
      S.editPhone = null;
      renderDoors();
      return true;
    }).catch(function () {
      errEl.textContent = 'Could not send — check your signal and tap Save again. What you typed is kept.';
      return false;
    });
  }
  /* ---- satellite view (2026-10-01) ----
     The Google Earth step from Via's funnel: look at the lot from above before
     knocking or quoting — trees and brush crowding the house are the job.
     Uses the parcel centroid, not the address: rural addresses here can geocode
     to the nearest road. Zoom scales with lot size because the centroid is the
     middle of the LOT, not the house, and a 10-acre lot needs room. Format is
     Google's documented Maps URL; on a phone it opens the Maps app if installed. */
  /* ---- dates, for "come back when" (2026-10-01) ----
     All local to the phone. Spring = 1 April, fall = 1 September: the next one
     still ahead. Every chip shows its actual month, so nobody has to guess. */
  function isoOf(dt) { var m = dt.getMonth() + 1, d = dt.getDate(); return dt.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (d < 10 ? '0' : '') + d; }
  function todayISO() { return isoOf(new Date()); }
  function addMonthsISO(n) {
    var t = new Date(), y = t.getFullYear(), m = t.getMonth() + n, d = t.getDate();
    var last = new Date(y, m + 1, 0).getDate();
    return isoOf(new Date(y, m, Math.min(d, last)));
  }
  function nextISO(month, day) {
    var t = new Date(), c = new Date(t.getFullYear(), month - 1, day);
    if (c <= t) c = new Date(t.getFullYear() + 1, month - 1, day);
    return isoOf(c);
  }
  function fmtMonth(s) { var p = String(s).split('-'); return MONTHS[+p[1] - 1] + ' ' + p[0]; }
  function fmtDate(s) { var p = String(s).split('-'); return (+p[2]) + ' ' + MONTHS[+p[1] - 1] + ' ' + p[0]; }
  function fmtDay(ts) { var d = new Date(ts * 1000); return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }

  /* ---- "Not now" -> "come back when" ----
     The date rides on the Not-now mark, so it uses the same offline queue. A door
     whose date arrives comes back into its own "Due to revisit" section. */
  function laterChooser(d) {
    var box = q('div', 'later');
    box.appendChild(q('div', 'lq', 'When should we come back?'));
    var chips = q('div', 'chips');
    [['In a month', addMonthsISO(1)], ['In 3 months', addMonthsISO(3)],
     ['Spring', nextISO(4, 1)], ['Fall', nextISO(9, 1)]].forEach(function (o) {
      var b = q('button', 'chip'); b.type = 'button';
      b.appendChild(q('span', null, o[0]));
      b.appendChild(q('span', 'cd', fmtMonth(o[1])));
      b.addEventListener('click', function () { S.pickLater = null; markDoor(d, 'later', o[1]); });
      chips.appendChild(b);
    });
    box.appendChild(chips);
    var pick = q('div', 'pick');
    var lab = q('label', null, 'Or pick a date');
    var di = q('input'); di.type = 'date'; di.min = todayISO();
    lab.appendChild(di); pick.appendChild(lab);
    var go = q('button', 'chip', 'Save'); go.type = 'button';
    go.addEventListener('click', function () {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(di.value)) { di.focus(); return; }
      S.pickLater = null; markDoor(d, 'later', di.value);
    });
    pick.appendChild(go);
    box.appendChild(pick);
    var row = q('div', 'row2');
    var nd = q('button', null, 'Not now — no date'); nd.type = 'button';
    nd.addEventListener('click', function () { S.pickLater = null; markDoor(d, 'later', null); });
    var cx = q('button', null, 'Cancel'); cx.type = 'button';
    cx.addEventListener('click', function () { S.pickLater = null; renderDoors(); });
    row.appendChild(nd); row.appendChild(cx);
    box.appendChild(row);
    return box;
  }

  /* ---- notes ---- */
  function saveNote(d, text, errEl) {
    errEl.textContent = '';
    return api('note', { body: { region: S.region, id: d.id, note: text } }).then(function (j) {
      if (j._status === 401) { signinView('Signed out. Enter your code again.'); return false; }
      if (!j.ok) { errEl.textContent = j.error || 'Could not save that.'; return false; }
      var t = String(text || '').trim();
      d.note = t ? { note: t, by: S.me, at: Math.floor(Date.now() / 1000) } : null;
      S.editNote = null; renderDoors(); return true;
    }).catch(function () {
      errEl.textContent = 'Could not send — check your signal and tap Save again. What you typed is kept.';
      return false;
    });
  }
  function noteBlock(d) {
    var box = q('div', 'nt');
    if (S.editNote === d.id) {
      var f = q('div', 'phf');
      var lb = q('label', null, 'Note for this door');
      var ta = q('textarea'); ta.maxLength = 500; ta.rows = 3;
      ta.placeholder = 'Dog in the yard · back after 5 · wants aeration in spring';
      ta.value = d.note ? d.note.note : '';
      lb.appendChild(ta); f.appendChild(lb);
      var cnt = q('div', 'cnt');
      function upd() { cnt.textContent = (500 - ta.value.length) + ' characters left'; }
      ta.addEventListener('input', upd); upd(); f.appendChild(cnt);
      var err = q('div', 'err'); f.appendChild(err);
      var row = q('div', 'row');
      var sv = q('button', 'save', 'Save'); sv.type = 'button';
      sv.addEventListener('click', function () {
        if (!ta.value.trim()) { err.textContent = 'Type a note first, or tap Remove.'; return; }
        sv.disabled = true;
        saveNote(d, ta.value, err).then(function () { sv.disabled = false; });
      });
      row.appendChild(sv);
      if (d.note) {
        var rm = q('button', null, 'Remove'); rm.type = 'button';
        rm.addEventListener('click', function () { saveNote(d, '', err); });
        row.appendChild(rm);
      }
      var cx = q('button', null, 'Cancel'); cx.type = 'button';
      cx.addEventListener('click', function () { S.editNote = null; renderDoors(); });
      row.appendChild(cx);
      f.appendChild(row); box.appendChild(f);
      setTimeout(function () { try { ta.focus(); } catch (e) {} }, 0);
      return box;
    }
    box.appendChild(q('div', 'ntxt', d.note.note));
    box.appendChild(q('span', 'src', 'Note' + (d.note.by ? ' · ' + d.note.by : '') + (d.note.at ? ' · ' + fmtDay(d.note.at) : '')));
    var ed = q('button', 'lnk', 'Edit note'); ed.type = 'button';
    ed.addEventListener('click', function () { S.editNote = d.id; S.editPhone = null; renderDoors(); });
    box.appendChild(ed);
    return box;
  }
  /* phone + note + the add links for whichever is missing, on one line when both
     are empty — which is most doors — so an untouched card stays short. */
  function extras(d) {
    var wrap = q('div', 'xt');
    if (S.editPhone === d.id || d.phone) wrap.appendChild(phoneBlock(d));
    if (S.editNote === d.id || d.note) wrap.appendChild(noteBlock(d));
    if (S.editPhone === d.id || S.editNote === d.id) return wrap;       /* one form at a time */
    var adds = [];
    if (!d.phone) adds.push(['+ Add a phone number', function () { S.editPhone = d.id; S.editNote = null; renderDoors(); }]);
    if (!d.note) adds.push(['+ Add a note', function () { S.editNote = d.id; S.editPhone = null; renderDoors(); }]);
    if (adds.length) {
      var row = q('div', 'adds');
      adds.forEach(function (b, i) {
        if (i) row.appendChild(q('span', 'sep', '·'));
        var x = q('button', 'lnk', b[0]); x.type = 'button';
        x.addEventListener('click', b[1]); row.appendChild(x);
      });
      wrap.appendChild(row);
    }
    return wrap;
  }

  /* ---- wildfire hazard badge (SX-9b) ----
     USFS Wildfire Hazard Potential 2023, sampled at the parcel centroid. 270 m cells,
     so it rates the NEIGHBOURHOOD — the satellite link is the per-house check.
     ⚑ Class 6/7 is shown as "not rated", NEVER as low: 6 means the cell is mapped
     as town or farmland, and a wooded lot can sit inside one. */
  var FIRE = { 5: 'Very high fire hazard', 4: 'High fire hazard', 3: 'Moderate fire hazard',
               2: 'Low fire hazard', 1: 'Very low fire hazard' };
  function fireBadge(d) {
    var f = d.fire;
    if (f === null || f === undefined) return null;          /* no data yet: say nothing */
    if (FIRE[f]) return q('span', 'fire f' + f, FIRE[f]);
    return q('span', 'fire fx', 'Fire map: not rated');       /* 6 town/farm, 7 water */
  }

  function satLink(d, small) {
    if (typeof d.lat !== 'number' || typeof d.lon !== 'number') return null;
    var zoom = d.acres >= 3 ? 18 : d.acres >= 1 ? 19 : 20;
    var a = q('a', 'sat', small ? 'Satellite ↗' : 'Satellite view ↗');
    a.href = 'https://www.google.com/maps/@?api=1&map_action=map&center=' +
      d.lat + '%2C' + d.lon + '&zoom=' + zoom + '&basemap=satellite';
    a.target = '_blank'; a.rel = 'noopener noreferrer';
    return a;
  }

  function phoneBlock(d) {
    var box = q('div', 'ph');
    if (S.editPhone === d.id) {
      var f = q('div', 'phf');
      var li = q('label', null, 'Phone number');
      var inp = q('input');
      inp.type = 'tel'; inp.inputMode = 'tel'; inp.autocomplete = 'off'; inp.placeholder = '(719) 555-0123';
      inp.value = d.phone ? fmtPhone(d.phone.phone) : '';
      li.appendChild(inp); f.appendChild(li);
      var ls = q('label', null, 'Where it came from');
      var sel = q('select');
      ['door', 'tps', 'fps', 'other'].forEach(function (k) {
        var o = q('option', null, SRC_PICK[k]); o.value = k; sel.appendChild(o);
      });
      sel.value = d.phone ? d.phone.source : 'door';
      ls.appendChild(sel); f.appendChild(ls);
      var lm = q('label', null, 'Last seen on the site');
      var mon = q('input');
      mon.type = 'month'; mon.value = d.phone && d.phone.seen ? d.phone.seen : '';
      lm.appendChild(mon); f.appendChild(lm);
      function sync() { lm.style.display = sel.value === 'door' ? 'none' : ''; }
      sel.addEventListener('change', sync); sync();
      var err = q('div', 'err'); f.appendChild(err);
      var row = q('div', 'row');
      var sv = q('button', 'save', 'Save'); sv.type = 'button';
      sv.addEventListener('click', function () {
        if (!inp.value.trim()) { err.textContent = 'Type a number first, or tap Remove.'; return; }
        sv.disabled = true;
        savePhone(d, { phone: inp.value, source: sel.value, seen: sel.value === 'door' ? '' : mon.value }, err)
          .then(function () { sv.disabled = false; });
      });
      row.appendChild(sv);
      if (d.phone) {
        var rm = q('button', null, 'Remove'); rm.type = 'button';
        rm.addEventListener('click', function () { savePhone(d, { phone: '', source: 'door', seen: '' }, err); });
        row.appendChild(rm);
      }
      var cx = q('button', null, 'Cancel'); cx.type = 'button';
      cx.addEventListener('click', function () { S.editPhone = null; renderDoors(); });
      row.appendChild(cx);
      f.appendChild(row);
      box.appendChild(f);
      setTimeout(function () { try { inp.focus(); } catch (e) {} }, 0);
      return box;
    }
    if (d.phone) {
      var a = q('a', 'num', fmtPhone(d.phone.phone));
      a.href = 'tel:' + digits(d.phone.phone);
      box.appendChild(a);
      box.appendChild(q('span', 'src', phoneStatement(d.phone)));
      if (d.phone.source !== 'door') box.appendChild(q('span', 'dnc', 'Looked up, not given — check the Do Not Call lists before calling.'));
      var ed = q('button', 'lnk', 'Edit number'); ed.type = 'button';
      ed.addEventListener('click', function () { S.editPhone = d.id; S.editNote = null; renderDoors(); });
      box.appendChild(ed);
    } else {
      var ad = q('button', 'lnk', '+ Add a phone number'); ad.type = 'button';
      ad.addEventListener('click', function () { S.editPhone = d.id; renderDoors(); });
      box.appendChild(ad);
    }
    return box;
  }

  function renderDoors() {
    view.textContent = '';
    var back = q('button', 'back', '← All neighbourhoods');
    back.type = 'button';
    back.addEventListener('click', function () { S.area = null; refresh(); });
    view.appendChild(back);

    /* THREE states, not two. A no-answer means nobody was home — that door is not
       finished, it needs another evening. So it leaves the main list (nobody wants
       to re-knock it the same afternoon) but lands in its own section with the
       buttons still live, instead of disappearing among the booked jobs. */
    var today = todayISO();
    var todo = S.doors.filter(function (d) { return !d.mark; });
    var due = S.doors.filter(function (d) { return d.mark && d.mark.outcome === 'later' && d.mark.revisit && d.mark.revisit <= today; });
    var again = S.doors.filter(function (d) { return d.mark && d.mark.outcome === 'miss'; });
    var done = S.doors.filter(function (d) { return d.mark && d.mark.outcome !== 'miss' && due.indexOf(d) < 0; });

    view.appendChild(q('h2', null, S.area + ' — ' + todo.length + ' to knock'));
    if (!todo.length && !again.length && !due.length) view.appendChild(q('div', 'msg', 'Every door here is done. Pick another neighbourhood.'));
    else if (!todo.length && !due.length) view.appendChild(q('div', 'msg', 'First pass finished. The doors below had no answer — try them another evening.'));
    else if (!todo.length) view.appendChild(q('div', 'msg', 'First pass finished. Start with the doors due back.'));

    function doorCard(d) {
      var card = q('div', 'door');
      card.appendChild(q('div', 'addr', d.address));
      var fb = fireBadge(d); if (fb) card.appendChild(fb);
      card.appendChild(q('div', 'meta', d.acres.toFixed(2) + ' acres · ' + d.owner));
      var sat = satLink(d); if (sat) card.appendChild(sat);
      if (d.mark && d.mark.outcome === 'miss') {
        var was = q('div', 'meta', 'No answer' + (d.mark.by ? ' · ' + d.mark.by : ''));
        was.style.color = 'var(--miss)';
        card.appendChild(was);
      }
      if (d.mark && d.mark.outcome === 'later' && d.mark.revisit) {
        var isDue = d.mark.revisit <= todayISO();
        var rv = q('div', 'meta', 'Not now · asked us back ' + fmtDate(d.mark.revisit) + (isDue ? ' — due' : '') + (d.mark.by ? ' · ' + d.mark.by : ''));
        rv.style.color = isDue ? 'var(--booked)' : 'var(--later)';
        card.appendChild(rv);
      }
      card.appendChild(extras(d));
      if (S.pickLater === d.id) { card.appendChild(laterChooser(d)); return card; }
      var acts = q('div', 'acts');
      ['booked', 'later', 'miss'].forEach(function (k) {
        var b = q('button', null, OUT[k]);
        b.type = 'button'; b.setAttribute('data-k', k);
        b.addEventListener('click', function () {
          if (k === 'later') { S.pickLater = d.id; S.editPhone = null; S.editNote = null; renderDoors(); return; }
          markDoor(d, k);
        });
        acts.appendChild(b);
      });
      card.appendChild(acts);
      return card;
    }

    todo.forEach(function (d) { view.appendChild(doorCard(d)); });

    if (due.length) {
      view.appendChild(q('h2', null, 'Due to revisit · ' + due.length));
      due.forEach(function (d) { view.appendChild(doorCard(d)); });
    }

    if (again.length) {
      view.appendChild(q('h2', null, 'No answer — try again · ' + again.length));
      var toggle = q('button', 'back', (S.showAgain ? '↓ Hide' : '→ Show') + ' these ' + again.length + ' doors');
      toggle.type = 'button';
      toggle.addEventListener('click', function () { S.showAgain = !S.showAgain; renderDoors(); });
      view.appendChild(toggle);
      if (S.showAgain) again.forEach(function (d) { view.appendChild(doorCard(d)); });
    }

    if (done.length) {
      view.appendChild(q('h2', null, 'Done · ' + done.length));
      done.forEach(function (d) {
        var row = q('div', 'door done');
        var lhs = q('div');
        lhs.appendChild(q('div', 'addr', d.address));
        var fb2 = fireBadge(d); if (fb2) lhs.appendChild(fb2);
        if (d.mark.by) lhs.appendChild(q('div', 'by', d.mark.by));
        var sat2 = satLink(d, true); if (sat2) lhs.appendChild(sat2);   /* look before the quote visit */
        var rhs = q('div');
        rhs.style.display = 'flex'; rhs.style.alignItems = 'center'; rhs.style.gap = '8px';
        var pending = d.mark.pending || pendingFor(d.id);
        rhs.appendChild(q('span', 'tag ' + (pending ? 'pending' : d.mark.outcome),
          pending ? 'not sent yet' : (OUT[d.mark.outcome] || d.mark.outcome) +
            (d.mark.outcome === 'later' && d.mark.revisit ? ' · back ' + fmtMonth(d.mark.revisit) : '')));
        var u = q('button', 'undo', 'Undo');
        u.type = 'button';
        u.addEventListener('click', function () { markDoor(d, null); });
        rhs.appendChild(u);
        row.appendChild(lhs); row.appendChild(rhs);
        row.appendChild(extras(d));
        view.appendChild(row);
      });
    }
  }

  function renderReport() {
    view.textContent = '';
    var back = q('button', 'back', '← Back');
    back.type = 'button';
    back.addEventListener('click', renderAreas);
    view.appendChild(back);
    view.appendChild(q('h2', null, 'Who marked what'));
    api('report').then(function (j) {
      if (!j.ok) { view.appendChild(q('div', 'msg bad', j.error || 'Could not load that.')); return; }
      var t = document.createElement('table');
      var hr = document.createElement('tr');
      ['Person', 'Booked', 'Not now', 'No answer', 'Total'].forEach(function (h, i) {
        var th = q('th', null, h); if (i) th.style.textAlign = 'right'; hr.appendChild(th);
      });
      t.appendChild(hr);
      var any = false;
      for (var who in j.byPerson) {
        any = true;
        var p = j.byPerson[who], tr = document.createElement('tr');
        tr.appendChild(q('td', null, who));
        [p.booked, p.later, p.miss, p.booked + p.later + p.miss].forEach(function (n) {
          tr.appendChild(q('td', 'n', String(n)));
        });
        t.appendChild(tr);
      }
      if (!any) { view.appendChild(q('div', 'msg', 'Nothing marked yet.')); return; }
      view.appendChild(t);
      if (S.role === 'admin') {
        var a = document.createElement('a');
        a.className = 'adminlink'; a.href = API + '?action=export'; a.textContent = 'Download everything as CSV';
        view.appendChild(a);
      }
    });
  }

  function refresh() {
    return api('regions').then(function (j) {
      if (!j.ok) { if (j._status === 401) return signinView(); return; }
      S.regions = j.regions;
      if (!S.region && S.regions.length) S.region = S.regions[0].key;
      hdr.hidden = false; foot.hidden = false;
      whoEl.textContent = S.me || '';
      var so = q('button', null, 'Sign out');
      so.type = 'button';
      so.addEventListener('click', function () { api('signout').then(function () { S.me = null; signinView(); }); });
      whoEl.appendChild(so);
      renderRegions();
      renderAreas();
    });
  }

  function start() { flush().then(refresh); }
  /* the header is built by refresh(); hang a way back off it rather than
     rebuilding the header markup */
  function backTile() {
    if (document.getElementById('toTools')) return;
    var b = document.createElement('button');
    b.id = 'toTools'; b.type = 'button'; b.textContent = 'Tools';
    b.style.cssText = 'background:none;border:1px solid var(--line);border-radius:8px;color:var(--soft);' +
      'font:600 12px var(--sans);padding:5px 10px;cursor:pointer;margin-left:auto';
    b.addEventListener('click', chooseView);
    if (whoEl && whoEl.parentNode) whoEl.parentNode.appendChild(b);
  }

  api('me').then(function (j) {
    if (j.ok) { S.me = j.name; S.role = j.role; chooseView(); }
    else signinView();
  }).catch(function () { signinView('No connection.'); });

  window.addEventListener('online', function () { flush().then(function () { if (!S.area) refresh(); }); });
})();
</script>
</body>
</html>
