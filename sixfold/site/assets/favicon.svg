<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Sixfold Colorado">
  <!-- Favicon reduction of the Ridge mark. NOT a transplant of the full mark:
       at 16px the small pine and the four overlapping peak slivers turn to mush,
       so this is two peaks and the ground bar — the mark's idea, redrawn to fill
       the tile. Recession is carried by tint, not by a gap: the rear peak is the
       same ember at 55%, which is how the wordmark lockup does it (.l1/.l2/.l3
       at 50/66/82% in site.css). A hairline gap would close up at 16px.
       Bone plate so it does not vanish on a dark browser theme. -->
  <rect width="100" height="100" rx="18" fill="#EDE7DC"/>
  <path fill="#E4703A" fill-opacity="0.55" d="M6 84L36 22L66 84Z"/>
  <path fill="#E4703A" d="M34 84L64 10L94 84Z"/>
  <path fill="#8AA07A" d="M8 84L92 84L92 90L8 90Z"/>
</svg>
