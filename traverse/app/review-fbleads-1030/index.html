<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facebook leads review</title>
<style>
  :root { --bg: #f6f5f1; --ink: #1d1d1b; --soft: #66645e; --line: #dcd9d0; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161614; --ink: #ecebe6; --soft: #a3a199; --line: #34332f; --card: #1f1f1c; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; } p { color: var(--soft); margin: 0 0 18px; }
  figure { margin: 0 0 28px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  figcaption { font-weight: 600; margin-bottom: 8px; } figcaption small { display: block; font-weight: 400; color: var(--soft); }
  img { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; display: block; }
  .phone img { max-width: 390px; }
</style>
</head>
<body>
<main>
<h1>Setup › Facebook leads (editions and client installs)</h1>
<p>30 Oct 2026. Taken by fbleads-test.mjs on the harness (a TraverseRoofing-like edition) against a local stand-in for Facebook. Made-up Pages and people.</p>
<figure><figcaption>1. Not connected (computer)<small>Before Traverse's Meta app is on the server, Connect Facebook says "Not available yet".</small></figcaption><img src="01-not-connected-desktop.png" alt="Facebook leads screen, not connected"></figure>
<figure><figcaption>2. Back from Facebook: connected, two Pages found (computer)<small>Both Pages start unticked; the second is flagged because the person's role on it has no leads task.</small></figcaption><img src="02-connected-desktop.png" alt="Connected with two Pages"></figure>
<figure><figcaption>3. A Page ticked, its forms and questions shown, Take turns between two people, alerts on (computer)<small>Each question picks Name, Phone, Email, Address, Notes or Leave out; a sensible match is filled in.</small></figcaption><img src="03-forms-and-turns-desktop.png" alt="Forms and question matching"></figure>
<figure class="phone"><figcaption>4. Needs reconnecting (phone)<small>Facebook stopped accepting the token: the admins were told once, the screen offers Connect Facebook again.</small></figcaption><img src="04-needs-reconnect-phone.png" alt="Needs reconnecting on a phone"></figure>
<figure><figcaption>5. Traverse's own view (computer)<small>The super admin also sees "Connect with a token (Traverse only)": what works before Meta's App Review.</small></figcaption><img src="05-super-token-desktop.png" alt="Super admin token box"></figure>
<figure class="phone"><figcaption>6. Connected (phone)</figcaption><img src="06-connected-phone.png" alt="Connected on a phone"></figure>
<figure class="phone"><figcaption>7. The forms and question matching (phone)</figcaption><img src="07-forms-phone.png" alt="Forms on a phone"></figure>
<figure><figcaption>8. The Setup checklist lists Facebook lead ads (computer)</figcaption><img src="08-setup-list-desktop.png" alt="Setup list"></figure>
</main>
