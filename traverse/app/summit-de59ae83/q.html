<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Your quote</title>
<style>
  /* a company's quote page (2026-10-27, TR-33): the lines and price from the app's quote builder, the day if one was offered, and a Yes button
     (a365quote / a365accept, the same actions as Sixfold's 365 page), in the company's own name and colour. */
  :root{--brand:#13294b;--ink:#15202d;--soft:#566476;--line:#dce2ea;--card:#fff;--bg:#f4f6f9;--ok:#e9f5ee;--okline:#bfe0cc;--bad:#b42318}
  @media (prefers-color-scheme:dark){:root{--ink:#e8eef6;--soft:#a6b3c3;--line:#33415a;--card:#172131;--bg:#0e1520;--ok:#13291d;--okline:#2c5a3e;--bad:#ff8a80}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px}
  header{background:var(--brand);color:#fff}
  header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}
  header b{font-size:20px} header a{color:#fff;font-weight:700;text-decoration:none;white-space:nowrap}
  /* the company's own logo, tagline and contact lines (2026-10-29, Matthew: branding is a selling point); .bg = on a white backing for a dark logo */
  header .co{display:flex;align-items:center;gap:12px;min-width:0;padding:10px 0}
  header .co img{display:block;height:40px;width:auto;max-width:min(170px,42vw);object-fit:contain;flex:none}
  header .co img.bg{box-sizing:border-box;height:46px;padding:4px 8px;border-radius:9px;background:#fff}
  header .nm{display:grid;min-width:0;line-height:1.2}header .nm b{overflow-wrap:anywhere}header .nm small{font-size:13px;opacity:.88}
  footer .fco{display:block;color:var(--ink);font-weight:700;margin-bottom:2px}
  footer a{color:inherit}
  @media (max-width:420px){header b{font-size:17px}header .nm small{display:none}}
  .band{padding:24px 0 6px}.band h1{font-size:clamp(26px,6vw,36px);line-height:1.15;margin:0 0 4px}.band p{margin:0;color:var(--soft)}
  main .wrap{display:grid;gap:16px;padding-top:14px;padding-bottom:40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
  .card h2{font-size:20px;margin:0 0 12px}
  table{width:100%;border-collapse:collapse;font-size:16px} td{padding:8px 0;border-bottom:1px solid var(--line)} td.r{text-align:right;font-weight:700;white-space:nowrap;padding-left:12px}
  .total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px}.total b{font-size:30px}
  .muted{color:var(--soft);font-size:14px;margin:0}.big{font-size:20px;font-weight:700;margin:0 0 6px}
  textarea{width:100%;font:16px system-ui,sans-serif;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
  .h{font-weight:700;font-size:15px;margin:12px 0 6px}
  .btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;margin-top:14px;border:0;border-radius:999px;background:var(--brand);color:#fff;font:700 17px system-ui,sans-serif;cursor:pointer;text-decoration:none}
  .btn:disabled{opacity:.55;cursor:default}
  .btn:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
  .err{color:var(--bad);font-weight:700;font-size:14px;margin-top:10px;min-height:1px}
  .ok{background:var(--ok);border-color:var(--okline)}
  .skel{height:200px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
  footer{padding:20px 0 36px;color:var(--soft);font-size:14px}
  /* other ways to pay (2026-10-29): Venmo, Cash App, PayPal, Zelle, the company's own link */
  .btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
  .zqr{display:block;width:160px;max-width:60%;height:auto;margin:-2px 0 4px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .ways{display:grid;gap:10px;margin-top:12px}.way{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px}
  .way span{display:grid;gap:2px;min-width:0;overflow-wrap:anywhere}.way b{font-size:17px}.way .btn{width:auto;min-height:42px;margin:0;padding:0 18px;font-size:15px}
  /* Good / Better / Best (2026-10-30): one card per option, the picked one outlined */
  .opts{display:grid;gap:10px}.opt{display:grid;gap:6px;width:100%;text-align:left;padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
  .opt[aria-pressed=true]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}.opt:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
  .opth{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.opth b{font-size:19px}.opth strong{font-size:22px}.opt table{font-size:15px}
  @media (prefers-color-scheme:dark){.opt[aria-pressed=true]{border-color:#9db4d8;box-shadow:inset 0 0 0 1px #9db4d8}}
</style>
</head>
<body>
<header><div class="wrap"><span class="co"><img id="logo" alt="" hidden><span class="nm"><b id="co">Your quote</b><small id="tag" hidden></small></span></span><a id="call" href="#" hidden></a></div></header>
<div class="band"><div class="wrap"><h1 id="hi">Your quote</h1><p id="for"></p></div></div>
<main><div class="wrap" id="main"><div class="skel"></div></div></main>
<footer><div class="wrap" id="foot"></div></footer>
<script>
(function () {
  var API = '../api/rounds.php';
  var key = (/[?&]q=([A-Za-z0-9-]+)/.exec(location.search) || [])[1] || '';
  var main = document.getElementById('main'), B = { name: '', phone: '' };
  function el(n, c, t) { var e = document.createElement(n); if (c) e.className = c; if (t != null) e.textContent = t; return e; }
  function money(n) { return (n < 0 ? '−$' : '$') + Math.abs(Number(n)).toLocaleString('en-US'); }
  function tel(p) { return 'tel:' + String(p || '').replace(/[^\d+]/g, ''); }
  function callLine() { return B.phone ? 'Call or text ' + B.phone + '.' : 'Reply to the message this link came in.'; }
  function sorry(msg) { main.textContent = ''; var c = el('div', 'card'); c.appendChild(el('h2', null, 'We could not open this quote')); c.appendChild(el('p', 'muted', msg)); if (B.phone) { var a = el('a', 'btn', 'Call or text ' + B.phone); a.href = tel(B.phone); c.appendChild(a); } main.appendChild(c); }
  function brand(j) {
    B = j || B; if (!B.name) return;
    document.title = 'Your quote · ' + B.name; document.getElementById('co').textContent = B.name;
    if (/^#[0-9a-f]{6}$/i.test(B.color || '')) document.documentElement.style.setProperty('--brand', B.color);
    var c = document.getElementById('call'); if (B.phone) { c.hidden = false; c.textContent = B.phone; c.href = tel(B.phone); }
    brandMore(B, document.getElementById('foot'));
  }
  /* the company's logo (uploaded on its Company screen), tagline and a footer with its phone, email and website (2026-10-29) */
  function brandMore(B, f) {
    var lg = B.logo && /^\.\.\/api\/[a-z0-9-]+\.php\?action=logo&v=[0-9a-f]{12}$/.test(String(B.logo.url || '')) ? B.logo : null;
    if (lg) {
      var im = document.getElementById('logo'); im.src = lg.url; im.alt = B.name; im.hidden = false; if (lg.bg) im.className = 'bg';
      var ic = document.createElement('link'); ic.rel = 'icon'; ic.href = lg.url; document.head.appendChild(ic);
    }
    if (B.tagline) { var tg = document.getElementById('tag'); tg.textContent = B.tagline; tg.hidden = false; }
    f.textContent = ''; f.appendChild(el('span', 'fco', B.name));
    var bits = [];
    if (B.phone) { var a = el('a', null, B.phone); a.href = tel(B.phone); bits.push(a); }
    if (B.email) { var m = el('a', null, B.email); m.href = 'mailto:' + B.email; bits.push(m); }
    if (B.site) { var w = el('a', null, String(B.site).replace(/^https?:\/\//i, '')); w.href = /^https?:\/\//i.test(B.site) ? B.site : 'https://' + B.site; w.target = '_blank'; w.rel = 'noopener'; bits.push(w); }
    bits.forEach(function (x, i) { if (i) f.appendChild(document.createTextNode(' · ')); f.appendChild(x); });
  }
  fetch(API + '?action=kitbrand', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) { if (j && j.ok) brand(j); load(); }).catch(load);
  function load() {
    if (!/^[wm]\d{14}[0-9a-f]{6}-[0-9a-f]{16}$/.test(key)) { sorry('This link looks incomplete. Ask us to send it again.'); return; }
    fetch(API + '?action=a365quote&q=' + encodeURIComponent(key), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (Q) {
      if (!Q || !Q.ok) { sorry((Q && Q.error) || 'Something went wrong. ' + callLine()); return; }
      document.getElementById('hi').textContent = Q.first ? 'Hi ' + Q.first + ', here’s your quote' : 'Your quote';
      document.getElementById('for').textContent = Q.street ? 'For ' + Q.street : (B.name ? 'From ' + B.name : '');
      main.textContent = '';
      if (Q.options && Q.options.list && Q.options.list.length > 1 && !Q.booked && !Q.accepted) {   /* Good / Better / Best (2026-10-30): they pick one, and the yes is for that one */
        main.appendChild(options(Q));
        main.appendChild(book(Q));
        if (Q.ways && Q.ways.length) main.appendChild(ways(Q.ways));
        return;
      }
      var q = el('div', 'card'); q.appendChild(el('h2', null, 'What’s included'));
      if (Q.items && Q.items.length) { var t = el('table'); Q.items.forEach(function (x) { var tr = el('tr'); tr.appendChild(el('td', null, x.t)); tr.appendChild(el('td', 'r', money(x.amt))); t.appendChild(tr); }); q.appendChild(t); }
      var pr = el('div', 'total'); pr.appendChild(el('span', 'muted', 'Quoted ' + Q.date)); pr.appendChild(el('b', null, money(Q.price))); q.appendChild(pr);
      if (Q.note) q.appendChild(el('p', 'muted', Q.note));
      main.appendChild(q);
      if (Q.booked) main.appendChild(booked(Q.booked)); else if (Q.accepted) main.appendChild(thanks(Q, true, false)); else main.appendChild(book(Q));
      if (Q.ways && Q.ways.length) main.appendChild(ways(Q.ways));   /* other ways to pay (2026-10-29) */
    }).catch(function () { sorry('We could not reach our system just now. Try again in a minute. ' + callLine()); });
  }
  /* the options on one quote (2026-10-30): each with its lines and price; the one picked goes with the yes */
  var pick = '';
  function options(Q) {
    var c = el('div', 'card'); c.appendChild(el('h2', null, 'Pick your option'));
    c.appendChild(el('p', 'muted', 'Quoted ' + Q.date + '. Tap the one you want, then say yes below.'));
    var list = el('div', 'opts'); pick = Q.options.pick || Q.options.list[0].k;
    Q.options.list.forEach(function (o) {
      var b = el('button', 'opt'); b.type = 'button'; b.setAttribute('aria-pressed', String(o.k === pick)); b.setAttribute('data-k', o.k);
      var hd = el('span', 'opth'); hd.appendChild(el('b', null, o.name)); hd.appendChild(el('strong', null, money(o.price))); b.appendChild(hd);
      if (o.desc) b.appendChild(el('span', 'muted', o.desc));
      var t = el('table'); o.items.forEach(function (x) { var tr = el('tr'); tr.appendChild(el('td', null, x.t)); tr.appendChild(el('td', 'r', money(x.amt))); t.appendChild(tr); }); b.appendChild(t);
      b.addEventListener('click', function () { pick = o.k; [].forEach.call(list.children, function (x) { x.setAttribute('aria-pressed', String(x.getAttribute('data-k') === pick)); }); var go = document.getElementById('go'); if (go && !go.disabled) go.textContent = goLabel(Q); });
      list.appendChild(b);
    });
    c.appendChild(list);
    if (Q.note) c.appendChild(el('p', 'muted', Q.note));
    return c;
  }
  function goLabel(Q) { var o = Q.options && Q.options.list.filter(function (x) { return x.k === pick; })[0]; return (Q.offer ? 'Book it' : 'Yes, go ahead') + (o && Q.options.list.length > 1 ? ' with ' + o.name + ' (' + money(o.price) + ')' : ''); }
  /* the company's other ways to pay (2026-10-29): each opens its own page, Zelle has details to copy; we confirm a payment when it arrives */
  function ways(list) {
    var c = el('div', 'card'); c.appendChild(el('h2', null, 'Ways to pay'));
    c.appendChild(el('p', 'muted', 'When it is time to pay (a deposit or the balance), you can use any of these. Put your name and address in the note; we confirm it when it arrives.'));
    var box = el('div', 'ways');
    list.forEach(function (w) {
      var r = el('div', 'way'), t = el('span'); t.appendChild(el('b', null, w.label)); t.appendChild(el('span', 'muted', w.k === 'zelle' ? 'Send to ' + w.show + (w.name ? ' (' + w.name + ')' : '') : w.show)); r.appendChild(t);
      if (w.url) { var a = el('a', 'btn', w.k === 'link' ? 'Open' : 'Pay with ' + w.label); a.href = w.url; a.target = '_blank'; a.rel = 'noopener'; r.appendChild(a); }
      else { var b = el('button', 'btn ghost', 'Copy'); b.type = 'button'; b.addEventListener('click', function () { var done = function () { b.textContent = 'Copied'; }; try { navigator.clipboard.writeText(w.show).then(done, function () { window.prompt('Copy this:', w.show); }); } catch (e) { window.prompt('Copy this:', w.show); } }); r.appendChild(b); }
      box.appendChild(r);
      if (w.qr) { var zi = el('img', 'zqr'); zi.alt = 'Zelle QR code: scan it in your bank’s app'; zi.src = w.qr; box.appendChild(zi); }   /* the Zelle QR code (2026-10-30) */
    });
    c.appendChild(box); return c;
  }
  function booked(Bk) { var c = el('div', 'card ok'); c.appendChild(el('h2', null, 'You’re booked')); c.appendChild(el('p', 'big', Bk.day + (Bk.arrive ? ', arriving ' + Bk.arrive : '') + '.')); c.appendChild(el('p', 'muted', 'Need to change it? ' + callLine())); return c; }
  function thanks(Q, before, gone) {
    var c = el('div', 'card ok'); c.appendChild(el('h2', null, before ? 'You said yes' : 'Thanks' + (Q.first ? ', ' + Q.first : '') + '!'));
    c.appendChild(el('p', null, gone ? 'That time was just taken, sorry. We’ll be in touch with another day.' : 'We’ll be in touch to set your day.'));
    c.appendChild(el('p', 'muted', 'Need us sooner? ' + callLine())); return c;
  }
  function book(Q) {
    var c = el('div', 'card');
    if (Q.offer) { c.appendChild(el('h2', null, 'Your day')); c.appendChild(el('p', 'big', Q.offer.day + (Q.offer.arrive ? ', arriving ' + Q.offer.arrive : '') + '.')); c.appendChild(el('p', 'muted', 'Book it with the button below. Need a different day? ' + callLine())); }
    else { c.appendChild(el('h2', null, 'Ready to go ahead?')); c.appendChild(el('p', 'muted', 'Say yes and we’ll be in touch to set your day.')); }
    c.appendChild(el('div', 'h', 'Anything we should know? (optional)'));
    var nt = el('textarea'); nt.rows = 3; nt.maxLength = 300; nt.setAttribute('aria-label', 'Anything we should know'); c.appendChild(nt);
    var label = Q.offer ? 'Book it' : 'Yes, go ahead';
    if (pick) label = goLabel(Q);   /* with the option picked (2026-10-30) */
    var go = el('button', 'btn', label); go.type = 'button'; go.id = 'go'; c.appendChild(go);
    var err = el('div', 'err'); err.setAttribute('role', 'alert'); c.appendChild(err);
    go.addEventListener('click', function () {
      err.textContent = ''; go.disabled = true; go.textContent = 'Sending…';
      fetch(API + '?action=a365accept', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ q: key, note: nt.value, opt: pick }) })
        .then(function (r) { return r.json(); }).then(function (j) {
          if (pick) label = goLabel(Q);
          if (!j || !j.ok) { go.disabled = false; go.textContent = label; err.textContent = (j && j.error) || 'That did not go through. Try again.'; return; }
          if (pick && !j.gone) { pick = ''; window.scrollTo(0, 0); load(); return; }   /* options: the page again, showing the one they picked */
          c.replaceWith(j.booked ? booked(j.booked) : thanks(Q, false, !!j.gone)); window.scrollTo(0, 0);
        }).catch(function () { go.disabled = false; go.textContent = label; err.textContent = 'No connection. Try again.'; });
    });
    return c;
  }
})();
</script>
</body>
</html>
