<!-- @dsCard group="Brand" height=280 subtitle="Mark, lockup, reverse, clear space" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Logo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Familjen+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap"><style>.lg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3);padding:var(--space-4)}
.cell{background:var(--surface-raised);border-radius:var(--radius-lg);padding:var(--space-6);display:grid;gap:var(--space-3);align-content:center;justify-items:start;min-height:84px}
.cell small{font-size:13px;color:var(--ink-muted)}
.dk{background:var(--deep)}
.space{outline:1.5px dashed var(--line);outline-offset:24px;margin:24px}
.sizes{grid-auto-flow:column;justify-content:start;align-items:end;gap:var(--space-4)}
.sizes small{grid-column:1/-1}</style></head>
<body>

<div class="lg">
  <div class="cell"><span class="tv-lockup" style="font-size:44px"><svg class="tv-mark" width="70" height="70" viewBox="0 0 64 64" aria-hidden="true"><polyline points="9,47 24,31 37,40 53,17" fill="none" stroke="var(--deep)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="47" r="5.2" fill="var(--surface-raised)" stroke="var(--deep)" stroke-width="3.6"/><circle cx="24" cy="31" r="5.2" fill="var(--surface-raised)" stroke="var(--deep)" stroke-width="3.6"/><circle cx="37" cy="40" r="5.2" fill="var(--surface-raised)" stroke="var(--deep)" stroke-width="3.6"/><circle cx="53" cy="17" r="8" fill="var(--flag)"/></svg><span class="tv-wordmark">Traverse</span></span><small>Primary lockup on surface</small></div>
  <div class="cell dk"><span class="tv-lockup" style="font-size:44px"><svg class="tv-mark" width="70" height="70" viewBox="0 0 64 64" aria-hidden="true"><polyline points="9,47 24,31 37,40 53,17" fill="none" stroke="var(--on-deep)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="47" r="5.2" fill="var(--deep)" stroke="var(--on-deep)" stroke-width="3.6"/><circle cx="24" cy="31" r="5.2" fill="var(--deep)" stroke="var(--on-deep)" stroke-width="3.6"/><circle cx="37" cy="40" r="5.2" fill="var(--deep)" stroke="var(--on-deep)" stroke-width="3.6"/><circle cx="53" cy="17" r="8" fill="var(--flag)"/></svg><span class="tv-wordmark" style="color:var(--on-deep)">Traverse</span></span><small style="color:var(--on-deep)">Reverse on deep</small></div>
  <div class="cell"><div class="space"><svg class="tv-mark" width="96" height="96" viewBox="0 0 64 64" aria-hidden="true"><polyline points="9,47 24,31 37,40 53,17" fill="none" stroke="var(--deep)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="47" r="5.2" fill="var(--surface-raised)" stroke="var(--deep)" stroke-width="3.6"/><circle cx="24" cy="31" r="5.2" fill="var(--surface-raised)" stroke="var(--deep)" stroke-width="3.6"/><circle cx="37" cy="40" r="5.2" fill="var(--surface-raised)" stroke="var(--deep)" stroke-width="3.6"/><circle cx="53" cy="17" r="8" fill="var(--flag)"/></svg></div><small>Clear space: one closing station all round</small></div>
  <div class="cell sizes"><svg class="tv-mark" width="20" height="20" viewBox="0 0 64 64" aria-hidden="true"><polyline points="9,47 24,31 37,40 53,17" fill="none" stroke="var(--deep)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="47" r="5.2" fill="var(--surface-raised)" stroke="var(--deep)" stroke-width="3.6"/><circle cx="24" cy="31" r="5.2" fill="var(--surface-raised)" stroke="var(--deep)" stroke-width="3.6"/><circle cx="37" cy="40" r="5.2" fill="var(--surface-raised)" stroke="var(--deep)" stroke-width="3.6"/><circle cx="53" cy="17" r="8" fill="var(--flag)"/></svg><svg class="tv-mark" width="32" height="32" viewBox="0 0 64 64" aria-hidden="true"><polyline points="9,47 24,31 37,40 53,17" fill="none" stroke="var(--deep)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="47" r="5.2" fill="var(--surface-raised)" stroke="var(--deep)" stroke-width="3.6"/><circle cx="24" cy="31" r="5.2" fill="var(--surface-raised)" stroke="var(--deep)" stroke-width="3.6"/><circle cx="37" cy="40" r="5.2" fill="var(--surface-raised)" stroke="var(--deep)" stroke-width="3.6"/><circle cx="53" cy="17" r="8" fill="var(--flag)"/></svg><svg class="tv-mark" width="48" height="48" viewBox="0 0 64 64" aria-hidden="true"><polyline points="9,47 24,31 37,40 53,17" fill="none" stroke="var(--deep)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="47" r="5.2" fill="var(--surface-raised)" stroke="var(--deep)" stroke-width="3.6"/><circle cx="24" cy="31" r="5.2" fill="var(--surface-raised)" stroke="var(--deep)" stroke-width="3.6"/><circle cx="37" cy="40" r="5.2" fill="var(--surface-raised)" stroke="var(--deep)" stroke-width="3.6"/><circle cx="53" cy="17" r="8" fill="var(--flag)"/></svg><small>Mark at 20, 32 and 48px</small></div>
</div>
</body>
</html>
