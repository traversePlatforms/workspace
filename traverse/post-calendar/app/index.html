<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* the look: the field app's own setting (localStorage "sixfold.theme": light, dark, or auto when absent), shared by every Traverse page on this site */(function(){function a(){try{var t=localStorage.getItem("sixfold.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);else document.documentElement.removeAttribute("data-theme")}catch(e){}}a();window.addEventListener("storage",function(e){if(!e.key||e.key==="sixfold.theme")a()})})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Post Calendar</title>
<meta name="theme-color" content="#13294b">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Posts"><meta name="mobile-web-app-capable" content="yes">
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});   /* only so it installs as an app; it keeps nothing */</script>
<style>
/* Post calendar (2026-10-31): Matthew's approval calendar for the clients' Facebook and Instagram posts. One client on screen at a time,
   in that client's colour; Traverse navy for the frame, flagging-tape orange for the one action that matters (Approve). */
:root{--bg:#f4f6f9;--card:#fff;--ink:#0f1b2d;--soft:#566476;--line:#dce2ea;--accent:#13294b;--accent2:#e6ecf5;--onaccent:#fff;--flag:#d6400c;--onflag:#fff;--warn:#b42318;--warnbg:#fdecea;--ok:#1f7a4d;--okbg:#ddf3e7;--note:#fff6dc;--noteink:#6b4e00;--chip:#edf1f6;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--client:#13294b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d131c;--card:#1b2535;--ink:#e8eef6;--soft:#9ba9ba;--line:#3e4f68;--accent:#9fbbe6;--accent2:#24344e;--onaccent:#0d131c;--flag:#ff7a45;--onflag:#1a0d06;--chip:#273449;--warn:#ff8a80;--warnbg:#3a1d1d;--ok:#5cc98f;--okbg:#16352a;--note:#3a3016;--noteink:#f3d98a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d131c;--card:#1b2535;--ink:#e8eef6;--soft:#9ba9ba;--line:#3e4f68;--accent:#9fbbe6;--accent2:#24344e;--onaccent:#0d131c;--flag:#ff7a45;--onflag:#1a0d06;--chip:#273449;--warn:#ff8a80;--warnbg:#3a1d1d;--ok:#5cc98f;--okbg:#16352a;--note:#3a3016;--noteink:#f3d98a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--accent)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.brand{font-weight:800}.brand small{display:block;font-weight:500;color:var(--soft);font-size:12px}
.picker{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-weight:700;max-width:60vw}
.picker span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
main{max-width:860px;margin:0 auto;padding:16px}
.signin{max-width:360px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center}
.signin h1{margin:0 0 4px;font-size:22px}.signin p{color:var(--soft);margin:0 0 16px}
.signin input{width:100%;font-size:26px;letter-spacing:.25em;text-align:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.btn{border:0;background:var(--accent);color:var(--onaccent);font-weight:700;padding:11px 16px;border-radius:10px;min-height:44px}
.btn.flag{background:var(--flag);color:var(--onflag)}.btn.ghost{background:var(--chip);color:var(--ink)}.btn.warn{background:var(--warnbg);color:var(--warn)}
.btn.small{padding:7px 12px;font-size:14px;min-height:36px}.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--warn);min-height:1.3em;margin:8px 0 0;font-size:14px}
.backlink{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--accent);font-weight:700;font-size:15px;padding:6px 2px;margin:0 0 8px;min-height:44px}
.backlink:hover{text-decoration:underline}
.band{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--client);border-radius:14px;padding:14px 16px;margin:0 0 14px}
.band h1{margin:0;font-size:21px;display:flex;align-items:center;gap:8px}.band .where{color:var(--soft);font-size:13.5px;margin:2px 0 8px}
details.rules{background:var(--note);color:var(--noteink);border-radius:10px;padding:8px 12px;font-size:13.5px}
details.rules summary{font-weight:700;cursor:pointer}details.rules p{margin:6px 0 0;white-space:pre-wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--soft);margin:22px 0 8px}
.week{font-size:13px;font-weight:700;color:var(--soft);margin:14px 0 6px}
.card{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--client);border-radius:12px;padding:10px;margin:0 0 8px;width:100%;text-align:left}
.card:hover{background:var(--accent2)}
.thumb{width:64px;height:80px;border-radius:8px;background:var(--chip) center/cover no-repeat;position:relative;display:grid;place-items:center;color:var(--soft);font-size:12px}
.thumb b{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;border-radius:6px;padding:0 5px}
.card .when{font-weight:700}.card .line{color:var(--soft);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin:3px 0}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chip);white-space:nowrap}
.s-approved{background:var(--okbg);color:var(--ok)}.s-published{background:var(--accent2);color:var(--accent)}.s-failed,.s-changes{background:var(--warnbg);color:var(--warn)}.s-publishing{background:var(--note);color:var(--noteink)}
.open{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px;color:var(--soft)}
.open .btn{white-space:nowrap;flex:none}
.empty{color:var(--soft);font-size:14px;margin:4px 0 0}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.sheethead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;background:var(--card);border-bottom:1px solid var(--line);border-top:5px solid var(--client);padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.sheethead b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheetbody{max-width:760px;margin:0 auto;padding:16px 16px 120px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.box h3{margin:0 0 8px;font-size:15px}
.req{background:var(--note);color:var(--noteink);border-radius:12px;padding:12px;margin:0 0 12px}
.req p{margin:4px 0;white-space:pre-wrap}.req small{opacity:.8}
.bad{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.bad ul{margin:4px 0 0;padding-left:18px}
.good{background:var(--okbg);color:var(--ok);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14px}
label.f{display:block;font-weight:700;font-size:13.5px;margin:12px 0 4px}label.f small{font-weight:500;color:var(--soft)}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;min-height:44px}
textarea{min-height:120px;resize:vertical;line-height:1.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:650;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--client);border-color:var(--client);color:#fff}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}.quick button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 9px;font-size:13px}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pic{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.pic img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--chip)}
.pic .pa{display:flex;gap:4px;padding:6px;flex-wrap:wrap}.pic .pa button{border:0;background:var(--chip);border-radius:7px;padding:4px 8px;font-size:12.5px}
.pic textarea{min-height:60px;border-radius:0;border:0;border-top:1px solid var(--line);font-size:13px}
.pic .sz{font-size:11.5px;color:var(--soft);padding:0 6px 6px}
.count{font-size:12px;color:var(--soft);text-align:right}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:3;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
.savebar .btn{flex:1;max-width:360px}
.log{font-size:13px;color:var(--soft);margin:0;padding-left:18px}.log li{margin:2px 0}
.links a{display:block;margin:2px 0;word-break:break-all}
/* the previews: close to what Facebook and Instagram show, not a copy of either */
.pv{max-width:420px;margin:0 auto;background:#fff;color:#050505;border:1px solid #dadde1;border-radius:10px;overflow:hidden;font:14px/1.38 -apple-system,system-ui,"Segoe UI",Roboto,Arial,sans-serif}
.pvh{display:flex;align-items:center;gap:8px;padding:10px 12px}.pva{width:36px;height:36px;border-radius:50%;background:var(--client);color:#fff;display:grid;place-items:center;font-weight:800}
.pvh b{display:block;font-size:14px}.pvh small{color:#65676b;font-size:12.5px}
.pvt{padding:0 12px 10px;white-space:pre-wrap;word-wrap:break-word}.pvt .more{color:#65676b;font-weight:600}
.pvi{display:grid;gap:2px;background:#000}.pvi img{display:block;width:100%;object-fit:cover}
.pvi.g2{grid-template-columns:1fr 1fr}.pvi.g2 img{aspect-ratio:1}
.pvc{padding:8px 12px 12px;white-space:pre-wrap;word-wrap:break-word}.pvc b{margin-right:4px}
.dots{display:flex;gap:4px;justify-content:center;padding:8px}.dots i{width:6px;height:6px;border-radius:50%;background:#c7c7c7}.dots i:first-child{background:#0095f6}
.igimg{position:relative}.igimg span{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;border-radius:10px;padding:1px 8px}
.ov{display:grid;gap:10px}.ovc{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:8px solid var(--client);border-radius:12px;padding:12px 14px}
.ovc b{font-size:16px}.ovc .tags{margin-top:6px}
.cl{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--client);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.cl b{font-size:16px}.cl small{display:block;color:var(--soft)}
.slotrow{display:grid;grid-template-columns:1fr 1fr 1.2fr auto;gap:6px;margin:0 0 6px}
.radio{display:flex;gap:8px;align-items:flex-start;margin:6px 0}.radio input{margin-top:4px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;font-weight:600;max-width:90vw}
.menu{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:flex-end;padding:60px 12px}
.menu .mbox{background:var(--card);border:1px solid var(--line);border-radius:14px;min-width:260px;max-width:92vw;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:12px;border-radius:10px;font-weight:650}
.menu button:hover{background:var(--accent2)}.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
/* a picture full size (2026-11-03, Matthew: "click the picture and it goes fullsize because right now its to small") */
.pic img,.pvi img,.igimg img{cursor:zoom-in}
.zoom{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;overflow:auto}
.zoom img{max-width:100vw;max-height:100vh;object-fit:contain;cursor:zoom-in}.zoom.real{display:block}.zoom.real img{max-width:none;max-height:none;cursor:zoom-out}
.zoom button{position:fixed;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:22px;font-weight:700;width:48px;height:48px;border-radius:50%;cursor:pointer}
.zoom .zx{top:12px;right:12px}.zoom .zp{left:12px;top:50%;transform:translateY(-50%)}.zoom .zn{right:12px;top:50%;transform:translateY(-50%)}
.zoom .zc{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);color:#fff;font-size:13px;background:rgba(0,0,0,.5);border-radius:10px;padding:3px 10px}
</style>
</head>
<body>
<div id="signin" class="signin" hidden>
  <h1>Post calendar</h1><p>Enter your code.</p>
  <form id="sf"><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" aria-label="Sign-in code"><div class="err" id="serr"></div><button class="btn flag wide" style="margin-top:10px">Sign in</button></form>
</div>
<div id="app" hidden>
  <div class="bar"><div class="brand">Post calendar<small id="who"></small></div><button class="picker" id="pick" aria-haspopup="true"><i class="dot" id="pdot"></i><span id="pname">Clients</span> &#9662;</button></div>
  <main id="main"></main>
</div>
<div id="sheet" class="sheet" hidden></div>
<div id="menu" class="menu" hidden><div class="mbox" id="mbox"></div></div>
<div id="toast" class="toast" hidden></div>
<script>
(function () {
  'use strict';
  var API = 'api/cal.php', TZ = 'America/Denver';
  var D = { me: null, clients: [], client: null, posts: [], slots: [], counts: null, pages: null, statuses: {} };
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function toast(m) { var t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 2600); }
  function api(action, body, query) {
    var url = API + '?action=' + action + (query || ''), o = { credentials: 'same-origin', headers: {} };
    if (body instanceof FormData) { o.method = 'POST'; o.body = body; o.headers['X-PC'] = '1'; }
    else if (body) { o.method = 'POST'; o.body = JSON.stringify(body); o.headers['Content-Type'] = 'application/json'; o.headers['X-PC'] = '1'; }
    return fetch(url, o).then(function (r) { return r.json().catch(function () { return { ok: false, error: 'The server did not answer properly.' }; }).then(function (j) { if (r.status === 401 && action !== 'signin') { showSignin(); throw new Error('Signed out.'); } if (!j.ok) throw new Error(j.error || 'Something went wrong.'); return j; }); });
  }
  /* times: always Mountain, whatever the phone's own zone */
  var fmtW = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
  var fmtD = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
  var fmtT = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  var fmtWk = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short' });
  function when(ts) { return ts ? fmtW.format(new Date(ts * 1000)) : 'No time yet'; }
  function dstr(ts) { return fmtD.format(new Date(ts * 1000)); }
  function tstr(ts) { return fmtT.format(new Date(ts * 1000)); }
  function weekOf(ts) { var d = new Date(dstr(ts) + 'T12:00:00Z'), dow = d.getUTCDay(), m = new Date(d.getTime() - ((dow + 6) % 7) * 864e5); return m.toISOString().slice(0, 10); }
  function weekLabel(k) { var d = new Date(k + 'T12:00:00Z'); return 'Week of ' + d.toLocaleDateString('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric' }); }
  function cur() { return D.clients.filter(function (c) { return c.id === D.client; })[0] || null; }
  function clientCss(c) { document.documentElement.style.setProperty('--client', c ? c.color : '#13294b'); }
  function tLabel(t) { return t === 'fb' ? 'Facebook' : 'Instagram'; }
  function statusOf(p) { return p.status === 'draft' && p.openRequest ? 'changes' : p.status; }

  /* ---- sign-in ---- */
  function showSignin() { $('app').hidden = true; $('sheet').hidden = true; $('signin').hidden = false; $('code').focus(); }
  $('sf').addEventListener('submit', function (e) {
    e.preventDefault(); $('serr').textContent = '';
    api('signin', { code: $('code').value }).then(function () { $('code').value = ''; start(); }).catch(function (er) { $('serr').textContent = er.message; });
  });

  /* ---- loading ---- */
  function load(cid) {
    return api('data', null, cid ? '&client=' + encodeURIComponent(cid) : '').then(function (j) {
      D.me = j.me; D.clients = j.clients; D.statuses = j.statuses; D.pages = j.pages; D.client = j.client || null; D.posts = j.posts || []; D.slots = j.slots || []; D.counts = j.counts || null;
      $('who').textContent = j.me.name + (j.me.role === 'admin' ? '' : ' (drafts only)');
      if (D.client) store('postcal.client', D.client);
      render();
    });
  }
  /* where we are, kept in the browser's history (2026-10-31, Matthew: no way back to the client list from a client's calendar): the client
     list, one client, or a post or the Clients screen on top. The phone's Back goes one step up: post -> client -> client list. */
  function nav(state, replace) { try { history[replace ? 'replaceState' : 'pushState'](Object.assign({ pc: 1, client: '' }, state), '', location.pathname + location.search); } catch (e) {} }
  function showClient(cid) { cid = cid || ''; store('postcal.client', cid || 'all'); nav({ client: cid }); return load(cid).catch(function () {}); }
  function start() {
    $('signin').hidden = true; $('app').hidden = false;
    var c = store('postcal.client'); c = c && c !== 'all' ? c : '';
    nav({ client: '' }, true); if (c) nav({ client: c });   /* the list always sits underneath, so Back from the remembered client reaches it */
    load(c).catch(function () {});
  }
  function hideSheet() { $('sheet').hidden = true; document.body.style.overflow = ''; P = W = null; dirty = false; }
  window.addEventListener('popstate', function (e) {
    var s = e.state && e.state.pc ? e.state : { client: '' };
    if (!$('sheet').hidden && !s.post && !s.sheet) {
      if (dirty && !confirm('Leave without saving your changes?')) { nav({ client: D.client || '', post: P && P.id }); return; }
      hideSheet();
    }
    if ((s.client || '') !== (D.client || '')) { store('postcal.client', s.client || 'all'); load(s.client || '').catch(function () {}); }
    else if (!s.post && !s.sheet) load(D.client || '').catch(function () {});
  });
  function render() {
    var c = cur(); clientCss(c);
    $('pdot').style.background = c ? c.color : 'transparent'; $('pname').textContent = c ? c.name : 'All clients';
    if (!c) return renderOverview();
    renderClient(c);
  }

  /* ---- the picker: one client at a time ---- */
  $('pick').addEventListener('click', function () {
    var h = D.clients.filter(function (c) { return !c.archived; }).map(function (c) { return '<button data-c="' + esc(c.id) + '"><i class="dot" style="background:' + esc(c.color) + '"></i>' + esc(c.name) + '</button>'; }).join('');
    h += '<hr><button data-c="">All clients (counts)</button>';
    if (D.me.role === 'admin') h += '<button data-a="clients">Manage clients</button>';
    h += '<button data-a="look">Look: ' + ({ light: 'Light', dark: 'Dark' }[store('sixfold.theme')] || 'Auto') + '</button><button data-a="out">Sign out</button>';
    $('mbox').innerHTML = h; $('menu').hidden = false;
  });
  $('menu').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) { $('menu').hidden = true; return; }
    $('menu').hidden = true;
    if (b.hasAttribute('data-c')) { showClient(b.getAttribute('data-c')); return; }
    var a = b.getAttribute('data-a');
    if (a === 'clients') openClients();
    if (a === 'look') { var t = store('sixfold.theme'), n = t === 'light' ? 'dark' : t === 'dark' ? null : 'light'; try { if (n) localStorage.setItem('sixfold.theme', n); else localStorage.removeItem('sixfold.theme'); } catch (er) {} if (n) document.documentElement.setAttribute('data-theme', n); else document.documentElement.removeAttribute('data-theme'); }
    if (a === 'out') api('signout', {}).then(showSignin).catch(showSignin);
  });

  function renderOverview() {

    if (pvWhich === 'fb') {
      if (p.targets.indexOf('fb') < 0) { el.innerHTML = '<p class="empty">Not going to Facebook.</p>'; return; }
      var g = ims.length > 1 ? '<div class="pvi g2">' + ims.slice(0, 4).map(function (im) { return '<img src="' + esc(im.url) + '" alt="">'; }).join('') + '</div>' : ims[0] ? '<div class="pvi">' + (isVid(ims[0]) ? '<video src="' + esc(ims[0].url) + '" controls playsinline muted preload="metadata" style="display:block;width:100%;max-height:520px;background:#000"></video>' : '<img src="' + esc(ims[0].url) + '" alt="">') + '</div>' : '<p class="empty" style="padding:0 12px 12px">No picture yet</p>';
      el.innerHTML = '<div class="pv"><div class="pvh"><div class="pva">' + ini + '</div><div><b>' + esc(c.page_name || c.name) + (p.type === 'photoset' && p.album ? ' added ' + ims.length + ' photos to ' + esc(p.album) : '') + '</b><small>' + esc(at) + '</small></div></div><div class="pvt">' + clip(p.fb, 480) + '</div>' + g + '</div>';
    } else {
      if (p.targets.indexOf('ig') < 0) { el.innerHTML = '<p class="empty">Not going to Instagram.</p>'; return; }
      var u = c.ig_user || 'instagram';
      el.innerHTML = '<div class="pv"><div class="pvh"><div class="pva">' + ini + '</div><div><b>' + esc(u) + '</b></div></div>'
        + (ims[0] ? '<div class="igimg">' + (isVid(ims[0]) ? '<video src="' + esc(ims[0].url) + '" controls playsinline muted preload="metadata" style="display:block;width:100%;aspect-ratio:9/16;object-fit:cover;background:#000"></video>' : '<img src="' + esc(ims[0].url) + '" alt="" style="display:block;width:100%;aspect-ratio:4/5;object-fit:cover">') + (ims.length > 1 ? '<span>1/' + ims.length + '</span>' : '') + '</div>' : '<p class="empty" style="padding:0 12px">No picture yet</p>')
        + (ims.length > 1 ? '<div class="dots">' + ims.map(function () { return '<i></i>'; }).join('') + '</div>' : '')
        + '<div class="pvc"><b>' + esc(u) + '</b>' + clip(p.ig, 125) + '</div></div>';
    }
  }

  /* ---- clients (Matthew only) ---- */
  function openClients() {
    clientCss(null);
    var h = '<div class="sheethead"><button class="btn small ghost" id="cback">&#8592; Back</button><b>Clients</b></div><div class="sheetbody"><p class="empty">Each client posts only to its own Facebook Page and Instagram account. A Page belongs to one client at a time.</p>';
    D.clients.forEach(function (c) {
      h += '<div class="cl" style="--client:' + esc(c.color) + '"><b>' + esc(c.name) + '</b>' + (c.archived ? ' <span class="pill">archived</span>' : '')
        + '<small>' + (c.page_id ? 'Facebook: ' + esc(c.page_name || c.page_id) : 'No Page') + ' &middot; ' + (c.ig_id ? 'Instagram @' + esc(c.ig_user) : 'no Instagram') + ' &middot; ' + (c.conn === 'own' ? 'own Page token' + (c.ownToken ? ' saved' : ' MISSING') : 'through Matthew\'s business') + '</small>'
        + '<small>' + (c.slots || []).map(function (s) { return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][s.d] + ' ' + s.t + (s.type === 'photoset' ? ' (photo set)' : ''); }).join(', ') + '</small>'
        + '<div class="acts"><button class="btn small ghost" data-ed="' + esc(c.id) + '">Edit</button><button class="btn small ghost" data-ar="' + esc(c.id) + '">' + (c.archived ? 'Restore' : 'Archive') + '</button></div></div>';
    });
    h += '<button class="btn wide" id="cadd">+ Add a client</button></div>';
    $('sheet').innerHTML = h; $('sheet').hidden = false; document.body.style.overflow = 'hidden';
    if (!(history.state && history.state.sheet)) nav({ client: D.client || '', sheet: 'clients' });
    $('cback').onclick = closeSheet;
    $('cadd').onclick = function () { clientForm(null); };
    $('sheet').querySelectorAll('[data-ed]').forEach(function (b) { b.onclick = function () { clientForm(D.clients.filter(function (c) { return c.id === b.getAttribute('data-ed'); })[0]); }; });
    $('sheet').querySelectorAll('[data-ar]').forEach(function (b) { b.onclick = function () {
      var c = D.clients.filter(function (x) { return x.id === b.getAttribute('data-ar'); })[0];
      if (!c.archived && !confirm('Archive ' + c.name + '? Its approved posts go back to draft and nothing of it is posted.')) return;
      api('clientarchive', { id: c.id, archived: !c.archived }).then(function () { return load(D.client); }).then(openClients).catch(function (e) { toast(e.message); });
    }; });
  }
  function clientForm(c) {
    c = c || { id: '', name: '', color: '#13294b', conn: 'pipeline', page_id: '', ig_id: '', slots: [{ d: 2, t: '15:00', type: 'single' }, { d: 4, t: '15:00', type: 'single' }], rules: '' };
    var slots = JSON.parse(JSON.stringify(c.slots || []));
    var h = '<div class="sheethead"><button class="btn small ghost" id="fback">&#8592; Clients</button><b>' + (c.id ? 'Edit ' + esc(c.name) : 'Add a client') + '</b></div><div class="sheetbody"><div class="box">'
      + '<label class="f" for="cn">Name</label><input type="text" id="cn" maxlength="60" value="' + esc(c.name) + '">'
      + '<label class="f" for="cc">Colour <small>(the client\'s lane colour)</small></label><input type="color" id="cc" value="' + esc(c.color) + '" style="width:80px;height:44px;border:0;background:none">'
      + '<label class="f">How we post for them</label>'
      + '<label class="radio"><input type="radio" name="conn" value="pipeline"' + (c.conn !== 'own' ? ' checked' : '') + '><span>Through Matthew\'s business (the client added it as a partner on their Page and Instagram)</span></label>'
      + '<label class="radio"><input type="radio" name="conn" value="own"' + (c.conn === 'own' ? ' checked' : '') + '><span>With the client\'s own Page access token (kept on the server, never shown again)</span></label>'
      + '<div id="pipe"><label class="f" for="cp">Facebook Page</label><select id="cp"><option value="">Loading the Pages...</option></select><label class="f" for="ci">Instagram account</label><select id="ci"></select></div>'
      + '<div id="own" hidden><label class="f" for="ct">Page access token' + (c.ownToken ? ' <small>(one is saved; paste a new one to replace it)</small>' : '') + '</label><textarea id="ct" style="min-height:70px" autocomplete="off" spellcheck="false"></textarea><label class="radio"><input type="checkbox" id="cig"' + (c.ig_id ? ' checked' : '') + '><span>Also post to the Instagram account linked to that Page</span></label></div>'
      + '<label class="f">Default posting days and times <small>(Mountain)</small></label><div id="slots"></div><button class="btn small ghost" id="sadd">+ Add a slot</button>'
      + '<label class="f" for="cr">Rules for this client <small>(shown on every draft; a note or a link)</small></label><textarea id="cr">' + esc(c.rules || '') + '</textarea>'
      + '<div class="err" id="cerr"></div><button class="btn wide" id="csave" style="margin-top:8px">Save client</button></div></div>';
    $('sheet').innerHTML = h;
    $('fback').onclick = openClients;
    function drawSlots() {
      $('slots').innerHTML = slots.map(function (s, i) { return '<div class="slotrow"><select data-sd="' + i + '">' + ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(function (n, d) { return '<option value="' + d + '"' + (+s.d === d ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select><input type="time" data-st="' + i + '" value="' + esc(s.t) + '"><select data-sy="' + i + '"><option value="single">One picture</option><option value="photoset"' + (s.type === 'photoset' ? ' selected' : '') + '>Photo set</option></select><button class="btn small ghost" data-sx="' + i + '" aria-label="Remove">&times;</button></div>'; }).join('');
      $('slots').querySelectorAll('[data-sd]').forEach(function (el) { el.onchange = function () { slots[+el.getAttribute('data-sd')].d = +el.value; }; });
      $('slots').querySelectorAll('[data-st]').forEach(function (el) { el.onchange = function () { slots[+el.getAttribute('data-st')].t = el.value; }; });
      $('slots').querySelectorAll('[data-sy]').forEach(function (el) { el.onchange = function () { slots[+el.getAttribute('data-sy')].type = el.value; }; });
      $('slots').querySelectorAll('[data-sx]').forEach(function (el) { el.onclick = function () { slots.splice(+el.getAttribute('data-sx'), 1); drawSlots(); }; });
    }
    drawSlots(); $('sadd').onclick = function () { slots.push({ d: 2, t: '15:00', type: 'single' }); drawSlots(); };
    function connMode() { var own = document.querySelector('input[name=conn]:checked').value === 'own'; $('pipe').hidden = own; $('own').hidden = !own; }
    document.querySelectorAll('input[name=conn]').forEach(function (r) { r.onchange = connMode; }); connMode();
    var pages = [];
    function drawIg() {
      var pg = pages.filter(function (x) { return x.page_id === $('cp').value; })[0];
      var o = '<option value="">None</option>';
      if (pg && pg.ig_id) o += '<option value="' + esc(pg.ig_id) + '"' + (pg.ig_client && pg.ig_client !== c.id ? ' disabled' : '') + (c.ig_id === pg.ig_id ? ' selected' : '') + '>@' + esc(pg.ig_user) + (pg.ig_client && pg.ig_client !== c.id ? ' (assigned to ' + esc(nameOf(pg.ig_client)) + ')' : '') + '</option>';
      $('ci').innerHTML = o;
    }
    api('pages').then(function (j) {
      pages = j.pages;
      $('cp').innerHTML = '<option value="">None yet</option>' + pages.map(function (pg) { var taken = pg.client && pg.client !== c.id; return '<option value="' + esc(pg.page_id) + '"' + (taken ? ' disabled' : '') + (c.page_id === pg.page_id ? ' selected' : '') + '>' + esc(pg.page_name) + (taken ? ' (assigned to ' + esc(nameOf(pg.client)) + ')' : pg.client ? '' : ' (free)') + '</option>'; }).join('');
      $('cp').onchange = drawIg; drawIg();
    }).catch(function (e) { $('cp').innerHTML = '<option value="">Could not read the Pages: ' + esc(e.message) + '</option>'; });
    $('csave').onclick = function () {
      var own = document.querySelector('input[name=conn]:checked').value === 'own';
      var b = { id: c.id, name: $('cn').value, color: $('cc').value, conn: own ? 'own' : 'pipeline', slots: slots, rules: $('cr').value };
      if (own) { b.token = $('ct').value.trim(); b.ig_id = $('cig').checked ? 'linked' : ''; } else { b.page_id = $('cp').value; b.ig_id = $('ci').value; }
      $('cerr').textContent = ''; $('csave').disabled = true;
      api('client', b).then(function () { return load(D.client); }).then(openClients).catch(function (e) { $('cerr').textContent = e.message; $('csave').disabled = false; });
    };
  }
  function nameOf(id) { var c = D.clients.filter(function (x) { return x.id === id; })[0]; return c ? c.name : id; }

  /* a picture full size (2026-11-03, Matthew): tap any picture in a post or its preview; it fills the screen, a second tap shows it at its
     real size (scroll around it), arrows or the keys step through the post's other pictures, the X, Escape or a tap beside it closes */
  var zoomEl = null;
  function zoomClose() { if (zoomEl) { zoomEl.remove(); zoomEl = null; } }
  function zoomOpen(urls, i) {
    zoomClose(); var z = document.createElement('div'); z.className = 'zoom'; z.setAttribute('role', 'dialog'); z.setAttribute('aria-label', 'Picture, full size');
    var img = document.createElement('img'); img.alt = ''; z.appendChild(img);
    var cnt = document.createElement('div'); cnt.className = 'zc';
    var show = function () { img.src = urls[i]; z.classList.remove('real'); cnt.textContent = (i + 1) + ' of ' + urls.length; cnt.hidden = urls.length < 2; };
    var btn = function (cls, label, txt, fn) { var b = document.createElement('button'); b.type = 'button'; b.className = cls; b.setAttribute('aria-label', label); b.innerHTML = txt; b.onclick = function (e) { e.stopPropagation(); fn(); }; z.appendChild(b); return b; };
    btn('zx', 'Close', '&#10005;', zoomClose);
    if (urls.length > 1) { btn('zp', 'Previous picture', '&#8249;', function () { i = (i + urls.length - 1) % urls.length; show(); }); btn('zn', 'Next picture', '&#8250;', function () { i = (i + 1) % urls.length; show(); }); z.appendChild(cnt); }
    img.onclick = function (e) { e.stopPropagation(); z.classList.toggle('real'); };
    z.onclick = zoomClose; z._step = function (d) { if (urls.length > 1) { i = (i + d + urls.length) % urls.length; show(); } };
    show(); document.body.appendChild(z); zoomEl = z;
  }
  document.addEventListener('click', function (e) {
    var t = e.target; if (!t || t.tagName !== 'IMG' || !t.closest || zoomEl) return;
    var box = t.closest('.pics, .pvi, .igimg, .pv'); if (!box) return;
    var all = [].slice.call(box.querySelectorAll('img')).filter(function (x) { return x.closest('.pics, .pvi, .igimg'); }).map(function (x) { return x.src; });
    var pics = document.querySelector('#sheet .pics'), ps = pics ? [].slice.call(pics.querySelectorAll('img')).map(function (x) { return x.src; }) : [];
    if (ps.length > all.length && ps.indexOf(t.src) >= 0) all = ps;   /* a preview shows four of a photo set: step through every one */
    e.preventDefault(); e.stopPropagation();
    zoomOpen(all, Math.max(0, all.indexOf(t.src)));
  }, true);
  window.addEventListener('keydown', function (e) {
    if (zoomEl) { if (e.key === 'Escape') zoomClose(); else if (e.key === 'ArrowLeft') zoomEl._step(-1); else if (e.key === 'ArrowRight') zoomEl._step(1); return; }
    if (e.key === 'Escape' && !$('sheet').hidden && $('back')) closeSheet();
  });
  api('me').then(start).catch(function () {});
})();
</script>
</body>
