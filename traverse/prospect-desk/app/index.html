<style>

:root{--onaccent:#fff;--bg:#f4f6f9;--card:#fff;--ink:#0f1b2d;--soft:#566476;--line:#dce2ea;--accent:#13294b;--accent2:#e6ecf5;--flag:#d6400c;--onflag:#fff;--warn:#b42318;--ok:#1f7a4d;--chip:#edf1f6;

.detail h2{margin:0;font-size:19px;overflow-wrap:anywhere}.detail .sub{color:var(--soft);font-size:13.5px;margin:2px 0 10px}
.sec{border-top:1px solid var(--line);padding:12px 0 4px;margin-top:10px}.sec h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}

.ct{display:grid;gap:2px;padding:4px 0;font-size:14px}.ct a{color:var(--accent);word-break:break-all}.ct small{color:var(--soft)}

.note{font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.note small{color:var(--soft);display:block}
.empty{padding:28px;text-align:center;color:var(--soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.card h3{margin:0 0 6px;font-size:16px}.card small,.soft{color:var(--soft)}
.warnbox{background:#fde6dc;color:#7a2606;border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:14.5px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.kpi b{display:block;font-size:22px}.kpi span{color:var(--soft);font-size:13px}
.pick{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px}
.pick:last-child{border-bottom:0}.pick input{width:18px;height:18px}.pick small{color:var(--soft);display:block;overflow-wrap:anywhere}
.msg{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px;background:var(--card)}
.msg .mh{font-size:13px;color:var(--soft);overflow-wrap:anywhere}.msg .ms{font-weight:700;margin:2px 0 8px;overflow-wrap:anywhere}
.msg pre{white-space:pre-wrap;font:14px/1.5 var(--sans);margin:0;overflow-wrap:anywhere}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;font-size:14px;display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px)}
.toast button{border:0;background:none;color:var(--flag);font-weight:800;padding:0}
.close{float:right}
.help{font-size:12.5px;color:var(--soft);margin:2px 0 0}
.warnline{color:var(--warn);font-weight:650}
@media (max-width:640px){
  .bar{padding:8px 12px;gap:4px 10px}.brand small{display:none}.who{font-size:12px}
  .tabs{order:3;width:100%}.tabs button{flex:1 1 auto;padding:6px 6px;font-size:13px;white-space:nowrap;text-align:center}.tabs button .tn{margin-left:4px;padding:0 6px}
  main{padding:12px 16px}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}.chips button{flex:none}
  .controls{gap:8px}.controls .search{flex:1 1 150px;min-width:0}.sortby span{display:none}.sortby select{max-width:44vw}
  .row{grid-template-columns:36px minmax(0,1fr) auto;gap:8px;padding:10px}
  .nm b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
  .pill{font-size:11px;padding:2px 7px}.reach{display:block;margin:0 0 3px;text-align:right}
  .detail{padding:14px 16px 28px}
  .shead h1{font-size:19px}.form .two{grid-template-columns:1fr}
}
</style>

<body>
<div class="bar" id="bar" hidden>
  <div class="brand">Traverse Prospects<small>Companies that could buy Traverse</small></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="who"><span id="whoName"></span><button class="lnk" id="signout" type="button">Sign out</button></div>
</div>
<main id="main"></main>
<div class="toast" id="toast" hidden></div>
<script>
(function () {
  'use strict';
  var API = 'api/desk.php';
  var S = { data: null, tab: 'list', f: { trade: 'all', where: 'all', reach: 'any', st: 'open', grade: 'all' }, q: '', sort: 'fit', sel: null, shown: 150,
            em: { trade: 'all', where: 'all', fresh: true, ticks: null, tpl: 'auto', shown: 200, preview: null } };
  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  var main = $('main');
  var OFF = ['notnow', 'no'];
  var WHERE = [['in our towns', 'In our towns'], ['next to our towns', 'Next to our towns'], ['elsewhere in Colorado', 'Elsewhere in Colorado']];
  var SHORT = { roofing: 'ROOF', 'roofing solar': 'R+S', solar: 'SOL', pest: 'PEST', security: 'SEC', yards: 'YARD' };
  function api(action, body, q) {
    return fetch(API + '?action=' + action + (q || ''), { method: body ? 'POST' : 'GET', credentials: 'same-origin', headers: body ? { 'Content-Type': 'application/json', 'X-Desk': '1' } : {}, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j._status = r.status; return j; }); });
  }
  var tT; function toast(t, undo) {
    var e = $('toast'); e.textContent = ''; e.appendChild(el('span', null, t));
    if (undo) { var u = el('button', null, 'Undo'); u.type = 'button'; u.addEventListener('click', function () { e.hidden = true; undo(); }); e.appendChild(u); }
    e.hidden = false; clearTimeout(tT); tT = setTimeout(function () { e.hidden = true; }, undo ? 7000 : 2600);
  }
  var today = function () { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  var fmtDay = function (iso) { if (!iso) return ''; var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); };
  var ago = function (ts) { return new Date(ts * 1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
  var agoT = function (ts) { return new Date(ts * 1000).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); };
  var stName = function (k) { return S.data.statuses[k] || k; };
  var trName = function (k) { return S.data.trades[k] || k; };
  var lead = function (id) { return S.byId[id]; };
  var isOff = function (l) { return OFF.indexOf(l.status) >= 0; };
  var isDue = function (l) { return l.next && l.next.date && l.next.date <= today() && !isOff(l) && l.status !== 'customer'; };
  var reachN = function (l) { return (l.phone ? 1 : 0) + (l.email ? 1 : 0); };
  var whereRank = function (l) { var i = WHERE.map(function (w) { return w[0]; }).indexOf(l.where); return i < 0 ? 3 : i; };

  /* ---- sign-in ---- */
  function signin(msg) {
    $('bar').hidden = true; main.textContent = '';
    var b = el('form', 'signin'); b.appendChild(el('h1', null, 'Traverse Prospects')); b.appendChild(el('p', null, 'Enter your 6-digit code'));
    var i = el('input'); i.inputMode = 'numeric'; i.maxLength = 6; i.autocomplete = 'one-time-code'; i.setAttribute('aria-label', 'Your code'); b.appendChild(i);
    var go = el('button', 'btn', 'Sign in'); go.type = 'submit'; go.style.marginTop = '12px'; go.style.width = '100%'; b.appendChild(go);
    var er = el('div', 'err', msg || ''); b.appendChild(er);
    b.addEventListener('submit', function (ev) { ev.preventDefault(); go.disabled = true; api('signin', { code: i.value }).then(function (j) { go.disabled = false; if (!j.ok) { er.textContent = j.error || 'That did not work.'; return; } load(); }).catch(function () { go.disabled = false; er.textContent = 'No connection.'; }); });
    main.appendChild(b); setTimeout(function () { i.focus(); }, 30);
  }
  $('signout').addEventListener('click', function () { api('signout', {}).then(function () { S.data = null; signin(); }); });
  function load(then) {
    return api('data').then(function (j) {
      if (j._status === 401) return signin();
      if (!j.ok) { main.textContent = ''; main.appendChild(el('div', 'empty', j.error || 'Could not load.')); return; }
      S.data = j; S.byId = {}; j.leads.forEach(function (l) { S.byId[l.id] = l; });
      $('bar').hidden = false; $('whoName').textContent = j.me.name;
      tabs(); (then || draw)();
    }).catch(function () { main.textContent = ''; main.appendChild(el('div', 'empty', 'No connection. Try again when you have signal.')); });
  }
  function save(action, body, msg, undo) {
    return api(action, body).then(function (j) {
      if (j._status === 401) { signin('Signed out. Enter your code again.'); return j; }
      if (!j.ok) { toast(j.error || 'Not saved.'); return j; }
      return load(function () { draw(); if (msg) toast(msg, undo); }).then(function () { return j; });
    }).catch(function () { toast('No connection. Nothing was saved.'); return {}; });
  }

  /* ---- sections ---- */
  var SECS = [['list', 'Prospects'], ['due', 'Follow-ups'], ['email', 'Email'], ['settings', 'Settings']];
  function tabCount(t) {
    var L = S.data.leads;
    if (t === 'list') return L.filter(function (l) { return !isOff(l) && reachN(l); }).length;
    if (t === 'due') return L.filter(isDue).length;
    if (t === 'email') return S.data.queue.waiting || null;
    return null;
  }
  function tabs() {
    var t = $('tabs'); t.textContent = '';
    SECS.forEach(function (x) {
      var b = el('button'); b.type = 'button'; b.setAttribute('data-tab', x[0]); b.appendChild(el('span', null, x[1]));
      var n = tabCount(x[0]); if (n != null) b.appendChild(el('b', 'tn', String(n)));
      if (S.tab === x[0]) b.setAttribute('aria-current', 'page');
      b.addEventListener('click', function () { go(x[0]); }); t.appendChild(b);
    });
  }
  function go(t) { S.tab = t; S.sel = null; try { history.replaceState(null, '', '#' + t); } catch (e) {} tabs(); draw(); window.scrollTo(0, 0); }
  function draw() {
    main.textContent = ''; document.documentElement.classList.remove('lock');
    main.setAttribute('data-section', S.tab);
    ({ list: drawList, due: drawDue, email: drawEmail, settings: drawSettings })[S.tab]();
  }
  function head(title, desc, btns) {
    var h = el('div', 'shead'), top = el('div', 'shtop'); top.appendChild(el('h1', null, title)); (btns || []).forEach(function (b) { top.appendChild(b); });
    h.appendChild(top); if (desc) h.appendChild(el('p', 'sdesc', desc)); main.appendChild(h);
  }
  /* a row of filter chips: [key, label, count] */
  function chipRow(label, opts, cur, pick) {
    var c = el('div', 'chips'); c.appendChild(el('span', 'chiplab', label));
    opts.forEach(function (o) { var b = el('button', null, o[1]); b.type = 'button'; b.setAttribute('data-k', o[0]); if (o[2] != null) b.appendChild(el('b', null, String(o[2]))); b.setAttribute('aria-pressed', String(cur === o[0])); b.addEventListener('click', function () { pick(o[0]); }); c.appendChild(b); });
    return c;
  }
  function matchBase(l, f) {
    return (f.trade === 'all' || l.trade === f.trade) && (f.where === 'all' || l.where === f.where) && (!f.grade || f.grade === 'all' || (l.grade || 'C') === f.grade);
  }
  function matchReach(l, r) { return r === 'all' ? true : r === 'any' ? reachN(l) > 0 : r === 'phone' ? !!l.phone : r === 'email' ? !!l.email : reachN(l) === 0; }
  function matchSt(l, st) { return st === 'open' ? !isOff(l) : st === 'off' ? isOff(l) : l.status === st; }

  /* ---- Prospects ---- */

    var refreshCount = function () { var n = picked().length; cnt.textContent = n + ' of ' + pool.length + ' companies ticked' + (pool.length < D.leads.filter(function (l) { return !l.queued; }).length ? '. Companies with no usable email, asked not to be emailed, knocked off or customers are left out.' : '.'); go2.disabled = !n; };
    function drawPicks() {
      pl.textContent = '';
      if (!pool.length) { pl.appendChild(el('div', 'empty', 'No company here can be emailed.')); return; }
      pool.slice(0, em.shown).forEach(function (l) {
        var r = el('label', 'pick'); var cb = el('input'); cb.type = 'checkbox'; cb.checked = !!em.ticks[l.id]; cb.setAttribute('data-id', l.id);
        cb.addEventListener('change', function () { if (cb.checked) em.ticks[l.id] = true; else delete em.ticks[l.id]; em.preview = null; prev.textContent = ''; refreshCount(); });
        r.appendChild(cb); var tx = el('span'); tx.appendChild(el('b', null, l.name)); tx.appendChild(el('small', null, [l.email, trName(l.trade), l.city].join(' · '))); r.appendChild(tx);
        r.appendChild(el('span', 'pill s-' + l.status, stName(l.status))); pl.appendChild(r);
      });
      if (pool.length > em.shown) { var m = el('button', 'more', 'Show more (' + (pool.length - em.shown) + ' left)'); m.type = 'button'; m.addEventListener('click', function () { em.shown += 400; drawPicks(); }); pl.appendChild(m); }
    }
    all.addEventListener('click', function () { pool.forEach(function (l) { em.ticks[l.id] = true; }); em.preview = null; prev.textContent = ''; drawPicks(); refreshCount(); });
    none.addEventListener('click', function () { em.ticks = {}; em.preview = null; prev.textContent = ''; drawPicks(); refreshCount(); });
    /* the template */
    var c2 = el('div', 'card'); c2.appendChild(el('h3', null, '2. The message')); main.appendChild(c2);
    var tsel = el('select'); tsel.setAttribute('aria-label', 'Template'); tsel.style.cssText = 'padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);max-width:100%';
    [['auto', 'Each company gets its own trade’s template']].concat(Object.keys(D.trades).map(function (t) { return [t, 'Everyone gets the ' + D.trades[t] + ' template']; })).forEach(function (o) { var x = el('option', null, o[1]); x.value = o[0]; tsel.appendChild(x); });
    tsel.value = em.tpl; tsel.addEventListener('change', function () { em.tpl = tsel.value; em.preview = null; prev.textContent = ''; }); c2.appendChild(tsel);
    var ed = el('p', 'help'); ed.appendChild(document.createTextNode('Change the wording in ')); var gs2 = el('button', 'lnk', 'Settings ›'); gs2.type = 'button'; gs2.addEventListener('click', function () { go('settings'); }); ed.appendChild(gs2); c2.appendChild(ed);
    var go2 = el('button', 'btn', 'Read every message'); go2.type = 'button'; go2.style.marginTop = '10px'; c2.appendChild(go2);
    var prev = el('div'); prev.style.marginTop = '12px'; c2.appendChild(prev);
    go2.addEventListener('click', function () {
      var ids = picked().map(function (l) { return l.id; }); go2.disabled = true;
      api('preview', { ids: ids, tpl: em.tpl }).then(function (j) { go2.disabled = false; if (!j.ok) { toast(j.error || 'Could not make them.'); return; } em.preview = j; drawPreview(); }).catch(function () { go2.disabled = false; toast('No connection.'); });
    });
    function drawPreview() {
      prev.textContent = ''; var j = em.preview; if (!j) return;
      var sk = Object.keys(j.skipped || {}); if (sk.length) prev.appendChild(el('p', 'soft', 'Left out: ' + sk.map(function (k) { return j.skipped[k] + ' (' + k + ')'; }).join(', ') + '.'));
      var shownN = 30, box = el('div'); prev.appendChild(box);
      var draw3 = function () { box.textContent = ''; j.messages.slice(0, shownN).forEach(function (m) { var c = el('div', 'msg'); c.appendChild(el('div', 'mh', 'To: ' + m.to)); c.appendChild(el('div', 'ms', m.subject)); c.appendChild(el('pre', null, m.body)); box.appendChild(c); }); if (j.messages.length > shownN) { var mm = el('button', 'btn ghost small', 'Show ' + Math.min(50, j.messages.length - shownN) + ' more of ' + (j.messages.length - shownN) + ' left'); mm.type = 'button'; mm.addEventListener('click', function () { shownN += 50; draw3(); }); box.appendChild(mm); } };
      draw3();
      var send = el('button', 'btn', 'Queue these ' + j.messages.length + ' emails'); send.type = 'button'; send.style.marginTop = '10px'; send.setAttribute('data-act', 'queue');
      var days = Math.ceil(j.messages.length / Math.max(1, set.cap));
      var why = el('p', 'help', noAddr ? 'Add your postal address in Settings to turn sending on.' : 'They go out at most ' + set.cap + ' a day, weekdays 8 am to 5 pm: about ' + days + (days === 1 ? ' working day.' : ' working days.') + ' You can stop the queue any time.');
      if (noAddr || !j.messages.length) send.disabled = true;
      send.addEventListener('click', function () {
        if (!confirm('Queue ' + j.messages.length + ' emails? Each goes on its own from ' + Q.mailbox + ', starting at the next send window.')) return;
        send.disabled = true;
        save('queue', { ids: j.messages.map(function (m) { return m.id; }), tpl: em.tpl }, null).then(function (r) { if (r && r.ok) { em.ticks = {}; em.from = null; em.preview = null; draw(); toast(r.queued + ' emails queued'); } else send.disabled = false; });
      });
      prev.appendChild(send); prev.appendChild(why);
    }
    drawPicks(); refreshCount(); if (em.preview) drawPreview();
    /* what happened */
    var c3 = el('div', 'card'); c3.appendChild(el('h3', null, 'Sent and skipped lately'));
    if (!Q.recent.length) c3.appendChild(el('div', 'soft', 'Nothing sent yet.'));
    Q.recent.forEach(function (r) { var x = el('div', 'rec' + (r.t === 'sendfail' ? ' fail' : '')); x.appendChild(el('b', null, r.t === 'sent' ? 'Sent' : r.t === 'skipped' ? 'Skipped' : 'Not sent')); x.appendChild(document.createTextNode(' ' + r.name + (r.subject ? ': ' + r.subject : ''))); x.appendChild(el('small', null, ' · ' + agoT(r.at) + (r.why ? ' · ' + r.why : ''))); c3.appendChild(x); });
    main.appendChild(c3);
  }

  /* ---- Settings: the address and signature every email carries, the daily cap, the templates ---- */
  /* the look (2026-10-26, Matthew: "assistant peak desk and prospects need to have a dark mode also"): Auto follows the device; Light or
     Dark is the same setting the field app keeps ('sixfold.theme'), so every Traverse page in the hub changes together */
  function lookCard() {
    var c = el('div', 'card look'); c.appendChild(el('h3', null, 'Look'));
    var seg = el('div', 'seg'); c.appendChild(seg);
    c.appendChild(el('p', 'help', 'Auto follows this device. Light or Dark changes the field app, the assistant and the desks too.'));
    var cur = function () { try { var t = localStorage.getItem('sixfold.theme'); return t === 'light' || t === 'dark' ? t : 'auto'; } catch (e) { return 'auto'; } };
    var paint = function () { [].forEach.call(seg.children, function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-look') === cur())); }); };
    [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']].forEach(function (o) {
      var b = el('button', null, o[1]); b.type = 'button'; b.setAttribute('data-look', o[0]);
      b.addEventListener('click', function () { try { if (o[0] === 'auto') localStorage.removeItem('sixfold.theme'); else localStorage.setItem('sixfold.theme', o[0]); } catch (e) {} if (window.__lookApply) window.__lookApply(); paint(); });
      seg.appendChild(b);
    });
    paint(); return c;
  }
  function drawSettings() {
    var D = S.data, set = D.settings;
    head('Settings', 'What every email carries, how many go out a day, and the wording for each trade.');
    main.appendChild(lookCard());
    var c = el('div', 'card'); c.appendChild(el('h3', null, 'Every email')); var f = el('div', 'form'); c.appendChild(f);
    var la = el('label', null, 'Postal address (needed by law in every email; sending stays off without it)'); var ad = el('textarea'); ad.rows = 2; ad.value = set.address; ad.placeholder = 'e.g. Traverse Platforms LLC, PO Box 123, Denver, CO 80202'; la.appendChild(ad); f.appendChild(la);
    var ls = el('label', null, 'Signature'); var sg = el('textarea'); sg.rows = 3; sg.value = set.signature; ls.appendChild(sg); f.appendChild(ls);
    var lc = el('label', null, 'Emails a day, at most (1 to ' + D.capMax + ')'); var cp = el('input'); cp.type = 'number'; cp.min = 1; cp.max = D.capMax; cp.value = set.cap; lc.appendChild(cp); f.appendChild(lc);
    f.appendChild(el('p', 'help', 'Each email ends with the signature, the address, and a line to unsubscribe. Starting at 40 a day keeps a new mailbox out of spam folders; Google lets a Workspace mailbox send far more, but cold email that goes out too fast gets flagged.'));
    var sb = el('button', 'btn small', 'Save'); sb.type = 'button'; sb.setAttribute('data-act', 'savesettings'); sb.addEventListener('click', function () { save('settings', { address: ad.value, signature: sg.value, cap: +cp.value }, 'Saved'); }); f.appendChild(sb);
    main.appendChild(c);
    var help = el('p', 'soft', 'Templates: {company} is the company’s name, {city} its town, {first} the first name of who to ask for (or “there”), {trade} its trade. Each company gets the template for its own trade unless you pick one for everyone.'); main.appendChild(help);
    Object.keys(D.trades).forEach(function (t) {
      var tp = D.templates[t] || { subject: '', body: '' }, k = el('div', 'card'); k.appendChild(el('h3', null, D.trades[t])); var g = el('div', 'form'); k.appendChild(g);
      var su = el('input'); su.value = tp.subject; su.setAttribute('aria-label', D.trades[t] + ' subject'); var bo = el('textarea'); bo.rows = 9; bo.value = tp.body; bo.setAttribute('aria-label', D.trades[t] + ' message');
      g.appendChild(su); g.appendChild(bo);
      var b = el('button', 'btn small', 'Save the ' + D.trades[t] + ' template'); b.type = 'button'; b.setAttribute('data-tpl', t); b.addEventListener('click', function () { save('template', { trade: t, subject: su.value, body: bo.value }, 'Template saved'); }); g.appendChild(b);
      main.appendChild(k);
    });
  }

  var h0 = (location.hash || '').replace('#', ''); if (['list', 'due', 'email', 'settings'].indexOf(h0) >= 0) S.tab = h0;
  load();
})();
