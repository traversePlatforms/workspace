<!DOCTYPE html><html><head><meta charset="utf-8"><title>Print design</title><style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1280px;height:769px;overflow:hidden}
  body{background:#13202F;color:#fff;font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;position:relative}
  .wrap{position:absolute;inset:0;display:grid;grid-template-columns:640px 1fr;align-items:center;padding:0 70px}
  .glow{position:absolute;right:-120px;top:-160px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,#1D2E42 0%,#13202F 70%)}
  .rule{position:absolute;left:70px;right:70px;bottom:64px;height:2px;background:#2C405A}
  .kicker{display:inline-block;font:700 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#F0A63A;margin-bottom:26px}
  h1{font:800 56px/1.08 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;letter-spacing:-.01em}
  h1 span{display:block;white-space:nowrap}
  .sub{margin-top:28px;font:500 28px/1.35 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;color:#9FB0C2;max-width:540px}
  .sig{position:absolute;left:70px;bottom:22px;font:700 20px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;color:#fff;letter-spacing:.02em}
  .sig em{font-style:normal;color:#9FB0C2;font-weight:500;margin-left:12px}
  .art{position:relative;display:flex;justify-content:center;align-items:center;height:100%}
  .card{background:#fff;color:#13202F;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.35);position:relative}
  .lbl{font:700 14px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#7A8796}
  .dom{font:700 24px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;margin:6px 0 18px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-top:1px solid #E6E1D6;font:700 24px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif}
  .pass{background:#E1F3EE;color:#1E7A6C;font:800 18px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;padding:6px 14px;border-radius:999px}
  .foot{margin-top:12px;font:600 16px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;color:#3BA99C}
  .bar{height:12px;border-radius:6px;background:#E3DED3;margin:12px 0;width:100%}
  .logo{width:90px;height:18px;border-radius:5px;background:#fff}
  .btn{display:inline-block;margin-top:20px;background:#F0A63A;color:#13202F;font:800 17px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;padding:12px 22px;border-radius:999px}
  .dot{display:inline-block;width:22px;height:22px;border-radius:50%;background:#D9D3C6}
  .tl{display:inline-block;width:11px;height:11px;border-radius:50%;background:#C9C2B4}
  .qr{width:62px;height:62px;background:conic-gradient(#13202F 25%,#fff 0 50%,#13202F 0 75%,#fff 0) 0 0/16px 16px;border:5px solid #13202F;border-radius:4px}
  .bub{max-width:82%;padding:12px 16px;border-radius:16px;font:500 18px/1.35 'Segoe UI', 'Helvetica Neue', Arial, sans-serif}
  .bub.me{justify-self:end;background:#3BA99C;color:#fff;border-bottom-right-radius:5px}
  .bub.them{justify-self:start;background:#fff;border:1px solid #E1DBCF;border-bottom-left-radius:5px}
  .typing{display:inline-flex;gap:6px}.typing i{width:9px;height:9px;border-radius:50%;background:#B8B1A3}
</style></head><body>
  <div class="glow"></div>
  <div class="wrap">
    <div><div class="kicker">Print design</div><h1><span>Print-ready flyers,</span><span>ads and door hangers</span></h1><div class="sub">Sized to your printer, QR codes tested</div></div>
    <div class="art">
    <div style="position:relative;width:480px;height:430px">
      <div class="card" style="position:absolute;left:10px;top:10px;width:270px;height:350px;transform:rotate(-5deg);padding:22px">
        <div style="height:120px;border-radius:8px;background:linear-gradient(135deg,#3BA99C,#2B7F75)"></div>
        <div class="bar" style="width:80%;height:18px;background:#13202F;margin-top:18px"></div><div class="bar"></div><div class="bar" style="width:70%"></div>
        <div style="display:flex;justify-content:space-between;align-items:end;margin-top:24px"><div class="bar" style="width:90px;height:14px;background:#F0A63A"></div><div class="qr"></div></div>
      </div>
      <div class="card" style="position:absolute;left:250px;top:40px;width:150px;height:360px;transform:rotate(4deg);padding:16px;border-radius:12px">
        <div style="width:56px;height:56px;border-radius:50%;border:8px solid #F6F3EC;background:#1D2E42;margin:0 auto 14px;box-shadow:inset 0 0 0 2px #CFC8BA"></div>
        <div class="bar" style="width:85%;height:14px;background:#13202F;margin:0 auto 10px"></div><div class="bar"></div><div class="bar"></div>
        <div style="height:90px;border-radius:6px;background:#F0A63A;margin-top:16px"></div>
      </div>
      <div class="card" style="position:absolute;left:300px;top:300px;width:180px;height:104px;transform:rotate(-2deg);padding:16px">
        <div class="logo" style="background:#13202F;width:60px"></div><div class="bar" style="width:70%;margin-top:14px"></div><div class="bar" style="width:50%"></div>
      </div>
    </div></div>
  </div>
  <div class="rule"></div><div class="sig">Matthew Sharpe<em>Websites, email setup, print and documents for small businesses</em></div>
</body></html>
