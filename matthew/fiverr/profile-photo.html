<!DOCTYPE html><html><head><meta charset="utf-8"><style>
/* Fiverr profile photo, 800x800, from Matthew's own headshot. The top band is the photo's own top row of pixels stretched,
   so the wall colour continues above his head. */
html,body{margin:0;width:800px;height:800px;overflow:hidden;background:#E4E3DF}
.top{position:absolute;left:0;top:0;width:800px;height:120px;background:url(../../surge/website/source-material/img-originals/people/matthew-sharpe.jpg) -118px 0/1000px 78100px no-repeat}
img.me{position:absolute;left:-118px;top:50px;width:1000px;height:auto;-webkit-mask-image:linear-gradient(transparent 0,#000 40px);mask-image:linear-gradient(transparent 0,#000 40px)}
</style></head><body>
<div class="top"></div>
<img class="me" src="../../surge/website/source-material/img-originals/people/matthew-sharpe.jpg">
</body></html>
