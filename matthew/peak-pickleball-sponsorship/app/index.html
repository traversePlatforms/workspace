<style>
/* Peak Sponsor Desk. 2026-11-17 rebuild: two pipelines (sponsors, expo leads) with the same tools: Today, Pipeline, the lists, tours and deals. */
:root{--onaccent:#fff;--bg:#f4f5f2;--card:#fff;--ink:#1c2420;--soft:#5d6862;--line:#dde2dc;--accent:#1f5b46;--accent2:#e8f1ec;--warn:#a5481c;--ok:#2f7d4f;--chip:#eef1ed;
  --reachB:#e9eff6;--reachF:#2f4b6e;--midB:#e6eefc;--midF:#2b4f8f;--winB:#d9f0e2;--winF:#1d6b3f;--holdB:#fff2d9;--holdF:#8a5a00;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121614;--card:#212925;--ink:#e7ece8;--soft:#9aa69f;--line:#4a5650;--accent:#5fb68f;--accent2:#284035;--onaccent:#0c1a12;--chip:#2d3732;--warn:#e08a5c;--ok:#6cc58f;--reachB:#1f2a36;--reachF:#a9c2e4;--midB:#1e2a40;--midF:#9fbaf0;--winB:#1f3b2a;--winF:#8fdcae;--holdB:#3a2c12;--holdF:#f0c46a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121614;--card:#212925;--ink:#e7ece8;--soft:#9aa69f;--line:#4a5650;--accent:#5fb68f;--accent2:#284035;--onaccent:#0c1a12;--chip:#2d3732;--warn:#e08a5c;--ok:#6cc58f;--reachB:#1f2a36;--reachF:#a9c2e4;--midB:#1e2a40;--midF:#9fbaf0;--winB:#1f3b2a;--winF:#8fdcae;--holdB:#3a2c12;--holdF:#f0c46a;color-scheme:dark}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
button,a,.row{-webkit-tap-highlight-color:rgba(0,0,0,.08)}
button{cursor:pointer} button:disabled{opacity:.55;cursor:default}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px 14px;padding:10px 18px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.01em}.brand small{display:block;font-weight:500;color:var(--soft);font-size:12px}
.world{display:flex;background:var(--chip);border-radius:11px;padding:3px;gap:2px}.world button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:700;color:var(--soft);white-space:nowrap}
.world button[aria-pressed="true"]{background:var(--card);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}.tabs button{border:0;background:none;padding:7px 12px;border-radius:9px;color:var(--soft);font-weight:650}
.tabs button[aria-current="page"]{background:var(--accent2);color:var(--accent)}
.tabs button .tn{font-weight:700;font-size:11.5px;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--soft)}
.tabs button .tn.hot{background:var(--holdB);color:var(--holdF)}
.who{margin-left:auto;color:var(--soft);font-size:13px;display:flex;gap:10px;align-items:center}
.lnk{border:0;background:none;color:var(--accent);font-weight:650;padding:2px 0}
main{max-width:1240px;margin:0 auto;padding:18px}
.ubar{background:var(--holdB);color:var(--holdF);padding:8px 18px;text-align:center;font-size:14px}.ubar button{margin-left:8px}
.signin{max-width:360px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center}
.signin h1{margin:0 0 4px;font-size:22px}.signin p{color:var(--soft);margin:0 0 16px}
.signin input{width:100%;font-size:28px;letter-spacing:.3em;text-align:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.btn{border:0;background:var(--accent);color:var(--onaccent);font-weight:700;padding:10px 16px;border-radius:10px}
.btn.ghost{background:var(--chip);color:var(--ink)}

.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--line);background:var(--card);padding:6px 11px;border-radius:999px;font-size:13.5px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.chips b{font-weight:800;margin-left:4px}
.search{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.sortby{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--soft)}.sortby select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);max-width:100%}

.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}

.row:last-child{border-bottom:0}.row:hover{background:var(--accent2)}.row.on{background:var(--accent2);box-shadow:inset 3px 0 0 var(--accent)}
.sc{font-weight:800;font-size:15px;text-align:center;color:var(--accent)}.sc small{display:block;font-size:10.5px;color:var(--soft);font-weight:600}

.pill.g-hold{background:var(--holdB);color:var(--holdF)}.pill.g-lost{color:var(--soft);text-decoration:line-through}
.pill.pk-a,.pill.o-toured{background:var(--winB);color:var(--winF)}.pill.pk-p{background:var(--holdB);color:var(--holdF)}.pill.pk-i{color:var(--soft)}.pill.o-noshow{color:var(--warn)}
.reach{font-size:13px;color:var(--accent);margin-right:8px;letter-spacing:.05em}
.due{font-size:12px;color:var(--soft);text-align:right}.due.late{color:var(--warn);font-weight:700}
.detail{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;align-self:start;position:sticky;top:120px;max-height:calc(100vh - 136px);overflow:auto}
@media (max-width:999px){.detail{position:fixed;top:0;left:0;right:0;bottom:auto;height:100vh;height:100dvh;max-height:none;overflow-y:auto;border-radius:0;z-index:20;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}}
html.lock,html.lock body{overflow:hidden;overscroll-behavior:none}
.detail h2{margin:0;font-size:20px;padding-right:70px}.detail .sub{color:var(--soft);font-size:13.5px;margin:2px 0 8px}
.strip{display:grid;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0 4px;font-size:14px}
.strip .sr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.strip .k{color:var(--soft);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;min-width:92px}
.strip select{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}

.seg{display:flex;flex-wrap:wrap;gap:5px}.seg button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 9px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}

.touchp{background:var(--accent2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}

.fu input{padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.tnote{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.tprompt{background:var(--card);border:2px solid var(--accent);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:14px}

.ct{display:grid;gap:2px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}.ct:last-child{border-bottom:0}.ct small{color:var(--soft)}

.inl{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
.note{font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line)}.note small{color:var(--soft);display:block}
.tl{display:grid;gap:0}.tli{display:grid;grid-template-columns:10px minmax(0,1fr);gap:9px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.tli:last-child{border-bottom:0}.tli i{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--line)}.tli.t i{background:var(--accent)}.tli.s i{background:var(--midF)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px}

.info{max-width:860px}.info h3{margin-bottom:6px}.info>p.soft,.info .soft{color:var(--soft);margin:0 0 8px}
.irow{border-top:1px solid var(--line);padding:9px 0}.irow:first-of-type{border-top:0}.irow small.src{display:block;margin-top:3px;overflow-wrap:anywhere}
.info table,table.tb{width:100%;border-collapse:collapse;font-size:14px}.info th,.info td,.tb th,.tb td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}.info th,.tb th{color:var(--soft);font-weight:650}
.tb td.n,.tb th.n{text-align:right;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:0 0 14px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;font-size:14px;display:flex;gap:14px;align-items:center;max-width:92vw}
.toast button{border:0;background:none;color:var(--accent2);font-weight:800;text-decoration:underline;padding:0}
.close{float:right}
.pkrow{display:grid;grid-template-columns:minmax(0,1fr) 110px 80px 34px;gap:6px;align-items:center;margin:0 0 6px}
.pkrow input{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0}
/* Today */
.today h2,.blk h2{font-size:16px;margin:0}
.blk{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 14px;overflow:hidden}
.blk>.bh{display:flex;align-items:baseline;gap:10px;padding:12px 14px 10px;border-bottom:1px solid var(--line)}.blk>.bh span{color:var(--soft);font-size:13px}.blk>.bh .lnk{margin-left:auto;font-size:13.5px}

.bempty{color:var(--soft);font-size:13px;padding:6px 4px}

.warnline{color:var(--warn);font-weight:650}

.paper{background:#fff;color:#111;max-width:820px;margin:0 auto;padding:40px 46px;border-radius:6px;box-shadow:0 1px 6px rgba(0,0,0,.08);font:11pt/1.45 Arial,Helvetica,sans-serif}
