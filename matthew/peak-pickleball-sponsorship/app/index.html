<style>
/* Peak Sponsor Desk. 2026-11-17 rebuild: two pipelines (sponsors, expo leads) with the same tools: Today, Pipeline, the lists, tours and deals.
   2026-11-18 facelift, Matthew's pick "Night Session" (design/mockups-2026-11-18/peak-desk.html, direction B): dark first, Peak cyan for the
   Sponsors and orange for the Expo leads glowing on the active tab and the main buttons, each stage a colour shown as a bright edge, late rows
   with a red edge. Light mode is direction A "Clubhouse" (charcoal bar with the accent stripe, white cards, tinted section heads). Every text
   colour is checked to 4.5:1 or better (the h-* tones come from the mockup's own contrast maths; the desk test measures the screens). */
@font-face{font-family:"Golos Text";font-style:normal;font-weight:400 900;font-display:swap;src:url(fonts/golos-text.woff2) format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/inter.woff2) format("woff2")}
:root{--bg:#0f0f0e;--card:#1a1a18;--ink:#f3f3ef;--soft:#a3a39d;--line:#2a2a27;--chip:#22221f;--col:#151514;
  --hdr:#0f0f0e;--hdrInk:#fff;--navInk:#b9b9b3;--wbg:#1d1d1b;--wInk:#b9b9b3;--wOn:var(--acc);--wOnInk:#0b0b0a;
  --acc:#17a9cd;--accInk:#17a9cd;--btnBg:var(--acc);--btnInk:#0b0b0a;--onaccent:#0b0b0a;
  --accent:var(--accInk);--accent2:color-mix(in srgb,var(--acc) 15%,var(--card));
  --warn:#f48080;--lateC:#ef4444;--ok:#2bc764;--holdB:#4a3715;--holdF:#f59e0b;--glow:.18;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--disp:"Golos Text",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
:root[data-world="expo"]{--acc:#e6781d;--accInk:#e6781d}
:root[data-theme="light"]{--bg:#f4f5f6;--card:#fff;--ink:#292823;--soft:#5f6166;--line:#e6e7e9;--chip:#f3f4f5;--col:#eceef0;
  --hdr:#292823;--hdrInk:#fff;--navInk:#d9d9d5;--wbg:#ffffff14;--wInk:#d6d6d3;--wOn:#fff;--wOnInk:#292823;
  --accInk:#0f6c83;--btnBg:#0f6c83;--btnInk:#fff;--onaccent:#fff;--accent2:color-mix(in srgb,var(--acc) 11%,#fff);
  --warn:#ac3131;--ok:#147237;--holdB:#fef1dd;--holdF:#895806;--glow:0;color-scheme:light}
:root[data-theme="light"][data-world="expo"]{--accInk:#984f13;--btnBg:#984f13}
/* the stage and touch tones: --c the bright edge, --t a tinted fill, --k text on the fill or a card, --d a fill that carries white */
.h-slate{--c:#64748b;--t:#2a2e31;--k:#99a3b2;--d:#64748b}.h-blue{--c:#3b82f6;--t:#213149;--k:#72a5f9;--d:#3472d8}.h-indigo{--c:#6366f1;--t:#2a2b48;--k:#9597f5;--d:#6164ec}
.h-violet{--c:#8b5cf6;--t:#332949;--k:#b090f9;--d:#8356e7}.h-teal{--c:#14b8a6;--t:#193d37;--k:#2cbfaf;--d:#0e8174}.h-amber{--c:#f59e0b;--t:#4a3715;--k:#f59e0b;--d:#a26807}
.h-pink{--c:#ec4899;--t:#482434;--k:#f17bb6;--d:#cb3e84}.h-green{--c:#22c55e;--t:#1c4027;--k:#2bc764;--d:#178640}.h-stone{--c:#a8a29e;--t:#393835;--k:#b2adaa;--d:#76716f}
.h-red{--c:#ef4444;--t:#492322;--k:#f48080;--d:#d23c3c}.h-cyan{--c:#17a9cd;--t:#193940;--k:#3cb7d5;--d:#117d98}.h-orange{--c:#e6781d;--t:#472f19;--k:#eb934a;--d:#b35e17}
:root[data-theme="light"] .h-slate{--t:#e9ecef;--k:#546175}:root[data-theme="light"] .h-blue{--t:#e4eefe;--k:#2a5eb1}:root[data-theme="light"] .h-indigo{--t:#e9eafd;--k:#4f52c1}
:root[data-theme="light"] .h-violet{--t:#efe8fe;--k:#6c48c0}:root[data-theme="light"] .h-teal{--t:#def5f3;--k:#0c6e64}:root[data-theme="light"] .h-amber{--t:#fef1dd;--k:#895806}
:root[data-theme="light"] .h-pink{--t:#fce5f1;--k:#a5326b}:root[data-theme="light"] .h-green{--t:#e0f7e8;--k:#147237}:root[data-theme="light"] .h-stone{--t:#f3f2f1;--k:#686462}
:root[data-theme="light"] .h-red{--t:#fde5e5;--k:#ac3131}:root[data-theme="light"] .h-cyan{--t:#dff3f8;--k:#0f6c83}:root[data-theme="light"] .h-orange{--t:#fcecdf;--k:#984f13}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--chip);border:1px solid var(--line);color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--soft);opacity:1}
a{color:var(--accInk)}
button,a,.row{-webkit-tap-highlight-color:rgba(0,0,0,.08)}
button{cursor:pointer} button:disabled{opacity:.55;cursor:default}
h1,h2,h3,.disp{font-family:var(--disp)}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
/* the bar */
.bar{position:sticky;top:0;z-index:15;background:var(--hdr);color:var(--hdrInk);border-bottom:1px solid #ffffff12;display:flex;align-items:center;gap:8px 18px;padding:0 22px;min-height:64px;flex-wrap:wrap}
:root[data-theme="light"] .bar{border-bottom:0;box-shadow:inset 0 -4px 0 var(--acc);padding-bottom:4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-family:var(--disp);font-size:16px;white-space:nowrap}.brand small{display:block;font:500 11.5px var(--sans);opacity:.75}
.brand .mk{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;border:2px solid var(--acc);color:var(--acc);box-shadow:0 0 18px color-mix(in srgb,var(--acc) 45%,transparent);flex:none}
:root[data-theme="light"] .brand .mk{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:none}
.brand .mk svg{width:22px;height:22px;fill:currentColor;stroke:none}
.world{display:flex;background:var(--wbg);border-radius:11px;padding:3px;gap:3px}
.world button{border:0;background:none;padding:7px 13px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--wInk);white-space:nowrap;display:flex;align-items:center;gap:7px}
.world button i{width:9px;height:9px;border-radius:50%;background:#17a9cd}.world button[data-world="expo"] i{background:#e6781d}
.world button[aria-pressed="true"]{background:var(--wOn);color:var(--wOnInk);box-shadow:0 1px 3px #0003}
:root:not([data-theme="light"]) .world button[aria-pressed="true"] i{background:#0b0b0a}
.tabs{display:flex;gap:2px;flex-wrap:wrap;align-self:stretch}
.tabs button{border:0;background:none;padding:0 13px;color:var(--navInk);font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px;white-space:nowrap;border-radius:0}
.tabs button svg.i{display:none}
.tabs button[aria-current="page"]{color:#fff;box-shadow:inset 0 -3px 0 var(--acc)}
:root[data-theme="light"] .tabs button{margin:12px 0;border-radius:9px;padding:6px 13px}
:root[data-theme="light"] .tabs button[aria-current="page"]{background:#ffffff1c;box-shadow:none}
.tabs button .tn{font:600 11px var(--sans);padding:1px 7px;border-radius:9px;background:#ffffff1f;color:#eeeeea}
.tabs button .tn.hot{background:#d23c3c;color:#fff}
.who{margin-left:auto;color:var(--navInk);font-size:13px;display:flex;gap:10px;align-items:center}
.who .av{box-shadow:none}
.lookbtn{border:1px solid #ffffff2a;background:none;color:var(--hdrInk);border-radius:9px;width:34px;height:34px;display:grid;place-items:center;padding:0}
.lnk{border:0;background:none;color:var(--accInk);font-weight:650;padding:2px 0}
.bar .lnk{color:var(--hdrInk);opacity:.85}
main{max-width:1440px;margin:0 auto;padding:22px 26px 40px}
.ubar{background:var(--holdB);color:var(--holdF);padding:8px 18px;text-align:center;font-size:14px}.ubar button{margin-left:8px}
.signin{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;text-align:center;box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 25%,transparent),0 0 40px color-mix(in srgb,var(--acc) calc(var(--glow)*100%),transparent)}
.signin h1{margin:0 0 4px;font-size:24px;font-weight:800}.signin p{color:var(--soft);margin:0 0 16px}
.signin .mk{margin:0 auto 12px}
.signin input{width:100%;font-size:28px;letter-spacing:.3em;text-align:center;padding:10px;border-radius:12px;background:var(--bg)}
.btn{border:0;background:var(--btnBg);color:var(--btnInk);font-weight:700;padding:10px 16px;border-radius:10px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.ghost{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13.5px}
a.btn.off{pointer-events:none;opacity:.45}
.err{color:var(--warn);min-height:1.3em;margin:8px 0 0;font-size:14px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink)}
.chips button[aria-pressed="true"]{background:var(--btnBg);border-color:var(--btnBg);color:var(--btnInk)}
.chips b{font-weight:800;margin-left:5px}
.search{flex:1;min-width:200px;padding:9px 12px;border-radius:10px;background:var(--card)}
.sortby{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--soft)}.sortby select{padding:8px 10px;border-radius:10px;background:var(--card);max-width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:1000px){.split.open{grid-template-columns:minmax(0,1fr) minmax(440px,540px)}}
/* lists and rows: a row whose follow-up is late gets a red left edge */
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 16px 11px 13px;border:0;border-bottom:1px solid var(--line);border-left:3px solid transparent;cursor:pointer;background:none;width:100%;text-align:left;color:var(--ink)}
.row:last-child{border-bottom:0}.row:hover{background:var(--accent2)}.row.on{background:var(--accent2);border-left-color:var(--acc)}
.row.late{border-left-color:var(--lateC)}
.sc{font:800 18px/1 var(--disp);text-align:center;color:var(--accInk)}.sc small{display:block;font:600 9.5px var(--sans);color:var(--soft);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.nm{min-width:0}.nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 14.5px var(--disp)}.nm small{color:var(--soft);display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm .lc{font-size:12.5px;color:var(--soft);display:flex;align-items:center;gap:6px;margin-top:3px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tch{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--k);white-space:nowrap;flex:none}
.tch .ti,.ico{width:20px;height:20px;border-radius:6px;display:inline-grid;place-items:center;background:var(--t);color:var(--k);flex:none}
.tch .ti svg.i,.ico svg.i{width:12px;height:12px;stroke-width:2.2}
.rgt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right}.rgt .ln{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font:700 10px var(--sans);color:#fff;flex:none;letter-spacing:.02em;box-shadow:0 0 0 2px var(--card)}
.av.lg{width:30px;height:30px;font-size:11.5px}
.av.none{background:transparent!important;border:1.5px dashed var(--soft);color:var(--soft);box-shadow:none}
.own{display:inline-block;font-size:11.5px;font-weight:700;padding:0 7px;border-radius:999px;background:var(--chip);color:var(--soft);margin-right:6px}
.own.me{background:var(--accent2);color:var(--accInk)}.own.open{background:none;border:1px dashed var(--line)}
.pill{font:700 12px var(--sans);padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill[class*="h-"]{background:var(--t);color:var(--k)}.pill i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.pill.g-lost{text-decoration:line-through}
.pill.pk-a,.pill.o-toured{background:#1c4027;color:#2bc764}.pill.pk-p{background:var(--holdB);color:var(--holdF)}.pill.pk-i{color:var(--soft)}.pill.o-noshow{color:var(--warn)}
:root[data-theme="light"] .pill.pk-a,:root[data-theme="light"] .pill.o-toured{background:#e0f7e8;color:#147237}
.reach{font-size:13px;color:var(--soft);letter-spacing:.05em}
.due{font:700 12px var(--sans);color:var(--soft);text-align:right;white-space:nowrap}.due.late{color:var(--warn)}.due.today{color:var(--accInk)}
.trytag{font:700 11px var(--sans);padding:1px 7px;border-radius:6px;background:var(--holdB);color:var(--holdF);white-space:nowrap}
/* the company card */
.detail{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;align-self:start;position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:999px){.detail{position:fixed;top:0;left:0;right:0;bottom:auto;height:100vh;height:100dvh;max-height:none;overflow-y:auto;border-radius:0;border:0;z-index:30;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}}
html.lock,html.lock body{overflow:hidden;overscroll-behavior:none}
.detail h2{margin:0;font-size:23px;font-weight:800;letter-spacing:-.01em;line-height:1.15;padding-right:70px}.detail .sub{color:var(--soft);font-size:13px;margin:3px 0 8px}
.strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0 4px;font-size:13.5px}
.strip .sr{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap;background:var(--chip);border-radius:12px;padding:10px 12px;min-width:0;align-content:flex-start}
.strip .k{display:block;width:100%;color:var(--soft);font:700 10.5px var(--sans);text-transform:uppercase;letter-spacing:.08em}
.strip select{padding:5px 8px;border-radius:8px;background:var(--card);max-width:100%}
.strip .late{color:var(--warn);font-weight:700}
.sec{border-top:1px solid var(--line);padding:14px 0 4px;margin-top:12px}.sec h3{margin:0 0 9px;font:800 11px var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--soft)}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--btnBg);border-color:var(--btnBg);color:var(--btnInk)}
.stagesec .seg button[class*="h-"] i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.stagesec .seg button[class*="h-"][aria-pressed="true"]{background:var(--d);border-color:var(--d);color:#fff}
.stagesec .seg button[class*="h-"][aria-pressed="true"] i{background:#fff}
/* log a touch (Sixfold's call tries) */
.touchp{background:var(--chip);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);border-radius:14px;padding:14px;margin-top:14px}
:root[data-theme="light"] .touchp{background:color-mix(in srgb,var(--acc) 7%,#fff);border-color:color-mix(in srgb,var(--acc) 30%,#fff)}
.touchp h3{color:var(--accInk);margin-bottom:10px;font-size:12.5px}
.qb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.qb button{border:1px solid color-mix(in srgb,var(--c,var(--line)) 40%,transparent);background:var(--t,var(--card));color:var(--k,var(--ink));border-radius:11px;padding:10px 8px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.qb button .ico{background:var(--c);color:#0b0b0a;width:24px;height:24px;border-radius:7px}
:root[data-theme="light"] .qb button{background:var(--card);border:1.5px solid var(--t)}
:root[data-theme="light"] .qb button .ico{background:var(--d);color:#fff}
.qb button:hover{filter:brightness(1.12)}.qb button.more{background:var(--card);color:var(--ink);border-color:var(--line)}
.qb button.more .ico,:root[data-theme="light"] .qb button.more .ico{background:var(--chip);color:var(--ink)}
.fu{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:13px}.fu>span{font-weight:650;margin-right:2px}
.fu button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600}.fu button[aria-pressed="true"]{background:var(--btnBg);border-color:var(--btnBg);color:var(--btnInk)}
.fu input{padding:4px 6px;border-radius:8px;background:var(--card)}
.fuhint{font-size:12.5px;color:var(--soft);margin-top:6px}
.tnote{width:100%;padding:10px 12px;border-radius:10px;background:var(--card)}
.tprompt{background:var(--card);border:2px solid var(--acc);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:14px}
.tprompt .seg{margin-top:6px}
.tries,.trynum{background:var(--holdB);color:var(--holdF);border-radius:9px;padding:8px 11px;font-size:13.5px;margin-bottom:8px}
.trynum{font-weight:700;display:inline-block;padding:4px 10px}
.tries4{border:1.5px solid var(--lateC);background:color-mix(in srgb,var(--lateC) 12%,var(--card));color:var(--ink);border-radius:12px;padding:11px 12px;margin-bottom:10px;font-size:14px}
.tries4 b{color:var(--warn)}.tries4 .seg{margin-top:8px}
.ct{display:grid;gap:2px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}.ct:last-child{border-bottom:0}.ct small{color:var(--soft)}
.ct a{color:var(--accInk);word-break:break-all}.ct .links{display:flex;gap:12px;flex-wrap:wrap}
.ct.dnc>div:first-child b{color:var(--soft)}
.cacts{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;margin-top:2px}.cacts .lnk{font-size:12.5px;display:inline-flex;align-items:center;gap:4px;margin:0!important}.cacts .lnk svg.i{width:13px;height:13px}
.cform{margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}.cform .lab{display:grid;gap:3px;font-size:12.5px;color:var(--soft)}.cform .lab input{color:var(--ink)}.tli .chg{overflow-wrap:anywhere}
