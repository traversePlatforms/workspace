<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Peak Sponsor Desk</title>
<meta name="theme-color" content="#1f5b46">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Peak Desk"><meta name="mobile-web-app-capable" content="yes">
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});   /* only so it installs as an app (2026-10-22); it keeps nothing */</script>
<style>
/* Peak Sponsor Desk (2026-10-21): the sponsor leads, tours, proposals and a report for Brandon. */
:root{--onaccent:#fff;--bg:#f4f5f2;--card:#fff;--ink:#1c2420;--soft:#5d6862;--line:#dde2dc;--accent:#1f5b46;--accent2:#e8f1ec;--warn:#a5481c;--ok:#2f7d4f;--chip:#eef1ed;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121614;--card:#1b211e;--ink:#e7ece8;--soft:#9aa69f;--line:#2c3430;--accent:#5fb68f;--accent2:#1f2c26;--onaccent:#0c1a12;--chip:#232b27;--warn:#e08a5c;--ok:#6cc58f}}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}   /* default link blue was unreadable on the dark background (2026-10-21) */
button,a,.row{-webkit-tap-highlight-color:rgba(0,0,0,.08)}
button{cursor:pointer}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.01em}.brand small{display:block;font-weight:500;color:var(--soft);font-size:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}.tabs button{border:0;background:none;padding:7px 12px;border-radius:9px;color:var(--soft);font-weight:650}
.tabs button[aria-current="page"]{background:var(--accent2);color:var(--accent)}
.who{margin-left:auto;color:var(--soft);font-size:13px;display:flex;gap:10px;align-items:center}
.lnk{border:0;background:none;color:var(--accent);font-weight:650;padding:2px 0}
main{max-width:1180px;margin:0 auto;padding:18px}
.signin{max-width:360px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center}
.signin h1{margin:0 0 4px;font-size:22px}.signin p{color:var(--soft);margin:0 0 16px}
.signin input{width:100%;font-size:28px;letter-spacing:.3em;text-align:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.btn{border:0;background:var(--accent);color:var(--onaccent);font-weight:700;padding:10px 16px;border-radius:10px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.small{padding:6px 11px;font-size:13.5px}
.err{color:var(--warn);min-height:1.3em;margin:8px 0 0;font-size:14px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--line);background:var(--card);padding:6px 11px;border-radius:999px;font-size:13.5px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.chips b{font-weight:800;margin-left:4px}
.search{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:1000px){.split.open{grid-template-columns:minmax(0,1fr) 440px}}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.row:last-child{border-bottom:0}.row:hover{background:var(--accent2)}.row.on{background:var(--accent2);box-shadow:inset 3px 0 0 var(--accent)}
.sc{font-weight:800;font-size:15px;text-align:center;color:var(--accent)}.sc small{display:block;font-size:10.5px;color:var(--soft);font-weight:600}
.nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nm small{color:var(--soft)}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--chip);white-space:nowrap}
.pill.s-signed{background:#d9f0e2;color:#1d6b3f}.pill.s-proposal,.pill.s-tour,.pill.s-toured{background:#e6eefc;color:#2b4f8f}.pill.s-no,.pill.s-notnow{color:var(--soft)}
@media (prefers-color-scheme:dark){.pill.s-signed{background:#1f3b2a;color:#8fdcae}.pill.s-proposal,.pill.s-tour,.pill.s-toured{background:#1e2a40;color:#9fbaf0}}
.callhow{background:var(--accent2);border-radius:9px;padding:8px 10px;margin:0 0 8px;font-size:14px}.callhow a{color:var(--accent);font-weight:700;white-space:nowrap}
.reach{font-size:13px;color:var(--accent);margin-right:8px;letter-spacing:.05em}
.due{font-size:12px;color:var(--soft);text-align:right}.due.late{color:var(--warn);font-weight:700}
.detail{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;align-self:start;position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}
@media (max-width:999px){.detail{position:fixed;top:0;left:0;right:0;bottom:auto;height:100vh;height:100dvh;max-height:none;overflow-y:auto;border-radius:0;z-index:20;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}}   /* its own screen-tall box that scrolls inside (2026-10-21) */
html.lock,html.lock body{overflow:hidden;overscroll-behavior:none}   /* a company open on a phone: the list behind does not scroll (2026-10-21) */
.detail h2{margin:0;font-size:19px}.detail .sub{color:var(--soft);font-size:13.5px;margin:2px 0 10px}
.sec{border-top:1px solid var(--line);padding:12px 0 4px;margin-top:10px}.sec h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}
.seg{display:flex;flex-wrap:wrap;gap:5px}.seg button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 9px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.ct{display:grid;gap:2px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}.ct:last-child{border-bottom:0}.ct small{color:var(--soft)}
.ct a{color:var(--accent);word-break:break-all}
.form{display:grid;gap:7px}.form input,.form textarea,.form select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.note{font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line)}.note small{color:var(--soft);display:block}
.empty{padding:28px;text-align:center;color:var(--soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px}
.card h3{margin:0 0 2px;font-size:16px}.card small{color:var(--soft)}
.info{max-width:860px}.info h3{margin-bottom:6px}.info>p.soft,.info .soft{color:var(--soft);margin:0 0 8px}
.irow{border-top:1px solid var(--line);padding:9px 0}.irow:first-of-type{border-top:0}.irow small.src{display:block;margin-top:3px;overflow-wrap:anywhere}
.info table{width:100%;border-collapse:collapse;font-size:14px}.info th,.info td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}.info th{color:var(--soft);font-weight:650}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.kpi b{display:block;font-size:22px}.kpi span{color:var(--soft);font-size:13px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;font-size:14px}
.close{float:right}
.pkrow{display:grid;grid-template-columns:minmax(0,1fr) 110px 80px 34px;gap:6px;align-items:center;margin:0 0 6px}
.pkrow input{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0}
/* the print pages: a proposal or the report, saved as PDF from the browser */
.paper{background:#fff;color:#111;max-width:820px;margin:0 auto;padding:40px 46px;border-radius:6px;box-shadow:0 1px 6px rgba(0,0,0,.08);font:11pt/1.45 Arial,Helvetica,sans-serif}
.paper h1{font-size:22pt;margin:0 0 4px}.paper .k{color:#1f5b46;font:700 8.5pt Arial;letter-spacing:.1em;text-transform:uppercase}
.paper table{width:100%;border-collapse:collapse;margin:10px 0}.paper th,.paper td{border-bottom:1px solid #d8ddd8;padding:6px 7px;text-align:left;vertical-align:top}
.paper th{background:#1f5b46;color:#fff;font-size:9pt}.paper td.n,.paper th.n{text-align:right;white-space:nowrap}.paper .tot td{font-weight:700;border-top:2px solid #111}
.paper h2{font-size:13pt;margin:18px 0 6px;border-bottom:2px solid #1f5b46;padding-bottom:3px}.paper small,.paper .soft{color:#666}
.printbar{max-width:820px;margin:0 auto 12px;display:flex;gap:10px}
/* on a phone (2026-10-21, Matthew: "how well does this read on mobile"): one swipe row of tabs and of filters, names on two lines,
   a narrower paper for the proposal and report */
@media (max-width:640px){
  .bar{padding:8px 12px;gap:4px 10px}.brand small{display:none}.who{font-size:12px}
  .tabs{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:none;padding:6px 10px}
  main{padding:12px}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}.chips button{flex:none}
  .controls .search{min-width:0}
  .row{grid-template-columns:34px minmax(0,1fr) auto;gap:8px;padding:10px}
  .nm b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
  .pill{font-size:11px;padding:2px 7px}.reach{display:block;margin:0 0 3px;text-align:right}
  .detail{padding:14px 14px 28px}
  .paper{padding:20px 16px;font-size:10.5pt}.paper h1{font-size:18pt}.paper th,.paper td{padding:5px 4px}
}
.tw{overflow-x:auto}
/* 2026-10-24 (Matthew's list): the board, look-ups, signed sponsors, tours, profit and loss */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.bcol{background:var(--chip);border-radius:12px;padding:8px;min-height:120px;min-width:0}
.bhead{display:flex;justify-content:space-between;gap:6px;align-items:baseline;padding:2px 4px 8px;font-size:13.5px}.bhead span{color:var(--soft);font-size:12.5px;white-space:nowrap}
.bcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin:0 0 7px;cursor:pointer}
.bcard:hover{border-color:var(--accent)}.bcard.on{box-shadow:inset 3px 0 0 var(--accent)}
.bcard b{display:block;line-height:1.25}.bcard small{color:var(--soft);display:block;margin-top:2px}.bcard .due{text-align:left}
.bcard select{margin-top:7px;width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font-size:13px}
.bempty{color:var(--soft);font-size:13px;padding:6px 4px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto}
.sheet{background:var(--card);border-radius:14px;max-width:520px;width:100%;padding:18px}.sheet h2{margin:0 0 10px;font-size:19px}
.sheet label.lab{font-size:12.5px;color:var(--soft);font-weight:650;display:block}
.todo{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:14px}.todo.done span{text-decoration:line-through;color:var(--soft)}.todo input{width:auto}.todo span{flex:1}
.found .it{padding:3px 0;font-size:14px;overflow-wrap:anywhere}.found small{color:var(--soft)}.found h4{margin:8px 0 2px;font-size:12.5px;color:var(--soft)}
.warnline{color:var(--warn);font-weight:650}
.card>.ct{border-bottom:0}
.newinfo{font-size:11px;font-weight:700;color:var(--accent);margin-right:6px}
.daygrp{margin:14px 0 6px;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);font-weight:700}
.pill.o-noshow{color:var(--warn)}.pill.o-toured{background:#d9f0e2;color:#1d6b3f}
@media (prefers-color-scheme:dark){.pill.o-toured{background:#1f3b2a;color:#8fdcae}}
/* Peak's own sponsor standing (2026-10-25) */
.pill.pk-a{background:#d9f0e2;color:#1d6b3f}.pill.pk-p{background:#fff2d9;color:#8a5a00}.pill.pk-i{color:var(--soft)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;margin:8px 0 0;font-size:14px}.kv dt{color:var(--soft)}.kv dd{margin:0;overflow-wrap:anywhere}
.chk{background:#fff2d9;color:#8a5a00;padding:6px 9px;border-radius:8px;margin-top:8px;font-size:14px}
@media (prefers-color-scheme:dark){.pill.pk-a{background:#1f3b2a;color:#8fdcae}.pill.pk-p,.chk{background:#3a2c12;color:#f0c46a}}
.plrow,.rnrow{display:grid;gap:6px;align-items:center;margin:0 0 6px}
.plrow{grid-template-columns:minmax(0,1.6fr) 96px 92px 96px 92px minmax(0,1.1fr) 34px}.rnrow{grid-template-columns:minmax(0,1fr) 110px 100px 34px}
.plrow input,.plrow select,.rnrow input,.rnrow select{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0;width:100%}
.plhead{font-size:12px;color:var(--soft);font-weight:650}.plm{font-size:13.5px}.plm.neg{color:var(--warn)}
.numbers td.n{text-align:right;white-space:nowrap}.numbers tr.tot td{font-weight:800;border-top:2px solid var(--ink)}
@media (max-width:640px){
  .board{grid-auto-columns:78vw}
  .plrow{grid-template-columns:1fr 1fr;padding:8px 0;border-bottom:1px dashed var(--line)}.plrow .nmc{grid-column:1/-1}.plhead{display:none}
  .rnrow{grid-template-columns:1fr 90px 80px 30px}
}
@media print{@page{size:letter;margin:.5in} html,body{background:#fff!important} .bar,.printbar,.toast{display:none!important} main{padding:0;max-width:none} .paper{box-shadow:none;padding:0;max-width:none}}
</style>
</head>
<body>
<div class="bar" id="bar" hidden>
  <div class="brand">Peak Sponsor Desk<small>Peak Pickleball · corporate sponsors</small></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="who"><span id="whoName"></span><button class="lnk" id="signout" type="button">Sign out</button></div>
</div>
<main id="main"></main>
<div class="toast" id="toast" hidden></div>
<script>
(function () {
  'use strict';
  var API = 'api/desk.php';
  var S = { data: null, tab: 'pipe', list: 'new', st: 'all', q: '', sel: null, sort: 'reach', view: 'list', due: false };
  /* everyone known at a company: the seed's contacts, ones we added, and Hunter's when someone asked (2026-10-24) */
  var peopleOf = function (l) { var h = (l.scan && l.scan.hunter && l.scan.hunter.people) || []; return (l.contacts || []).concat(l.added || [], h); };
  var found = function (l, k) { return (l.scan && l.scan.ok && l.scan[k]) || []; };   /* what their website shows */
  /* can Brandon reach them: an email and a phone first (2026-10-21, Matthew: "have the places we have email and numbers") */
  var hasMail = function (l) { return peopleOf(l).some(function (c) { return c.email; }) || found(l, 'emails').length > 0; };
  var hasPhone = function (l) { return !!l.phone || peopleOf(l).some(function (c) { return c.phone; }) || found(l, 'phones').length > 0; };
  var milesOf = function (l) { return l.miles != null ? l.miles : (l.scan && l.scan.miles != null ? l.scan.miles : null); };
  var LISTNAME = { 'new': 'New lead', renew: 'Peak sponsor', local: 'Local business', added: 'Added by us' };
  /* money a year: lines priced a month count 12 times, a week 52, anything else once (2026-10-24) */
  var perYear = function (per) { per = String(per || '').toLowerCase(); return /month/.test(per) ? 12 : /week/.test(per) ? 52 : 1; };
  var yearlyOf = function (lines) { return (lines || []).reduce(function (n, x) { return n + x.price * x.qty * perYear(x.per); }, 0); };
  var lastProp = function (l) { return S.data.proposals.filter(function (p) { return p.lead === l.id; }).sort(function (a, b) { return b.at - a.at; })[0]; };
  var dealLines = function (l) { return l.signed && l.signed.lines.length ? l.signed.lines : ((lastProp(l) || {}).lines || []); };
  var leadValue = function (l) { return yearlyOf(dealLines(l)); };
  var fmtYear = function (iso) { var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); };   /* signed and renewal dates: a year apart */
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var addMonths = function (iso, m) { var p = iso.split('-'), d = new Date(+p[0], +p[1] - 1 + m, +p[2]); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var daysTo = function (iso) { var p = iso.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]), t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((d - t) / 86400000); };
  var isDue = function (l) { return l.next && l.next.date && l.next.date <= today() && ['signed', 'no'].indexOf(l.status) < 0; };
  var newInfo = function (l) { var c = (l.scan && l.scan.changes) || []; return c.length && c[c.length - 1].at > Date.now() / 1000 - 7 * 86400; };
  var reach = function (l) { return (hasMail(l) ? 1 : 0) + (hasPhone(l) ? 1 : 0); };
  /* Peak's own record of a sponsor, the live one first (2026-10-25, Nneka's tracker) */
  var pkOf = function (l) { return (l.peak && l.peak[0]) || null; };
  var pkShort = function (s) { s = String(s || '').toLowerCase(); return s.indexOf('active') === 0 ? 'Active' : s.indexOf('pending') === 0 ? 'Pending' : 'Inactive'; };
  var pkCls = function (s) { return { Active: 'pk-a', Pending: 'pk-p', Inactive: 'pk-i' }[pkShort(s)]; };
  var pkRank = function (l) { var p = pkOf(l); return !p ? 3 : { Active: 0, Pending: 1, Inactive: 2 }[pkShort(p.status)]; };
  var fmtD = function (s) { return /^\d{4}-\d{2}-\d{2}$/.test(s) ? fmtYear(s) : s; };
  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  var main = $('main');
  function api(action, body) {
    return fetch(API + '?action=' + action, { method: body ? 'POST' : 'GET', credentials: 'same-origin', headers: body ? { 'Content-Type': 'application/json', 'X-Desk': '1' } : {}, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j._status = r.status; return j; }); });
  }
  var tT; function toast(t) { var e = $('toast'); e.textContent = t; e.hidden = false; clearTimeout(tT); tT = setTimeout(function () { e.hidden = true; }, 2600); }
  var money = function (n) { return '$' + Number(n || 0).toLocaleString('en-US'); };
  var today = function () { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  var fmtDay = function (iso) { if (!iso) return ''; var p = iso.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]); return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); };
  var fmtTime = function (t) { if (!t) return ''; var h = +t.slice(0, 2), m = t.slice(3); return ((h + 11) % 12 + 1) + ':' + m + (h < 12 ? ' am' : ' pm'); };
  var ago = function (ts) { var d = new Date(ts * 1000); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
  var LISTS = [['new', 'New leads'], ['renew', 'Peak sponsors'], ['local', 'Local businesses'], ['added', 'Added by us']];

  /* ---- sign-in ---- */
  function signin(msg) {
    $('bar').hidden = true; main.textContent = '';
    var b = el('form', 'signin'); b.appendChild(el('h1', null, 'Peak Sponsor Desk')); b.appendChild(el('p', null, 'Enter your 6-digit code'));
    var i = el('input'); i.inputMode = 'numeric'; i.maxLength = 6; i.autocomplete = 'one-time-code'; i.setAttribute('aria-label', 'Your code'); b.appendChild(i);

    var ar = el('button', 'lnk', '+ Add a cost'); ar.type = 'button'; ar.addEventListener('click', function () { var x = { name: '', amount: 0, per: 'month' }; M.running.push(x); rRow(x); }); c2.appendChild(ar);
    main.appendChild(c2);
    var sv = el('button', 'btn', 'Save'); sv.type = 'button'; sv.style.marginBottom = '14px';
    sv.addEventListener('click', function () { save('pl', { services: M.services.map(function (x) { return { name: x.name, price: x.price, per: x.per, cost: x.cost, costPer: x.costPer }; }), running: M.running }, 'Saved'); });
    main.appendChild(sv);
    /* the numbers */
    var c3 = el('div', 'card numbers info'); main.appendChild(c3);
    function calc() {
      M.services.forEach(function (x) {
        if (!x._mg) return; var ch = yr(x.price, x.per), co = yr(x.cost, x.costPer);
        x._mg.className = 'plm'; x._mg.textContent = x.cost == null || x.price == null ? 'add the cost' : money(ch - co) + ' a year' + (ch ? ' (' + Math.round((ch - co) / ch * 100) + '%)' : '');
        if (x.cost != null && x.price != null && ch - co < 0) x._mg.className = 'plm neg';
      });
      var svc = function (nm) { nm = nm.trim().toLowerCase(); return M.services.filter(function (x) { return x.name.trim().toLowerCase() === nm; })[0]; };
      var sum = function (L) { var rev = 0, cost = 0, miss = {}; L.forEach(function (l) { dealLines(l).forEach(function (x) { rev += x.price * x.qty * perYear(x.per); var s = svc(x.name); if (s && s.cost != null) cost += yr(s.cost, s.costPer) * x.qty; else miss[x.name] = 1; }); }); return { rev: rev, cost: cost, miss: Object.keys(miss) }; };
      var signed = D.leads.filter(function (l) { return l.status === 'signed'; }), open = D.leads.filter(function (l) { return l.status === 'proposal'; });
      var A = sum(signed), O = sum(open), run = M.running.reduce(function (n, x) { return n + yr(x.amount, x.per); }, 0), profit = A.rev - A.cost - run;
      c3.textContent = ''; c3.appendChild(el('h3', null, 'The numbers, a year'));
      var t = el('table'), add = function (a, b, cls) { var r = el('tr', cls || null); r.appendChild(el('td', null, a)); r.appendChild(el('td', 'n', b)); t.appendChild(r); };
      add('Brought in by ' + plural(signed.length, 'signed sponsor'), money(A.rev));
      add('Cost to deliver what they bought', '−' + money(A.cost));
      add('Running costs', '−' + money(run));
      add('Profit', (profit < 0 ? '−' : '') + money(Math.abs(profit)) + (A.rev ? ' (' + Math.round(profit / A.rev * 100) + '%)' : ''), 'tot');
      add('Profit a month', (profit < 0 ? '−' : '') + money(Math.round(Math.abs(profit) / 12)));
      var tw = el('div', 'tw'); tw.appendChild(t); c3.appendChild(tw);
      if (A.miss.length) c3.appendChild(el('p', 'warnline', 'No cost entered for: ' + A.miss.join(', ') + '. Add it under Services (same name) for a true profit.'));
      if (open.length) c3.appendChild(el('p', null, 'If the ' + plural(open.length, 'open proposal') + ' all signed: ' + money(O.rev) + ' more brought in, ' + money(O.rev - O.cost) + ' more profit a year' + (O.miss.length ? ' (no cost entered for ' + O.miss.join(', ') + ')' : '') + '.'));
      if (!signed.length) c3.appendChild(el('p', null, 'No sponsors signed yet; this fills in as they sign.')).style.color = 'var(--soft)';
    }
    calc();
  }

  /* ---- who is on the desk and what each has done (2026-10-24) ---- */
  function teamTable() {
    var T = S.data.team || {}, names = Object.keys(T); if (!names.length) return null;
    var t = el('table'), h = el('tr'); ['Person', 'Notes', 'Status changes', 'Tours', 'Proposals', 'Signed', 'Last on'].forEach(function (x, i) { h.appendChild(el('th', i ? 'n' : null, x)); }); t.appendChild(h);
    names.forEach(function (n) { var a = T[n] || {}, r = el('tr'); [n, a.note || 0, a.status || 0, a.tour || 0, a.proposal || 0, a.signed || 0, a.last ? ago(a.last) : 'not yet'].forEach(function (v, i) { r.appendChild(el('td', i ? 'n' : null, String(v))); }); t.appendChild(r); });
    var tw = el('div', 'tw'); tw.appendChild(t); return tw;
  }

  /* ---- packages (anyone signed in since 2026-10-21: Brandon's code has the same powers as Matthew's) ---- */
  function drawPk() {
    main.appendChild(el('h2', null, 'Packages'));
    main.appendChild(el('p', null, 'What a proposal can offer. Peak’s published prices are the court ($12,000 a year) and title ($24,000 a year) sponsorships; new tiers need Peak’s OK. Changes show in the next proposal; proposals already made keep their prices.')).style.color = 'var(--soft)';
    var box = el('div', 'card'), rows = [];
    var add = function (p) { var r = el('div', 'pkrow'); var n = el('input'); n.value = p.name || ''; n.placeholder = 'Name'; var pr = el('input'); pr.value = p.price != null ? p.price : ''; pr.placeholder = '$'; pr.inputMode = 'numeric'; var per = el('input'); per.value = p.per || ''; per.placeholder = 'per'; var x = el('button', 'btn ghost small', '×'); x.type = 'button'; x.addEventListener('click', function () { r.remove(); rows.splice(rows.indexOf(o), 1); }); var o = { n: n, pr: pr, per: per, note: p.note || '' }; rows.push(o); [n, pr, per, x].forEach(function (e) { r.appendChild(e); }); box.insertBefore(r, addb); };
    var addb = el('button', 'lnk', '+ Add a package'); addb.type = 'button'; addb.addEventListener('click', function () { add({}); }); box.appendChild(addb);
    S.data.packages.forEach(add);
    var sv = el('button', 'btn small', 'Save packages'); sv.type = 'button'; sv.style.display = 'block'; sv.style.marginTop = '10px';
    sv.addEventListener('click', function () { save('packages', { packages: rows.map(function (o) { return { name: o.n.value, price: parseInt(String(o.pr.value).replace(/\D/g, ''), 10) || 0, per: o.per.value, note: o.note }; }) }, 'Packages saved'); });
    box.appendChild(sv); main.appendChild(box);
  }

  /* ---- the two reading tabs (2026-10-21, Matthew: "one for What they are offering their sponsors already, and one for what we could
     offer or do better"); written by tools/build_leads.py into the seed. Each row: title, detail, source, link ---- */
  function srcLine(name, url) {
    if (!name && !url) return null;
    var s = el('small', 'src', 'Source: ');
    if (url) { var a = el('a', null, name || url); a.href = url; a.target = '_blank'; a.rel = 'noopener'; s.appendChild(a); } else s.appendChild(document.createTextNode(name));
    return s;
  }
  function drawInfo(title, secs) {
    main.appendChild(el('h2', null, title));
    if (!secs || !secs.length) { main.appendChild(el('p', 'soft', 'Nothing here yet.')); return; }
    secs.forEach(function (sec) {
      var c = el('div', 'card info'); c.appendChild(el('h3', null, sec.h));
      if (sec.p) c.appendChild(el('p', 'soft', sec.p));
      if (sec.table) {
        var t = el('table'), h = el('tr'); sec.cols.forEach(function (x) { h.appendChild(el('th', null, x)); }); t.appendChild(h);
        sec.table.forEach(function (r) { var tr = el('tr'); tr.appendChild(el('td', null, r[0])); tr.appendChild(el('td', null, r[1])); var td = el('td', null, r[2]); if (r[3]) { td.appendChild(el('br')); var a = el('a', null, 'source'); a.href = r[3]; a.target = '_blank'; a.rel = 'noopener'; td.appendChild(a); } tr.appendChild(td); t.appendChild(tr); });
        var tw = el('div', 'tw'); tw.appendChild(t); c.appendChild(tw);
      }
      (sec.rows || []).forEach(function (r) {
        var d = el('div', 'irow'); d.appendChild(el('b', null, r[0])); d.appendChild(el('div', null, r[1]));
        var s = srcLine(r[2], r[3]); if (s) d.appendChild(s); c.appendChild(d);
      });
      main.appendChild(c);
    });
  }

  load();
})();
</script>
